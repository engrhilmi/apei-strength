<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEIs Strength Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;800&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: calm, exact, office-grade — a register clerks trust and HQ can brief from.
IDEA: the garrison "strength return" ledger: ruled tables, totals rows, a stamped header band.
PICTURE: the live strength summary table itself, first thing on the dashboard.
COLOUR and TYPE: oxford-blue band, white ledger panels, crimson only for deficits/alerts; Red Hat Display + Text.
LAYOUT: sticky band + role-based tabs; content max 1400px; tables scroll sideways on phones.
*/
:root{color-scheme:light dark;
--bg:light-dark(#eef1f6,#0b1220);--panel:light-dark(#ffffff,#121b2e);--ink:light-dark(#0f1b33,#e6ebf5);--mute:light-dark(#5b6782,#9aa6c0);
--line:light-dark(#d5dbe7,#26324a);--band:#0b1f4b;--band2:#14306e;--soft:light-dark(#eef3ff,#17244a);
--red:light-dark(#b3122a,#ff6b7f);--redsoft:light-dark(#fde8eb,#3a1520);--ok:light-dark(#0f6b5c,#5fd3bd);--oksoft:light-dark(#e3f4f0,#10302b);
--amber:light-dark(#8a5a00,#f2c066);--ambersoft:light-dark(#fff4dc,#33270d);--focus:#2f6bff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Red Hat Display",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
.band{background:var(--band);color:#fff;padding:12px max(3vw,14px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.band h1{font-size:20px;font-weight:800}.band small{display:block;opacity:.8;font-size:13px;margin-top:3px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);font-weight:700;white-space:nowrap}
.demo{background:#c8102e}
nav{background:var(--band2);display:flex;gap:2px;overflow-x:auto;padding:0 max(3vw,10px);position:sticky;top:var(--bandH,62px);z-index:29}
nav a{flex:none;color:#cfd9f2;text-decoration:none;padding:11px 14px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav a.on{color:#fff;border-bottom-color:#fff}nav a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:#c8102e;color:#fff;font-size:12px;text-align:center;margin-left:5px}
main{max-width:1400px;margin:0 auto;padding:16px max(3vw,12px) 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel>h2{font-size:17px;margin-bottom:10px}.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}.ph h2{font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.kpi b{display:block;font:800 clamp(20px,2.4vw,26px)/1.1 "Red Hat Display",sans-serif;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute)}.kpi i{font-style:normal;font-size:12.5px;color:var(--mute);display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:700;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sub td{background:var(--soft);font-weight:700}tr.tot td{background:var(--band);color:#fff;font-weight:800}
tr.tot .pos,tr.tot .neg{color:#fff}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.secrow td{color:var(--mute);font-size:13px}tr.secrow td:first-child{padding-left:26px}
tr.void td{text-decoration:line-through;opacity:.55}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.t-in{background:var(--oksoft);color:var(--ok)}.t-out{background:var(--redsoft);color:var(--red)}.t-mid{background:var(--ambersoft);color:var(--amber)}.t-n{background:var(--soft);color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 13px;font-weight:700;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--focus)}.btn.p{background:var(--band);border-color:var(--band);color:#fff}.btn.r{color:var(--red)}.btn.s{min-height:30px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.band .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:12.5px;font-weight:700;color:var(--mute)}
.f input,.f select,.f textarea,select.in,input.in{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;min-height:40px;font-size:15px;width:100%}
.entry{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px}
.combo{position:relative}.combo-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel);border:1px solid var(--focus);border-radius:7px;max-height:300px;overflow:auto;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.combo-list div{padding:7px 10px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}.combo-list div.hi{background:var(--soft);font-weight:700}.combo-list div small{color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin-top:8px}.hint kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13.5px}.pill.on{background:var(--band);color:#fff;border-color:var(--band)}
.secchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;margin:2px;font-size:13px;background:var(--panel)}
.secchip button{border:0;background:none;color:var(--red);cursor:pointer;font-weight:800;padding:2px 5px}.secchip button:disabled{color:var(--mute);cursor:not-allowed}
.toast{position:fixed;right:16px;bottom:16px;z-index:99;background:#0f1b33;color:#fff;padding:11px 15px;border-radius:8px;font-weight:700;max-width:min(440px,90vw);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}.toast.err{background:#b3122a}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal>div{background:var(--panel);border-radius:12px;max-width:560px;width:100%;padding:18px;border:1px solid var(--line)}
.modal h3{font-size:18px;margin-bottom:12px}.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.login{max-width:440px;margin:8vh auto;padding:0 12px}.login .panel{padding:22px}
.note{background:var(--ambersoft);color:var(--amber);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
textarea.brief{width:100%;min-height:340px;font:13px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel)}
td input.in,td select.in{min-height:32px;padding:4px 6px;font-size:13px;width:auto;max-width:180px}
td input.num{width:64px}
.empty{color:var(--mute);padding:14px;text-align:center}
#printView{display:none}
@media print{body{background:#fff;color:#000}.band,nav,main,.toast,.modal{display:none!important}#printView{display:block!important;padding:0}
 #printView table{font-size:11px}#printView th{background:#e9eefb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#printView tr.tot td{background:#0b1f4b!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:600px){.band{position:static}nav{top:0}.band h1{font-size:17px}main{padding:10px 8px 50px}.panel{padding:10px}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.f.wide{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}

.mute{color:var(--mute)}
.brandrow{display:flex;gap:12px;align-items:center}.logo{height:44px;width:auto;background:#fff;border-radius:6px;padding:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.two>.panel{margin-bottom:14px}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
tr.bad td{background:var(--redsoft)}
details>summary{cursor:pointer;font-weight:700;margin:4px 0}
.livehead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}.livehead h2{font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.card.wide{grid-column:1/-1}
.cardhead{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%}
.cardhead .big{font:800 26px/1 "Red Hat Display",sans-serif;font-variant-numeric:tabular-nums}.cardhead .big small{font-size:14px;color:var(--mute);font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:99px;margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--band2);border-radius:99px}.bar i.over{background:#c8102e}
.cardrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--mute)}.cardrow b{color:var(--ink)}
.rlayout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1000px){.rlayout{grid-template-columns:minmax(0,1fr)}}
.designer{display:flex;flex-direction:column;gap:8px;font-size:14px}.designer details{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.designer .f{margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:inline-flex;align-items:center;gap:6px;margin:3px 10px 3px 0;cursor:pointer}.ck input{width:18px;height:18px}
.blk{border-top:1px solid var(--line);padding:6px 0}.blk:first-of-type{border-top:0}.blkh{display:flex;justify-content:space-between;align-items:center;gap:6px}.blkh .btn{min-height:28px;padding:2px 7px}
.blkb{padding:4px 0 6px 26px}.blk:not(.on) .blkh b{font-weight:500;color:var(--mute)}.cols{display:flex;flex-wrap:wrap}
.rprev{background:#d9dee8;border-radius:10px;padding:12px;overflow:auto;max-height:calc(100vh - var(--bandH,62px) - 70px);position:sticky;top:calc(var(--bandH,62px) + 56px)}
.paper{background:#fff;color:#111;font:var(--fs,11px)/1.35 "Red Hat Text",Arial,sans-serif;padding:14px 16px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15);width:max-content;min-width:100%}
.paper .phead{display:flex;align-items:center;gap:12px;border-bottom:2px solid #0b1f4b;padding-bottom:6px;margin-bottom:8px}.paper .phead img{height:46px}
.paper .phead h2{font:800 calc(var(--fs,11px) + 6px)/1.15 "Red Hat Display",Arial,sans-serif;color:#0b1f4b;margin:0}.paper .phead p{margin:2px 0 0}.paper .pmeta{margin-left:auto;text-align:right;font-size:calc(var(--fs,11px) - 1px);color:#333}
.paper .rblock{margin:8px 0 12px;break-inside:avoid}.paper .rh{font-size:calc(var(--fs,11px) + 2px);margin:8px 0 4px;color:#0b1f4b;text-align:center}
.rt{border-collapse:collapse;width:100%;font-size:var(--fs,11px);margin-bottom:8px;color:#111}.rt caption{background:#0b1f4b;color:#fff;font-weight:800;padding:4px 6px;text-align:center;caption-side:top}
.rt th{background:#dfe6f5;color:#0b1f4b;font-weight:700;border:1px solid #9aa6c0;padding:2px 4px;position:static;white-space:normal;line-height:1.15;vertical-align:bottom}.rt td{border:1px solid #c3cad8;padding:2px 4px;white-space:nowrap}
.rt td.n,.rt th.n{text-align:right;font-variant-numeric:tabular-nums}.rt tr.sub td{background:#eef2fa;font-weight:700}.rt tr.tot td{background:#0b1f4b;color:#fff;font-weight:800}.rt tr.secrow td{color:#555}
.rt td.neg{color:#b3122a}.rt td.pos{color:#0f6b5c}.rt tr.tot td.neg,.rt tr.tot td.pos{color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(var(--per,3),max-content);gap:10px;align-items:start;justify-content:start}.rgrid .rt{width:min-content;margin:0}
.rkpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.rkpis div{border:1px solid #c3cad8;border-radius:6px;padding:5px 7px}.rkpis span{display:block;color:#444;font-size:calc(var(--fs,11px) - 1px)}.rkpis b{font:800 calc(var(--fs,11px) + 7px)/1.1 "Red Hat Display",Arial;color:#0b1f4b}.rkpis i{display:block;font-style:normal;color:#555;font-size:calc(var(--fs,11px) - 1.5px)}
.rsign{display:flex;justify-content:space-around;gap:20px;margin-top:40px}.rsign div{text-align:center;min-width:160px}.rsign span{display:block;border-top:1px solid #111;margin-bottom:4px}
.rtext{margin:4px 0}.pfoot{border-top:1px solid #c3cad8;margin-top:10px;padding-top:4px;color:#444;font-size:calc(var(--fs,11px) - 1px)}
.paper.bw .rt caption,.paper.bw .rt tr.tot td{background:#333}.paper.bw .rt th{background:#e5e5e5;color:#111}.paper.bw .rt td.neg,.paper.bw .rt td.pos{color:inherit}.paper.bw .phead{border-color:#111}.paper.bw .phead h2,.paper.bw .rh,.paper.bw .rkpis b{color:#111}
.qrbox{width:240px;max-width:100%;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}.qrbox svg{width:100%;height:auto;display:block}
.qrcard{text-align:center;padding:30px;font-family:Arial,sans-serif}.qrcard svg{width:300px;height:300px}.qrcard h2{margin:6px 0}.steps{padding-left:20px}.steps li{margin:6px 0}
@media print{#printView .paper{box-shadow:none;padding:0;min-width:0}#printView .rt th,#printView .rt caption,#printView .rt tr.tot td,#printView .rt tr.sub td{-webkit-print-color-adjust:exact;print-color-adjust:exact}#printView .rblock{break-inside:auto}#printView .rt{break-inside:auto}#printView .rgrid .rt{break-inside:avoid}}
.only-narrow{display:none}@media(max-width:700px){.only-wide{display:none}.only-narrow{display:grid}}
tr.sel td{background:var(--soft)}tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--band2)}.card.sel{border-color:var(--band2);box-shadow:inset 0 0 0 1px var(--band2)}
.paper.flow .rrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;margin:10px 0}.paper.flow .rrow .rblock{margin:0;flex:0 0 auto}.paper.flow .rrow .rt{width:min-content}
.fitnote{margin:0 0 8px;font-size:13.5px;color:#1c2740;background:#fff;border-radius:6px;padding:6px 10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="printView"></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

  if(p.length===1 && p[0].length===8) p=[p[0].slice(0,2),p[0].slice(2,4),p[0].slice(4)];

}

const secCap = (sc, sec) => Number(sec.cap ?? sc.cap ?? 35);
function cur(code, cl, sec){
  const d=(S.strength[code]||{}).d||{}; const x=S.schools[code]?.classes.find(c=>c.cl===cl)?.secs.find(z=>z.s===sec) || {g:0,b:0};
  return { g:(x.g||0)+(d[K(cl,sec,"g")]||0), b:(x.b||0)+(d[K(cl,sec,"b")]||0) };
}
const manualWait = (code, cl) => Number(((S.strength[code]||{}).w||{})[cl] ?? 0) || 0;
function waitCount(code, cl){ return manualWait(code,cl) + S.waiting.filter(w=>w.school===code && w.cl===cl && waitCounted(w.status)).length; }
function lvlOf(c){ if(c.lvl) return c.lvl; let b=String(c.cl).replace(/\s*\(.*$/,"").trim().split(/\s+/)[0]; if(/^pre-?(1|i)$/i.test(b)) b="Pre-I"; return b; }
function classStats(code, c){
  const sc=S.schools[code]; let g=0,b=0,auth=0;
  const secs=c.secs.map(x=>{ const v=cur(code,c.cl,x.s); g+=v.g; b+=v.b; const a=secCap(sc,x); auth+=a; return {s:x.s,g:v.g,b:v.b,str:v.g+v.b,auth:a,sd:v.g+v.b-a}; });
  return { cl:c.cl, grp:c.grp, lvl:lvlOf(c), n:c.secs.length, inc:Number(c.inc)||0, auth, g, b, str:g+b, sd:g+b-auth, wait:waitCount(code,c.cl), secs };
}
function addUp(list){ const t={n:0,inc:0,auth:0,g:0,b:0,str:0,wait:0,net:0,in:0,out:0}; for(const x of list) for(const k in t) t[k]+=Number(x[k])||0; t.sd=t.str-t.auth; return t; }
function schoolStats(code, w, rows){
  const sc=S.schools[code]; const cls=sc.classes.map(c=>classStats(code,c)); const t=addUp(cls);
  if(w){ const m=moveCounts(code, rows||S.recentTx, w); t.net=m.net; t.in=m.in; t.out=m.out; }
  return {...t, classes:cls, code, name:sc.name, grp:sc.grp||"APSACS", gtype:sc.gtype||"mixed"};
}
function moveCounts(code, rows, w){
  const r={in:0,out:0,net:0,by:{}};
  for(const t of rows){ const tm=t.effMs||t.atMs; if(t.status!=="ok"||(code&&t.school!==code)||tm<w.from||tm>w.to) continue; const d=AD(t.action);
    r.by[t.action]=(r.by[t.action]||0)+1; if(d>0) r.in++; if(d<0) r.out++; r.net+=d; }
  return r;
}
function genderFor(code, cl){ if(/girls/i.test(cl)) return "g"; if(/boys/i.test(cl)) return "b"; const t=S.schools[code]?.gtype; return t==="girls"?"g":t==="boys"?"b":""; }
function effects(tx){
  const k=actDef(tx.action).kind;
  if(k==="sec") return [[tx.school,tx.cl,tx.sec,-1],[tx.school,tx.toCl||tx.cl,tx.toSec,1]];
  const d=KIND_D[k]||0; return d ? [[tx.school,tx.cl,tx.sec,d]] : [];
}
function consolidate(codes){
  const map=new Map();
  for(const code of codes) for(const c of S.schools[code].classes){ const st=classStats(code,c); const m=map.get(st.lvl)||{cl:st.lvl,n:0,inc:0,auth:0,g:0,b:0,str:0,wait:0};
    for(const k of ["n","inc","auth","g","b","str","wait"]) m[k]+=st[k]; map.set(st.lvl,m); }
  for(const m of map.values()) m.sd=m.str-m.auth;
  const out=[], used=new Set();
  for(const sg of stages()){ const rows=sg.levels.map(l=>map.get(l)).filter(Boolean); rows.forEach(r=>used.add(r.cl)); if(rows.length) out.push({stage:sg.name, rows}); }
  const rest=[...map.values()].filter(r=>!used.has(r.cl)); if(rest.length) out.push({stage:"Other", rows:rest});
  return out;
}

/* ---------- periods ---------- */
function cutoffWindow(timeStr){
  const [hh,mm]=(timeStr||ST().cutoff||"08:00").split(":").map(Number);
  const now=new Date(), c=new Date(now); c.setHours(hh,mm||0,0,0); if(now<c) c.setDate(c.getDate()-1);
  return { from:c.getTime(), to:now.getTime() };
}
function periodWin(kind, from, to){
  const now=Date.now(), d0=new Date(); d0.setHours(0,0,0,0);
  switch(kind){
    case "today": return {from:d0.getTime(), to:now};
    case "yesterday": { const y=new Date(d0); y.setDate(y.getDate()-1); return {from:y.getTime(), to:d0.getTime()-1}; }
    case "7d": return {from:now-7*864e5, to:now};
    case "month": { const m=new Date(d0); m.setDate(1); return {from:m.getTime(), to:now}; }
    case "session": return {from:Date.parse((ST().sessionStart||"2026-04-01")+"T00:00")||now-365*864e5, to:now};
    case "custom": return {from:Date.parse((from||isoDay(now))+"T00:00"), to:Date.parse((to||isoDay(now))+"T23:59:59")};
    default: return cutoffWindow();
  }
}
const periodLabel = (kind, w) => kind==="cutoff" ? `since ${fmtDT(w.from)}` : kind==="custom" ? `${fmtD(w.from)} to ${fmtD(w.to)}` : (PERIODS[kind]||"").toLowerCase();
async function getTx(w){
  if(w.from >= Date.now()-7*864e5) return S.recentTx.filter(t=>(t.effMs||t.atMs)>=w.from && (t.effMs||t.atMs)<=w.to);
  const key=Math.floor(w.from/6e4)+"_"+Math.floor(w.to/6e5); const c=S.txCache[key];
  if(c && Date.now()-c.at<60e3) return c.rows;
  const rows=(await DB.fetchTx(w.from-8*864e5,w.to)).filter(t=>(t.effMs||t.atMs)>=w.from && (t.effMs||t.atMs)<=w.to); S.txCache[key]={at:Date.now(),rows}; return rows;
}

function txToOps(ops, tx){

function voidToOps(ops, tx, reason){
  ops.upd.push({ col:"transactions", id:tx.id, data:{ status:"void", voidBy:me().name||me().uid, voidAt:TS, voidReason:reason||"" } });

}

const Local = {
  KEY:"apeis_demo_v4", st:null,
  load(){ try{ this.st = JSON.parse(localStorage.getItem(this.KEY)); }catch(e){ this.st=null; } if(!this.st) this.seed(); },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.st)); }catch(e){} },
  seed(){
    const st = { meta:{setup:{at:Date.now()}}, settings:{ app:defaultSettings() }, schools:{}, strength:{}, transactions:{}, transfers:{}, waiting:{}, users:{}, snapshots:{} };
    for (const sc of buildSeed()){ const w=sc._w; delete sc._w; st.schools[sc.code]=sc; st.strength[sc.code]={d:{},w}; }
    const U = [["sa","Super Admin (you)","superadmin","ALL"],["hq","DQ Office","hq","ALL"],["sr","Comdt (Senior)","viewer","ALL"],["pr-gaps","Principal GAPS","principal","GAPS"],
      ["c-jm","Clerk JM","clerk","JM"],["c-mid","Clerk MidWsk","clerk","MidWsk"],["c-gaps","Clerk GAPS","clerk","GAPS"],["c-gc","Clerk GC","clerk","GC"],["c-bc","Clerk BC","clerk","BC"],["c-apsis","Clerk APSIS","clerk","APSIS"]];
    for (const [uid,name,role,school] of U) st.users[uid]={ uid, name, role, school, email:uid+"@"+LOGIN_DOMAIN, active:true };
    this.st = st; this.save();
  },
  pull(){
    const st=this.st, cut=Date.now()-8*864e5, V=c=>Object.entries(st[c]||{}).map(([id,v])=>({id,...v}));
    S.settings = st.settings.app || {}; S.schools = st.schools;
    S.strength = Object.fromEntries(Object.entries(st.strength).map(([k,v])=>[k,{d:v.d||{},w:v.w||{}}]));
    S.recentTx = V("transactions").map(t=>({...t, atMs:toMs(t.at)})).filter(t=>t.atMs>=cut).sort((a,b)=>b.atMs-a.atMs);
    S.transfers = V("transfers").filter(t=>["pending","rejected"].includes(t.status)).map(t=>({...t, atMs:toMs(t.at)}));
    S.waiting = V("waiting").filter(w=>w.session===session()&&!w.deleted).map(w=>({...w, atMs:toMs(w.at)}));
    S.users = Object.values(st.users);
    S.snapshots = V("snapshots").sort((a,b)=>a.day.localeCompare(b.day));
  },
  async start(){ this.load(); this.pull(); let uid=null; try{ uid=localStorage.getItem(this.KEY+"_who"); }catch(e){}
    S.user = uid && this.st.users[uid] ? this.st.users[uid] : null; S.ready=true; boot(); if(S.user) ensureSnapshot(); },
  demoLogin(uid){ try{ localStorage.setItem(this.KEY+"_who", uid); }catch(e){} S.user=this.st.users[uid]; S.view=homeView(); S.dashSchool=null; location.hash=S.view; boot(); ensureSnapshot(); },
  async signOut(){ try{ localStorage.removeItem(this.KEY+"_who"); }catch(e){} S.user=null; boot(); },
  async apply(ops){

    for (const x of ops.set){ st[x.col] ||= {}; if(x.col==="settings"&&x.id==="app"&&!x.merge){ st.settings.app=fix(x.data); continue; }
      st[x.col][x.id] = x.merge ? {...(st[x.col][x.id]||{}), ...fix(x.data)} : fix(x.data); }
    for (const x of ops.upd){ if(!st[x.col]?.[x.id]) throw new Error("Record not found"); Object.assign(st[x.col][x.id], fix(x.data)); }
    for (const x of ops.inc){ const d=(st.strength[x.school] ||= {d:{},w:{}}).d; d[x.key]=(d[x.key]||0)+x.n; if(!d[x.key]) delete d[x.key]; }
    for (const x of (ops.wait||[])){ const w=(st.strength[x.school] ||= {d:{},w:{}}).w ||= {}; w[x.cl]=x.n; }
    if (ops.set.some(x=>x.col==="users") && S.user) S.user = st.users[S.user.uid] || S.user;
    this.save(); this.pull(); refresh();

  async allDocs(c){ return Object.entries(this.st[c]||{}).map(([id,v])=>({id,...v})); },

  async backup(){ return this.st; },
  async changePw(){ toast("Demo mode: passwords are not used."); },

const Fire = {
  m:{}, app:null, auth:null, db:null, unsub:[],
  async start(){
    const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A,Au,F] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
    this.m = {...A,...Au,...F};
    const m=this.m; this.app = m.initializeApp(FIREBASE_CONFIG);
    this.auth = m.getAuth(this.app);
    try { this.db = m.initializeFirestore(this.app, { localCache: m.persistentLocalCache({ tabManager: m.persistentMultipleTabManager() }) }); }
    catch(e){ this.db = m.getFirestore(this.app); }
    m.onAuthStateChanged(this.auth, u => this.onAuth(u));
  },
  async onAuth(u){
    const m=this.m; this.stop();
    if(!u){ S.user=null; S.ready=true; boot(); return; }
    try{
      const ps = await m.getDoc(m.doc(this.db,"users",u.uid));
      if(!ps.exists()){
        const setup = await m.getDoc(m.doc(this.db,"meta","setup")).catch(()=>null);
        S.user = { uid:u.uid, email:u.email, pending:true, setupDone: !!(setup && setup.exists()) }; S.ready=true; boot(); return;
      }
      const p = ps.data(); S.user = { ...p, uid:u.uid, email:u.email };
      if(!p.active){ S.user.inactive=true; S.ready=true; boot(); return; }
      await this.listen(); S.ready=true; if(!location.hash) S.view=homeView(); boot(); ensureSnapshot();
    }catch(e){ S.user={ uid:u.uid, email:u.email, error:e.message }; S.ready=true; boot(); }
  },
  listen(){
    const m=this.m, db=this.db, on=(q,f)=>this.unsub.push(m.onSnapshot(q,f,e=>toast("Sync error: "+e.message,true)));
    const data = d => ({ id:d.id, ...d.data({serverTimestamps:"estimate"}) });
    const first={}; let done; const ready=new Promise(r=>done=r); const got=k=>{ first[k]=1; if(first.settings&&first.schools&&first.strength) done(); };
    const waitNow=()=>{ S.waiting=(this.waitAll||[]).filter(w=>w.session===session()&&!w.deleted); };
    on(m.doc(db,"settings","app"), d=>{ S.settings=d.data()||{}; waitNow(); got("settings"); refresh(); });
    on(m.collection(db,"schools"), q=>{ S.schools=Object.fromEntries(q.docs.map(d=>[d.id,data(d)])); got("schools"); refresh(); });
    on(m.collection(db,"strength"), q=>{ S.strength=Object.fromEntries(q.docs.map(d=>{ const x=d.data(); return [d.id,{d:x.d||{},w:x.w||{}}]; })); got("strength"); refresh(); });
    on(m.query(m.collection(db,"transactions"), m.where("at",">=", m.Timestamp.fromMillis(Date.now()-8*864e5))),
       q=>{ S.recentTx=q.docs.map(d=>{const x=data(d); x.atMs=toMs(x.at); return x;}).sort((a,b)=>b.atMs-a.atMs); refresh(); });
    on(m.query(m.collection(db,"transfers"), m.where("status","in",["pending","rejected"])),
       q=>{ S.transfers=q.docs.map(d=>{const x=data(d); x.atMs=toMs(x.at); return x;}); refresh(); });
    on(m.collection(db,"waiting"), q=>{ this.waitAll=q.docs.map(d=>{const x=data(d); x.atMs=toMs(x.at); return x;}); waitNow(); refresh(); });
    on(m.query(m.collection(db,"snapshots"), m.where("day",">=", isoDay(Date.now()-400*864e5))), q=>{ S.snapshots=q.docs.map(data).sort((a,b)=>a.day.localeCompare(b.day)); refresh(); });
    if(isSA()) on(m.collection(db,"users"), q=>{ S.users=q.docs.map(d=>({uid:d.id,...d.data()})); refresh(); });
    return Promise.race([ready, sleep(9000)]);
  },
  stop(){ this.unsub.forEach(f=>f()); this.unsub=[]; },
  async signIn(email,pw){ await this.m.signInWithEmailAndPassword(this.auth, asEmail(email), pw); },
  async signOut(){ await this.m.signOut(this.auth); },
  async resetPw(email){ await this.m.sendPasswordResetEmail(this.auth, asEmail(email)); },
  async changePw(pw){ await this.m.updatePassword(this.auth.currentUser, pw); toast("Password changed."); },
  conv(o){ const r={}; for(const [k,v] of Object.entries(o)) r[k] = v===TS ? this.m.serverTimestamp() : v; return r; },
  async apply(ops, quiet){
    const m=this.m, db=this.db; let b=m.writeBatch(db), n=0; const batches=[b];
    const step=()=>{ if(++n>=400){ b=m.writeBatch(db); batches.push(b); n=0; } };
    for (const x of ops.set){ b.set(m.doc(db,x.col,x.id), this.conv(x.data), x.merge?{merge:true}:{}); step(); }
    for (const x of ops.upd){ b.update(m.doc(db,x.col,x.id), this.conv(x.data)); step(); }
    const by={}; for (const x of ops.inc) (by[x.school] ||= []).push(new m.FieldPath("d",x.key), m.increment(x.n));
    for (const x of (ops.wait||[])) (by[x.school] ||= []).push(new m.FieldPath("w",x.cl), x.n);
    for (const [sc,args] of Object.entries(by)){ b.update(m.doc(db,"strength",sc), ...args); step(); }
    const p = Promise.all(batches.map(x=>x.commit()));
    const r = await Promise.race([p.then(()=>"ok"), sleep(3500).then(()=>"slow")]);
    if (r==="slow"){ if(!quiet) toast("Saved on this device — will sync when the connection returns."); p.catch(e=>toast("Sync FAILED: "+e.message,true)); }
  },
  async fetchTx(from,to){
    const m=this.m; const q=m.query(m.collection(this.db,"transactions"), m.where("at",">=",m.Timestamp.fromMillis(from)), m.where("at","<=",m.Timestamp.fromMillis(to)), m.orderBy("at","desc"));
    return (await m.getDocs(q)).docs.map(d=>{ const x={id:d.id,...d.data()}; x.atMs=toMs(x.at); return x; });
  },
  async allDocs(c){ return (await this.m.getDocs(this.m.collection(this.db,c))).docs.map(d=>({id:d.id,...d.data()})); },
  async bootstrap(name){
    const m=this.m, db=this.db, u=this.auth.currentUser;
    let b=m.writeBatch(db);
    b.set(m.doc(db,"users",u.uid), { name, email:u.email, role:"superadmin", school:"ALL", active:true, createdAt:m.serverTimestamp() });
    b.set(m.doc(db,"meta","setup"), { at:m.serverTimestamp(), by:u.uid });
    await b.commit();
    b=m.writeBatch(db);
    b.set(m.doc(db,"settings","app"), defaultSettings());
    for (const sc of buildSeed()){ const w=sc._w; delete sc._w; b.set(m.doc(db,"schools",sc.code), sc); b.set(m.doc(db,"strength",sc.code), {d:{},w}); }
    await b.commit();
    await this.onAuth(u);
  },
  async createUser(u){
    const m=this.m; const sec = m.getApps().find(a=>a.name==="userMaker") || m.initializeApp(FIREBASE_CONFIG,"userMaker");
    const sa = m.getAuth(sec); const cred = await m.createUserWithEmailAndPassword(sa, asEmail(u.email), u.password);
    await m.signOut(sa);
    await m.setDoc(m.doc(this.db,"users",cred.user.uid), { name:u.name, email:asEmail(u.email), role:u.role, school:u.school, active:true, createdAt:m.serverTimestamp() });
  },
  async backup(){
    const out={};
    for (const c of ["settings","schools","strength","users","transfers","waiting","transactions","snapshots"]) out[c]=Object.fromEntries((await this.allDocs(c)).map(d=>[d.id,d]));
    return JSON.parse(JSON.stringify(out, (k,v)=> v && typeof v.toMillis==="function" ? new Date(v.toMillis()).toISOString() : v));
  }
};
const DB = DEMO ? Local : Fire;

function buildSeed(){
  return SEED.map((c,i)=>({ code:c.code, name:c.name, cap:c.cap, grp:c.grp, gtype:c.gtype, order:i+1, active:true,
    classes:c.rows.map(([grp,cl,w,inc,secs])=>({ grp, cl, inc, secs:secs.map(([s,g,b])=>({s,g,b})) })),
    _w:Object.fromEntries(c.rows.filter(r=>r[2]).map(r=>[r[1],r[2]])) }));
}

function renderView(){
  const main=$("#main"); if(!main) return;
  $("#nav").innerHTML=navHtml();

function fillRegion(id, force){
  const el=document.getElementById(id); const V=VIEWS[S.view]; if(!el||!V.regions?.[id]) return;
  if(!force && el.contains(document.activeElement) && document.activeElement!==document.body){ pendingRegions.add(id); return; }
  el.innerHTML=V.regions[id]();
}
let rq=false;
function refresh(){
  S.lastChange=Date.now();
  if(rq) return; rq=true;
  requestAnimationFrame(()=>{ rq=false;
    if(!S.user || S.user.pending || !$("#main")){ if(S.user && !S.user.pending && !$("#main")) boot(); return; }
    $("#nav").innerHTML=navHtml();
    const V=VIEWS[S.view]; for (const id of Object.keys(V.regions||{})) fillRegion(id,false);
    V.live && V.live();
  });
}
document.addEventListener("focusout", ()=> setTimeout(()=>{ for(const id of [...pendingRegions]){ const el=document.getElementById(id); if(el && !el.contains(document.activeElement)){ pendingRegions.delete(id); fillRegion(id,true);} } }, 50));
window.addEventListener("hashchange", ()=>{ const v=location.hash.slice(1); if(S.user && NAV.some(n=>n[0]===v&&n[2]())){ S.view=v; renderView(); window.scrollTo(0,0);} });

function classTable(code, st, interactive){

  for(const c of st.classes){
    if(c.grp!==grp){ flush(); grp=c.grp; } acc.push(c); const op=interactive && S.open.has(code+"|"+c.cl);
    body+=statRow(`<b>${h(c.cl)}</b>${interactive?` <span class="mute">${op?"▾":"▸"}</span>`:""}`,c,cols,interactive?"click":"",interactive?`data-act="toggleClass" data-id="${h(code+"|"+c.cl)}"`:"");

  }

}
function consTable(codes){
  const cols=["n","auth","str","g","b","sd","wait"]; const C=consolidate(codes); let body="", all=[];
  for(const g of C){ body+=g.rows.map(r=>statRow(`<b>${h(r.cl)}</b>`,r,cols)).join(""); body+=statRow(`${h(L("total"))} <span class="mute">${h(g.stage)}</span>`,addUp(g.rows),cols,"sub"); all.push(...g.rows); }
  return `<table>${headRow(L("cl"),cols)}<tbody>${body}${statRow(h(L("gtotal")),addUp(all),cols,"tot")}</tbody></table>`;
}

function wireCombo(){
  const inp=$("#fCS"), list=$("#fCSList"); if(!inp) return; let hi=0, items=[];
  const sc=()=>S.schools[entrySchool()];
  const show=()=>{ items=csMatch(entrySchool(), inp.dataset.cl?"":inp.value).slice(0,14); hi=0; draw(); list.hidden=!items.length; };
  const draw=()=>{ list.innerHTML=items.map((o,i)=>{ const v=cur(entrySchool(),o.cl,o.s); const cap=secCap(sc(), sc().classes.find(c=>c.cl===o.cl).secs.find(z=>z.s===o.s));
      return `<div class="${i===hi?"hi":""}" data-i="${i}">${h(o.label)}<small>${v.g+v.b}/${cap}</small></div>`; }).join(""); };
  const pick=o=>{ if(!o) return; inp.value=o.label; inp.dataset.cl=o.cl; inp.dataset.s=o.s; list.hidden=true;
    const g=genderFor(entrySchool(),o.cl); if(g) $("#fGen").value=g; entryToggle(); fillRegion("eCls",true); };
  inp.addEventListener("input",()=>{ delete inp.dataset.cl; delete inp.dataset.s; show(); });
  inp.addEventListener("focus",()=>{ inp.select(); if(!inp.dataset.cl) show(); });
  inp.addEventListener("blur",()=>setTimeout(()=>{ list.hidden=true; if(!inp.dataset.cl && inp.value){ const m=csMatch(entrySchool(),inp.value); if(m.length===1||(m[0]&&m[0].keys.includes(norm(inp.value)))) pick(m[0]); } },120));
  inp.addEventListener("keydown",e=>{
    if(list.hidden){ if(e.key==="ArrowDown"){ show(); e.preventDefault(); } return; }
    if(e.key==="ArrowDown"){ hi=Math.min(hi+1,items.length-1); draw(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ hi=Math.max(hi-1,0); draw(); e.preventDefault(); }
    else if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); pick(items[hi]); const nx=$$("#fToSec,#fDest,#fExt,#fAdm").find(x=>!x.closest("[hidden]")); nx&&nx.focus(); }
    else if(e.key==="Tab" && !e.shiftKey){ pick(items[hi]); }
    else if(e.key==="Escape"){ list.hidden=true; }
  });

}

async function saveEntry(){
  const code=entrySchool(), inp=$("#fCS"), a=$("#fAct").value, k=actDef(a).kind;
  if(!inp.dataset.cl){ toast("Pick a valid Class – Section from the list.",true); inp.focus(); return; }
  const gender=$("#fGen").value; if(!gender){ toast("Select gender (B / G).",true); $("#fGen").focus(); return; }
  const tx={ school:code, action:a, cl:inp.dataset.cl, sec:inp.dataset.s, gender, cat:$("#fCat").value, name:$("#fName").value.trim(), father:$("#fFather").value.trim(),
    dob:parseDob($("#fDob").value), admNo:$("#fAdm").value.trim(), remarks:$("#fRem").value.trim(), eff:$("#fDate").value };
  const eff=effFromDate(tx.eff); if(eff) tx.effMs=eff;
  if(!tx.name){ toast("Student name is required.",true); $("#fName").focus(); return; }
  if(tx.dob===null){ toast("Date of birth not understood — type it like 14-03-2019.",true); $("#fDob").focus(); return; }
  const now=cur(code,tx.cl,tx.sec);
  if(KIND_D[k]<0 || k==="sec"){ if(now[gender]<=0){ toast(`No ${gender==="g"?"girls":"boys"} on roll in ${tx.cl} - ${tx.sec}. Check the section/gender.`,true); return; } }
  if(k==="sec"){ tx.toCl=tx.cl; tx.toSec=$("#fToSec").value; if(!tx.toSec){ toast("This class has no other section.",true); return; } }
  if(k==="apei_out"){ tx.toSchool=$("#fDest").value; if(tx.toSchool==="__other"){ tx.ext=$("#fExt").value.trim(); } else tx.toCl=$("#fDestCl").value; }
  if(k==="apei_in"){ tx.ext=$("#fExt").value.trim(); }
  const ops=opsNew(); buildTxOps(ops,tx);
  try{ await DB.apply(ops); }catch(e){ toast("Not saved: "+e.message,true); return; }
  const tcl=tx.toSec?tx.toCl:tx.cl, tsec=tx.toSec||tx.sec, after=cur(code,tcl,tsec), sc=S.schools[code], so=sc.classes.find(c=>c.cl===tcl)?.secs.find(z=>z.s===tsec);
  const over=(KIND_D[k]>0||k==="sec") && so && after.g+after.b>secCap(sc,so);
  toast(`Saved: ${AL(a)} — ${tx.name} (${tx.cl}-${tx.sec})`+(tx.tfrId?`. ${tx.toSchool} must accept it in Transfers.`:"")+(over?" ⚠ Section now over capacity.":""), over);
  for(const id of ["fAdm","fName","fFather","fDob","fRem","fExt"]) $("#"+id).value="";
  inp.focus(); inp.select();
}

  return `<table><tr><th>Sent</th><th>From</th><th>To</th><th>Student</th><th>Father</th><th>G</th><th>Category</th><th>Into class</th><th>Status</th><th>By</th><th></th></tr>${Lr.sort((a,b)=>b.atMs-a.atMs).map(t=>`<tr><td>${fmtDT(t.atMs)}</td><td>${h(t.from)} · ${h(t.fromCl)}-${h(t.fromSec)}</td><td>${h(t.to)}</td><td>${h(t.name)}</td><td>${h(t.father)}</td><td>${t.gender==="g"?"G":"B"}</td><td>${h(t.cat)}</td><td>${h(t.toCl)}</td>
   <td>${t.status==="pending"?`<span class="tag t-mid">in transit</span>`:`<span class="tag t-out">rejected</span> ${h(t.rejReason||"")}`}</td><td>${h(t.byName)}</td><td>${act(t)}</td></tr>`).join("")}</table>`;
}

function logFiltered(){ const sch=$("#lgSch")?.value, act=$("#lgAct")?.value, q=norm($("#lgQ")?.value||"");
  return (S.logRows||[]).filter(t=>(!sch||t.school===sch)&&(!act||t.action===act)&&(!q||norm(t.name+t.admNo+t.father).includes(q))); }
async function runLog(){ const f=$("#lgFrom"), t=$("#lgTo"); if(!f) return; const from=new Date(f.value+"T00:00").getTime(), to=new Date(t.value+"T23:59:59").getTime();
  try{ S.logRows=await DB.fetchTx(from-8*864e5,to); S.logRows=S.logRows.filter(x=>tTime(x)>=from&&tTime(x)<=to).sort((a,b)=>tTime(b)-tTime(a)); }catch(e){ toast("Log not loaded: "+e.message,true); S.logRows=[]; } fillRegion("lgRows",true); }

const presets = () => ST().presets?.length ? ST().presets : defaultPresets();
function normCfg(c){
  c=clone(c||{}); c.blocks ||= []; const have=new Set(c.blocks.map(b=>b.key));
  for(const k of Object.keys(BLOCKS)) if(!have.has(k)) c.blocks.push({key:k,on:false});
  c.blocks=c.blocks.filter(b=>BLOCKS[b.key]);
  for(const b of c.blocks){ const B=BLOCKS[b.key]; b.opts={...clone(B.opts||{}), ...(b.opts||{})}; if(B.cols && !b.cols) b.cols=[...B.def]; if(b.title===undefined) b.title=B.title; }
  c.period ||= {kind:"cutoff"}; c.schools ||= []; c.orientation ||= "landscape"; c.font ||= 11; c.paper ||= "A4"; c.fit=!!c.fit; c.flow=!!c.flow;
  for(const k of ["color","showLogo","showUpdated"]) if(c[k]===undefined) c[k]=true; return c;
}

const num = (x, k) => k==="sd"||k==="net" ? {v:sgt(x), x, z:"+#,##0;-#,##0;0", cls:x<0?"neg":x>0?"pos":""} : {v:nf(x), x};
function statCells(r, cols){ return cols.map(k=> k==="pct" ? {v:r.auth?((r.str/r.auth)*100).toFixed(1)+"%":"–", x:r.auth?r.str/r.auth:0, z:"0.0%"} : k==="inc" ? {v:r.inc?String(r.inc):"–", x:r.inc||0} : num(r[k]??0,k)); }
const tbl = (title, head, rows, extra={}) => ({t:"table", title, head, rows, ...extra});
function schoolModel(code, cols, o){
  const st=schoolStats(code); let cs=[...cols];
  if(o.hideGender && st.gtype!=="mixed") cs=cs.filter(k=>k!=="g"&&k!=="b");
  if(o.incAuto && !st.classes.some(c=>c.inc)) cs=cs.filter(k=>k!=="inc");
  const rows=[]; let grp=null, acc=[];
  const flush=()=>{ if(o.groupTotals && acc.length>1) rows.push({c:[L("total"),...statCells(addUp(acc),cs)],cls:"sub"}); acc=[]; };
  for(const c of st.classes){ if(c.grp!==grp){ flush(); grp=c.grp; } acc.push(c); rows.push({c:[c.cl,...statCells(c,cs)]});
    if(o.sections) for(const x of c.secs) rows.push({c:[`   ${c.cl} - ${x.s}`,...cs.map(k=>["n","inc","wait","pct"].includes(k)?"":num(x[k]??0,k))],cls:"secrow"}); }
  flush(); rows.push({c:[L("gtotal"),...statCells(st,cs)],cls:"tot"});
  return tbl(st.name.toUpperCase(), [L("cl"),...cs.map(k=>L(COLDEF[k]||k))], rows);
}

  category(b,x){ const m={}; for(const t of x.tx){ if(t.status!=="ok"||!x.codes.includes(t.school)||tTime(t)<x.w.from||tTime(t)>x.w.to) continue; const d=AD(t.action); if(!d) continue; const k=t.cat||"(blank)"; m[k] ||= {in:0,out:0}; d>0?m[k].in++:m[k].out++; }

function trendSvg(p){

  const X=i=>l+i*(W-l-r)/(p.length-1), Y=v=>tp+(hi-v)*(H-tp-bt)/(hi-lo||1), line=k=>p.map((q,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(q[k]).toFixed(1)}`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${ticks}<path d="${line("auth")}" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-width="1.5"/><path d="${line("str")}" fill="none" stroke="#0b1f4b" stroke-width="2"/>
    <text x="${l}" y="${H-8}" font-size="10" fill="#555">${p[0].day}</text><text x="${W-r}" y="${H-8}" font-size="10" fill="#555" text-anchor="end">${p.at(-1).day}</text>
    <text x="${W-r}" y="${Y(p.at(-1).str)-6}" font-size="11" text-anchor="end" fill="#0b1f4b">${h(L("str"))} ${nf(p.at(-1).str)}</text><text x="${W-r}" y="${Y(p.at(-1).auth)+14}" font-size="11" text-anchor="end" fill="#777">${h(L("auth"))} ${nf(p.at(-1).auth)}</text></svg>`;
}

// printable area in CSS px (96 per inch) with 8 mm margins, minus a small safety margin
const PAGE_MM = { A4:[297,210], A3:[420,297] };
function pagePx(paper, orientation){ const [l,s]=PAGE_MM[paper]||PAGE_MM.A4; const [w,h]=orientation==="portrait"?[s,l]:[l,s]; const k=96/25.4*0.97; return [(w-16)*k,(h-16)*k]; }
function fitInfo(w, h, c){ const [W,H]=pagePx(c.paper,c.orientation); const z = c.fit ? Math.min(2, W/w, H/h) : Math.min(1, W/w); return {z, pages:Math.max(1,Math.ceil((h*z-1)/H))}; }
function printHtml(html, c){
  c={paper:"A4",orientation:"landscape",fit:false,...c};
  const pv=$("#printView"); pv.innerHTML=html; const paper=pv.querySelector(".paper");
  if(paper){ pv.style.cssText="display:block;position:absolute;left:-99999px;top:0"; paper.style.zoom=""; const f=fitInfo(paper.scrollWidth,paper.scrollHeight,c); pv.style.cssText=""; if(Math.abs(f.z-1)>0.005) paper.style.zoom=f.z.toFixed(3); }
  let st=$("#pageStyle"); if(!st){ st=document.createElement("style"); st.id="pageStyle"; document.head.appendChild(st); }
  st.textContent=`@page{size:${c.paper} ${c.orientation};margin:8mm}`;

}

async function loadXLSX(){ if(window.XLSX) return window.XLSX; await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=XLSX_URL; s.onload=res; s.onerror=()=>rej(new Error("Excel library could not load — check the internet connection")); document.head.appendChild(s); }); return window.XLSX; }
const cellX = c => typeof c==="object"&&c!==null ? (c.x ?? c.v) : c;
function tableAoa(t){ return [[t.title||""],t.head,...t.rows.map(r=>r.c.map(cellX))]; }
function sideBySide(tables, per){ const out=[]; for(let i=0;i<tables.length;i+=per){ const A=tables.slice(i,i+per).map(tableAoa); const hgt=Math.max(...A.map(a=>a.length)); const wid=A.map(a=>Math.max(...a.map(r=>r.length)));
  for(let r=0;r<hgt;r++){ const row=[]; A.forEach((a,j)=>{ const src=a[r]||[]; for(let k=0;k<wid[j];k++) row.push(src[k]??""); row.push(""); }); out.push(row); } out.push([]); } return out; }
function sheetFrom(X, aoa){ const ws=X.utils.aoa_to_sheet(aoa); ws["!cols"]=(aoa[1]||aoa[0]||[]).map((_,i)=>({wch:i===0?22:12})); return ws; }
function addSheet(X, wb, name, aoa){ let n=String(name||"Sheet").replace(/[\\/?*[\]:]/g," ").slice(0,28)||"Sheet", k=n, i=2; while(wb.SheetNames.includes(k)) k=n.slice(0,25)+" "+(i++); X.utils.book_append_sheet(wb, sheetFrom(X,aoa), k); }
async function reportXlsx(c){
  try{ const X=await loadXLSX(), R=await buildReport(c), wb=X.utils.book_new();
    for(const {b,parts} of R.blocks){ let aoa=[]; for(const p of parts){ if(p.t==="table") aoa.push(...tableAoa(p),[]); else if(p.t==="grid") aoa.push([p.title||""],...sideBySide(p.tables,p.per)); else if(p.t==="kpis") aoa.push(...p.items.map(i=>[i[0],i[1],i[2]]),[]); else if(p.t==="chart") aoa.push(...tableAoa(p.table)); else if(p.t==="text") aoa.push([p.title],[p.text]); }
      if(aoa.length) addSheet(X,wb,b.title||BLOCKS[b.key].name,[[c.title],[`Updated ${fmtDT(Date.now())} · ${R.x.plabel}`],[],...aoa]); }
    if(!wb.SheetNames.length){ toast("Nothing to export — tick a block.",true); return; }
    X.writeFile(wb, `${(c.name||c.title||"Report").replace(/[^\w-]+/g,"_")}_${isoDay(Date.now())}.xlsx`); toast("Excel report downloaded.");
  }catch(e){ toast("Excel export failed: "+e.message,true); }
}

  const ctx={org:ST().org||"",date:fmtD(Date.now()),time:fmtT(Date.now()),session:session(),period:periodLabel(kind,w),str:nf(tot.str),auth:nf(tot.auth),sd:sgt(tot.sd),girls:nf(tot.g),boys:nf(tot.b),secs:String(tot.n),wait:nf(tot.wait),

const ENTRY_COLS = [["date","Date (dd-mm-yyyy)"],["action","Action"],["cl","Class"],["sec","Section"],["adm","Adm / Reg No"],["name","Student Name"],["father","Father Name"],["dob","Date of Birth"],["gender","Gender (B/G)"],["cat","Student Category"],["remarks","Remarks"],["apei","To / From APEI"],["tocl","To Class"],["tosec","To Section"]];
const ALIASES = { date:["date","dateddmmyyyy","entrydate"], action:["action","actiontype"], cl:["class","cl"], sec:["section","sec"], adm:["admregno","admno","admissionno","regno","adm"], name:["studentname","name"], father:["fathername","father","fname"],
  dob:["dateofbirth","dob"], gender:["genderbg","gender","studentgender"], cat:["studentcategory","category","cat","feecategory"], remarks:["remarks","remarksreason","remarksltrno"], apei:["tofromapei","apei","toapei","fromapei"], tocl:["toclass"], tosec:["tosection"],
  appl:["appldate","applicationdate"], unit:["catunit","unit"], contact:["contact","phone","mobile"], status:["status"], marks:["marks"], dq:["remarksbydq","remarksbydqoffice","dqremarks"], admsn:["admsnstatus","admissionstatus"], sch:["remarksbyschool","schoolremarks"],
  school:["school","schoolcode"], seats:["seats","capacity"], g:["girls","girlscurrentstr"], b:["boys","boyscurrentstr"] };
function mapHeader(row){ const m={}; row.forEach((x,i)=>{ const n=norm(x); for(const [k,al] of Object.entries(ALIASES)) if(m[k]===undefined && al.includes(n)) m[k]=i; }); return m; }
async function readSheet(file){ const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]]; return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}); }
function findHeader(rows, need){ for(let i=0;i<Math.min(rows.length,10);i++){ const m=mapHeader(rows[i]); if(need.every(k=>m[k]!==undefined)) return {i,m}; } return null; }
async function writeBook(name, sheets){ const X=await loadXLSX(), wb=X.utils.book_new(); for(const [n,aoa] of sheets) addSheet(X,wb,n,aoa); X.writeFile(wb,name); }
function matchAction(v){ const n=norm(v); return actions().find(a=>norm(a.code)===n||norm(a.label)===n) || actions().find(a=>n && norm(a.label).startsWith(n)); }
function matchClassSec(code, cl, sec){ const o=csOptions(code); const nc=norm(cl), ns=norm(sec);
  return o.find(x=>norm(x.cl)===nc&&norm(x.s)===ns) || o.find(x=>norm(arab(x.cl))===norm(arab(String(cl)))&&norm(x.s)===ns) || o.find(x=>norm(x.s)===ns && lvlOf({cl:x.cl})===lvlOf({cl:String(cl).replace(/-\(/,"(")}) && (!/girls|boys/i.test(cl) || /girls/i.test(cl)===/girls/i.test(x.cl))); }
function matchCat(v){ const s=String(v??"").trim(); if(!s) return {cat:cats()[0], warn:"blank category → "+cats()[0]}; if(/^\d+$/.test(s)&&cats()[+s-1]) return {cat:cats()[+s-1]}; const f=cats().find(c=>norm(c)===norm(s)); return f?{cat:f}:{cat:s, warn:`category "${s}" is not in the list`}; }
const parseGender = v => { const n=norm(v); return ["b","boy","m","male"].includes(n)?"b":["g","girl","f","female"].includes(n)?"g":""; };

  toast("Template downloaded."); }
async function impEntries(file){
  const code=entrySchool(); let rows; try{ rows=await readSheet(file); }catch(e){ toast("Could not read the file: "+e.message,true); return; }
  const hd=findHeader(rows,["action","cl","sec","name"]); if(!hd){ toast("Columns not found. Use the template (Action, Class, Section, Student Name…).",true); return; }
  const m=hd.m, get=(r,k)=>m[k]===undefined?"":r[m[k]], sim={}, out=[];
  const simCur=(cl,s,g)=>{ const k=K(cl,s,g); if(sim[k]===undefined) sim[k]=cur(code,cl,s)[g]; return k; };
  rows.slice(hd.i+1).forEach((r,ix)=>{ if(!String(get(r,"name")).trim() && !String(get(r,"cl")).trim()) return;
    const errs=[], warns=[], line=hd.i+ix+2; const a=matchAction(get(r,"action")); if(!a) errs.push(`unknown action "${get(r,"action")}"`);
    const o=matchClassSec(code,get(r,"cl"),get(r,"sec")); if(!o) errs.push(`class/section "${get(r,"cl")} ${get(r,"sec")}" not in ${code}`);
    const name=String(get(r,"name")).trim(); if(!name) errs.push("no student name");
    let gender=parseGender(get(r,"gender")); if(!gender&&o) gender=genderFor(code,o.cl); if(!gender) errs.push("gender missing (B/G)");
    const dob=parseDob(get(r,"dob")); if(dob===null) errs.push(`DOB "${get(r,"dob")}" not understood`);
    const dv=get(r,"date"); let eff=""; if(dv!==""){ const d=parseDob(dv); if(d===null) errs.push(`date "${dv}" not understood`); else eff=d; }
    const c=matchCat(get(r,"cat")); if(c.warn) warns.push(c.warn);
    const tx={school:code, action:a?.code, cl:o?.cl, sec:o?.s, gender, cat:c.cat, name, father:String(get(r,"father")).trim(), dob:dob||"", admNo:String(get(r,"adm")).trim(), remarks:String(get(r,"remarks")).trim(), eff:eff||isoDay(Date.now())};
    const em=effFromDate(eff); if(em) tx.effMs=em;
    if(a && o && !errs.length){ const k=a.kind, apei=String(get(r,"apei")).trim();
      if(k==="sec"){ const ts=S.schools[code].classes.find(x=>x.cl===o.cl).secs.find(x=>norm(x.s)===norm(get(r,"tosec"))); if(!ts) errs.push(`To Section "${get(r,"tosec")}" not found`); else { tx.toCl=o.cl; tx.toSec=ts.s; } }
      if(k==="apei_out"){ const dest=schoolList().find(s=>norm(s.code)===norm(apei)&&s.code!==code); if(dest){ tx.toSchool=dest.code; const tc=dest.classes.find(x=>norm(x.cl)===norm(get(r,"tocl")||o.cl)); tx.toCl=tc?tc.cl:dest.classes[0]?.cl; if(!tc) warns.push(`To Class not found in ${dest.code}; receiver will choose`); } else { tx.toSchool="__other"; tx.ext=apei; if(!apei) warns.push("destination APEI blank"); } }
      if(k==="apei_in") tx.ext=apei;
      const d=KIND_D[k]; if(d<0||k==="sec"){ const kk=simCur(o.cl,o.s,gender); if(sim[kk]<=0) errs.push(`no ${gender==="g"?"girls":"boys"} left in ${o.cl}-${o.s}`); else sim[kk]--; }
      if(d>0){ const kk=simCur(o.cl,o.s,gender); sim[kk]++; } if(k==="sec"&&tx.toSec){ const kk=simCur(o.cl,tx.toSec,gender); sim[kk]++; } }
    out.push({line, tx, errs, warns}); });
  S.imp={kind:"entries", school:code, file:file.name, rows:out}; fillRegion("eImp",true);
}

    if(el.dataset.pf && isSA()){ const P=clone(presets()), i=+el.dataset.i; if(el.dataset.pf==="default") await saveSettings({defaultPreset:P[i].id},"Default preset changed."); else { P[i].name=el.value; await savePresets(P,"Preset renamed."); } return; }

  cats: async () => { const c=$("#sCats").value.split("\n").map(x=>x.trim()).filter(Boolean); if(!c.length) return; await saveSettings({categories:c},"Categories saved."); },
  waitSt: async () => { const s=$("#sWst").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>({name:x.replace(/\s*\*$/,""),count:/\*$/.test(x)})); if(!s.length) return; await saveSettings({waitStatuses:s},"Statuses saved."); },
  stages: async () => { const st=$("#sStages").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{ const [n,...r]=x.split(":"); return {name:n.trim(), levels:r.join(":").split(",").map(y=>y.trim()).filter(Boolean)}; }).filter(x=>x.name&&x.levels.length);
    await saveSettings({stages:st, consGroup:$("#sCons").value},"Consolidation saved."); fillRegion("stBody",true); },
  waSave: async () => { const T=clone(waTemplates()); const i=T.findIndex(x=>x.id===S.waEdit); T[i]={...T[i],name:$("#waName").value.trim()||"Template",body:$("#waBody").value,schoolLine:$("#waSchool").value,moveLine:$("#waMove").value}; await saveSettings({waTemplates:T},"Template saved."); fillRegion("stBody",true); waPreview(); },
  rollover: async () => { if($("#roConfirm").value!=="ROLLOVER"){ toast("Type ROLLOVER exactly.",true); return; } const ns=$("#roName").value.trim(); const ops=opsNew();
    for(const s of schoolList(true)){ const sc=cloneSchool(s.code); delete sc.id; sc.classes.forEach(c=>{ c.inc=0; c.secs.forEach(x=>{ const v=cur(s.code,c.cl,x.s); x.g=v.g; x.b=v.b; }); }); ops.set.push({col:"schools",id:s.code,data:sc}); ops.set.push({col:"strength",id:s.code,data:{d:{},w:{}}}); }
    ops.set.push({col:"settings",id:"app",data:{session:ns,sessionStart:$("#roStart").value},merge:true}); await DB.apply(ops); toast(`Session ${ns} started.`); boot(); }
};
document.addEventListener("submit", e => { const f=e.target; if(!f.dataset.form) return; e.preventDefault(); Promise.resolve(FORMS[f.dataset.form](f)).catch(err=>toast(err.message,true)); });

/* =====================================================================
   12) START
   ===================================================================== */
boot();
DB.start().catch(e=>{ $("#app").innerHTML=`<div class="login"><div class="panel"><h2>Could not start</h2><p>${h(e.message)}</p><p class="hint">Check FIREBASE_CONFIG and your internet connection.</p></div></div>`; });

}
</script>
