<style>
/*
VOICE: calm, exact, office-grade — a register clerks trust and HQ can brief from.
IDEA: the garrison "strength return" ledger: ruled tables, totals rows, a stamped header band.
PICTURE: the live strength summary table itself, first thing on the dashboard.
COLOUR and TYPE: oxford-blue band, white ledger panels, crimson only for deficits/alerts; Red Hat Display + Text.
LAYOUT: sticky band + role-based tabs; content max 1400px; tables scroll sideways on phones.
*/
:root{color-scheme:light dark;
--bg:light-dark(#eef1f6,#0b1220);--panel:light-dark(#ffffff,#121b2e);--ink:light-dark(#0f1b33,#e6ebf5);--mute:light-dark(#5b6782,#9aa6c0);
--line:light-dark(#d5dbe7,#26324a);--band:#0b1f4b;--band2:#14306e;--soft:light-dark(#eef3ff,#17244a);
--red:light-dark(#b3122a,#ff6b7f);--redsoft:light-dark(#fde8eb,#3a1520);--ok:light-dark(#0f6b5c,#5fd3bd);--oksoft:light-dark(#e3f4f0,#10302b);
--amber:light-dark(#8a5a00,#f2c066);--ambersoft:light-dark(#fff4dc,#33270d);--focus:#2f6bff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Red Hat Display",system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
.band{background:var(--band);color:#fff;padding:12px max(3vw,14px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.band h1{font-size:20px;font-weight:800}.band small{display:block;opacity:.8;font-size:13px;margin-top:3px}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);font-weight:700;white-space:nowrap}
.demo{background:#c8102e}
nav{background:var(--band2);display:flex;gap:2px;overflow-x:auto;padding:0 max(3vw,10px);position:sticky;top:var(--bandH,62px);z-index:29}
nav a{flex:none;color:#cfd9f2;text-decoration:none;padding:11px 14px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav a.on{color:#fff;border-bottom-color:#fff}nav a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:#c8102e;color:#fff;font-size:12px;text-align:center;margin-left:5px}
main{max-width:1400px;margin:0 auto;padding:16px max(3vw,12px) 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.panel>h2{font-size:17px;margin-bottom:10px}.ph{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}.ph h2{font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
.kpi b{display:block;font:800 clamp(20px,2.4vw,26px)/1.1 "Red Hat Display",sans-serif;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute)}.kpi i{font-style:normal;font-size:12.5px;color:var(--mute);display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:700;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sub td{background:var(--soft);font-weight:700}tr.tot td{background:var(--band);color:#fff;font-weight:800}
tr.tot .pos,tr.tot .neg{color:#fff}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.secrow td{color:var(--mute);font-size:13px}tr.secrow td:first-child{padding-left:26px}
tr.void td{text-decoration:line-through;opacity:.55}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--red);font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.t-in{background:var(--oksoft);color:var(--ok)}.t-out{background:var(--redsoft);color:var(--red)}.t-mid{background:var(--ambersoft);color:var(--amber)}.t-n{background:var(--soft);color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 13px;font-weight:700;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--focus)}.btn.p{background:var(--band);border-color:var(--band);color:#fff}.btn.r{color:var(--red)}.btn.s{min-height:30px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.band .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:12.5px;font-weight:700;color:var(--mute)}
.f input,.f select,.f textarea,select.in,input.in{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;min-height:40px;font-size:15px;width:100%}
.entry{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px}
.combo{position:relative}.combo-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel);border:1px solid var(--focus);border-radius:7px;max-height:300px;overflow:auto;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.combo-list div{padding:7px 10px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}.combo-list div.hi{background:var(--soft);font-weight:700}.combo-list div small{color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin-top:8px}.hint kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13.5px}.pill.on{background:var(--band);color:#fff;border-color:var(--band)}
.secchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;margin:2px;font-size:13px;background:var(--panel)}
.secchip button{border:0;background:none;color:var(--red);cursor:pointer;font-weight:800;padding:2px 5px}.secchip button:disabled{color:var(--mute);cursor:not-allowed}
.toast{position:fixed;right:16px;bottom:16px;z-index:99;background:#0f1b33;color:#fff;padding:11px 15px;border-radius:8px;font-weight:700;max-width:min(440px,90vw);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}.toast.err{background:#b3122a}
.modal{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal>div{background:var(--panel);border-radius:12px;max-width:560px;width:100%;padding:18px;border:1px solid var(--line)}
.modal h3{font-size:18px;margin-bottom:12px}.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.login{max-width:440px;margin:8vh auto;padding:0 12px}.login .panel{padding:22px}
.note{background:var(--ambersoft);color:var(--amber);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:12px}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
textarea.brief{width:100%;min-height:340px;font:13px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel)}
td input.in,td select.in{min-height:32px;padding:4px 6px;font-size:13px;width:auto;max-width:180px}
td input.num{width:64px}
.empty{color:var(--mute);padding:14px;text-align:center}
#printView{display:none}
@media print{body{background:#fff;color:#000}.band,nav,main,.toast,.modal{display:none!important}#printView{display:block!important;padding:0}
 #printView table{font-size:11px}#printView th{background:#e9eefb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}#printView tr.tot td{background:#0b1f4b!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(max-width:600px){.band{position:static}nav{top:0}.band h1{font-size:17px}main{padding:10px 8px 50px}.panel{padding:10px}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.f.wide{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}

.mute{color:var(--mute)}
.brandrow{display:flex;gap:12px;align-items:center}.logo{height:44px;width:auto;background:#fff;border-radius:6px;padding:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.two>.panel{margin-bottom:14px}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
tr.bad td{background:var(--redsoft)}
details>summary{cursor:pointer;font-weight:700;margin:4px 0}
.livehead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px}.livehead h2{font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.card.wide{grid-column:1/-1}
.cardhead{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%}
.cardhead .big{font:800 26px/1 "Red Hat Display",sans-serif;font-variant-numeric:tabular-nums}.cardhead .big small{font-size:14px;color:var(--mute);font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:99px;margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--band2);border-radius:99px}.bar i.over{background:#c8102e}
.cardrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--mute)}.cardrow b{color:var(--ink)}
.rlayout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1000px){.rlayout{grid-template-columns:minmax(0,1fr)}}
.designer{display:flex;flex-direction:column;gap:8px;font-size:14px}.designer details{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.designer .f{margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:inline-flex;align-items:center;gap:6px;margin:3px 10px 3px 0;cursor:pointer}.ck input{width:18px;height:18px}
.blk{border-top:1px solid var(--line);padding:6px 0}.blk:first-of-type{border-top:0}.blkh{display:flex;justify-content:space-between;align-items:center;gap:6px}.blkh .btn{min-height:28px;padding:2px 7px}
.blkb{padding:4px 0 6px 26px}.blk:not(.on) .blkh b{font-weight:500;color:var(--mute)}.cols{display:flex;flex-wrap:wrap}
.rprev{background:#d9dee8;border-radius:10px;padding:12px;overflow:auto;max-height:calc(100vh - var(--bandH,62px) - 70px);position:sticky;top:calc(var(--bandH,62px) + 56px)}
.paper{background:#fff;color:#111;font:var(--fs,11px)/1.35 "Red Hat Text",Arial,sans-serif;padding:14px 16px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.15);width:max-content;min-width:100%}
.paper .phead{display:flex;align-items:center;gap:12px;border-bottom:2px solid #0b1f4b;padding-bottom:6px;margin-bottom:8px}.paper .phead img{height:46px}
.paper .phead h2{font:800 calc(var(--fs,11px) + 6px)/1.15 "Red Hat Display",Arial,sans-serif;color:#0b1f4b;margin:0}.paper .phead p{margin:2px 0 0}.paper .pmeta{margin-left:auto;text-align:right;font-size:calc(var(--fs,11px) - 1px);color:#333}
.paper .rblock{margin:8px 0 12px;break-inside:avoid}.paper .rh{font-size:calc(var(--fs,11px) + 2px);margin:8px 0 4px;color:#0b1f4b;text-align:center}
.rt{border-collapse:collapse;width:100%;font-size:var(--fs,11px);margin-bottom:8px;color:#111}.rt caption{background:#0b1f4b;color:#fff;font-weight:800;padding:4px 6px;text-align:center;caption-side:top}
.rt th{background:#dfe6f5;color:#0b1f4b;font-weight:700;border:1px solid #9aa6c0;padding:2px 4px;position:static;white-space:normal;line-height:1.15;vertical-align:bottom}.rt td{border:1px solid #c3cad8;padding:2px 4px;white-space:nowrap}
.rt td.n,.rt th.n{text-align:right;font-variant-numeric:tabular-nums}.rt tr.sub td{background:#eef2fa;font-weight:700}.rt tr.tot td{background:#0b1f4b;color:#fff;font-weight:800}.rt tr.secrow td{color:#555}
.rt td.neg{color:#b3122a}.rt td.pos{color:#0f6b5c}.rt tr.tot td.neg,.rt tr.tot td.pos{color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(var(--per,3),max-content);gap:10px;align-items:start;justify-content:start}.rgrid .rt{width:min-content;margin:0}
.rkpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.rkpis div{border:1px solid #c3cad8;border-radius:6px;padding:5px 7px}.rkpis span{display:block;color:#444;font-size:calc(var(--fs,11px) - 1px)}.rkpis b{font:800 calc(var(--fs,11px) + 7px)/1.1 "Red Hat Display",Arial;color:#0b1f4b}.rkpis i{display:block;font-style:normal;color:#555;font-size:calc(var(--fs,11px) - 1.5px)}
.rsign{display:flex;justify-content:space-around;gap:20px;margin-top:40px}.rsign div{text-align:center;min-width:160px}.rsign span{display:block;border-top:1px solid #111;margin-bottom:4px}
.rtext{margin:4px 0}.pfoot{border-top:1px solid #c3cad8;margin-top:10px;padding-top:4px;color:#444;font-size:calc(var(--fs,11px) - 1px)}
.paper.bw .rt caption,.paper.bw .rt tr.tot td{background:#333}.paper.bw .rt th{background:#e5e5e5;color:#111}.paper.bw .rt td.neg,.paper.bw .rt td.pos{color:inherit}.paper.bw .phead{border-color:#111}.paper.bw .phead h2,.paper.bw .rh,.paper.bw .rkpis b{color:#111}
.qrbox{width:240px;max-width:100%;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}.qrbox svg{width:100%;height:auto;display:block}
.qrcard{text-align:center;padding:30px;font-family:Arial,sans-serif}.qrcard svg{width:300px;height:300px}.qrcard h2{margin:6px 0}.steps{padding-left:20px}.steps li{margin:6px 0}
@media print{#printView .paper{box-shadow:none;padding:0;min-width:0}#printView .rt th,#printView .rt caption,#printView .rt tr.tot td,#printView .rt tr.sub td{-webkit-print-color-adjust:exact;print-color-adjust:exact}#printView .rblock{break-inside:auto}#printView .rt{break-inside:auto}#printView .rgrid .rt{break-inside:avoid}}
.only-narrow{display:none}@media(max-width:700px){.only-wide{display:none}.only-narrow{display:grid}}
tr.sel td{background:var(--soft)}tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--band2)}.card.sel{border-color:var(--band2);box-shadow:inset 0 0 0 1px var(--band2)}
.paper.flow .rrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;margin:10px 0}.paper.flow .rrow .rblock{margin:0;flex:0 0 auto}.paper.flow .rrow .rt{width:min-content}
.fitnote{margin:0 0 8px;font-size:13.5px;color:#1c2740;background:#fff;border-radius:6px;padding:6px 10px}
.modal>div.wide{max-width:1000px}
caption.scap{background:var(--band);color:#fff;font-weight:800;padding:6px;text-align:center;caption-side:top}
.catgrid th .vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:12px;max-height:150px;display:inline-block}.catgrid td,.catgrid th{padding:3px 4px}
td.amber{color:var(--amber)}.rt td.amber{color:#8a5a00}
@media print{body.nopr #app,body.nopr #printView,body.nopr #modalRoot{display:none!important}body.nopr::after{content:"Printing is switched off for this account.";display:block;padding:40px;font:20px Arial}}

/* ===== v4: sober buttons, themes, sync light, back, search, drill-downs ===== */
:root{--radius:9px;--shadow:0 1px 2px rgba(15,27,51,.06),0 1px 1px rgba(15,27,51,.04)}
:root[data-size=s]{font-size:14px}:root[data-size=s] body{font-size:14px}:root[data-size=l] body{font-size:16.5px}:root[data-size=l] table{font-size:14.5px}
:root[data-density=compact] th,:root[data-density=compact] td{padding:4px 6px}:root[data-density=compact] .panel{padding:10px;margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:7px 14px;font-weight:600;letter-spacing:.1px;box-shadow:var(--shadow);transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
.btn:hover{background:var(--soft);border-color:color-mix(in srgb,var(--band2) 45%,var(--line))}.btn:active{transform:translateY(1px)}
.btn.p{background:var(--band2);border-color:var(--band2);color:#fff}.btn.p:hover{background:var(--band);border-color:var(--band)}
.btn.r{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--line))}.btn.r:hover{background:var(--redsoft)}
.btn.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}.btn.g:hover{background:var(--oksoft)}
.btn.ghost{box-shadow:none;background:transparent}
.band .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.28);box-shadow:none}.band .btn:hover{background:rgba(255,255,255,.18)}
.pill{box-shadow:var(--shadow);font-weight:600}.pill:hover{border-color:color-mix(in srgb,var(--band2) 45%,var(--line))}.pill.on{background:var(--band2);border-color:var(--band2)}
.panel,.kpi,.card{border-radius:12px;box-shadow:var(--shadow)}
.f input,.f select,.f textarea,select.in,input.in{border-radius:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.sync i{width:9px;height:9px;border-radius:50%;background:#7ee2b8;box-shadow:0 0 0 3px rgba(126,226,184,.25)}.sync.busy i{background:#ffd166;animation:pulse 1s infinite}.sync.off i{background:#ff8fa0}.sync.bad i{background:#ff4d6a}.sync.bad{background:#b3122a}
@keyframes pulse{50%{opacity:.35}}
.navback{flex:none;align-self:center;margin-right:8px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 12px;font-weight:700;cursor:pointer}.navback:hover{background:rgba(255,255,255,.25)}
.gsearch{flex:1 1 320px;max-width:520px}.gsearch input{width:100%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;min-height:38px}
.gsearch input::placeholder{color:rgba(255,255,255,.7)}.gsearch input:focus{background:#fff;color:#111;outline:none}.gsearch .combo-list{color:var(--ink);max-height:420px}
.gsearch .combo-list div{flex-direction:column;align-items:flex-start;gap:0}.gsearch .combo-list div small{font-size:12px}
.tsb{overflow-x:auto;overflow-y:hidden;height:14px;position:sticky;top:calc(var(--bandH,62px) + 44px);z-index:5;background:var(--panel)}.tsb>div{height:1px}
@media(max-width:600px){.tsb{top:44px}}
td.dn,span.dn,b.dn{cursor:pointer;text-decoration:underline dotted color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}td.dn:hover,span.dn:hover,b.dn:hover{background:color-mix(in srgb,var(--band2) 12%,transparent);text-decoration-style:solid}
tr.tot td.dn:hover{background:rgba(255,255,255,.15)}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .1s}.kpi.click:hover{border-color:var(--band2);transform:translateY(-1px)}.kpi.click{position:relative}.kpi.click::after{content:"›";position:absolute;top:8px;right:11px;font-size:18px;line-height:1;color:var(--mute)}.kpi.click:hover::after{color:var(--band2)}
.stat{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.stchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:700;background:var(--panel);cursor:pointer}
.stchip i{font-style:normal}.stchip.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--oksoft);color:var(--ok)}.stchip.part{background:var(--ambersoft);color:var(--amber)}.stchip.none{background:var(--redsoft);color:var(--red)}.stchip.wait{color:var(--mute)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px;font-weight:600}.fchip button{border:0;background:none;cursor:pointer;color:var(--mute);font-weight:800;padding:0 6px}
.sp-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;justify-content:space-between}.sp-head h2{font-size:22px}.sp-head .sub{color:var(--mute);margin-top:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}.fgrid .f input:disabled,.fgrid .f select:disabled{background:var(--soft);color:var(--ink);opacity:1;border-color:transparent}
.fgrid.locked .f{cursor:pointer}.fgrid.locked input:disabled,.fgrid.locked select:disabled{pointer-events:none}.editing .fgrid .f input,.editing .fgrid .f select{border-color:var(--focus)}
.warnbox{border:2px solid var(--amber);background:var(--ambersoft);color:var(--ink);border-radius:10px;padding:12px}
.sibs{display:flex;flex-wrap:wrap;gap:8px}.sib{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--panel);cursor:pointer;min-width:200px}.sib:hover{border-color:var(--band2)}.sib b{display:block}.sib small{color:var(--mute)}
td.errc{background:var(--redsoft)!important;color:var(--red);font-weight:700}tr.bad td{background:color-mix(in srgb,var(--redsoft) 55%,transparent)}
.errlist{margin:6px 0 0;padding-left:18px;color:var(--red);font-size:13px}.errlist li{margin:2px 0}
.swatch{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.thopt{border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;font-weight:700;background:var(--panel);text-align:left}.thopt.on{border-color:var(--focus)}
.thopt span{display:block;height:22px;border-radius:6px;margin-bottom:6px}
.catrow td{vertical-align:middle}.catno{display:inline-block;min-width:28px;text-align:center;font-weight:800;color:var(--mute)}
.mini{font-size:12.5px;color:var(--mute)}
.dcbar{display:flex;gap:4px;align-items:center}.big2{font:800 28px/1 "Red Hat Display",sans-serif}
@media print{.tsb,.navback{display:none!important}}

.band{display:block}.bandtop{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
.band .gsearch{max-width:none;margin-top:10px}.band .gsearch input{min-height:40px;font-size:15px}
.umenu{position:relative}.ubtn span{max-width:220px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.umenu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.22);min-width:230px;padding:6px;display:flex;flex-direction:column}
.umenu-list button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:600;font-size:14px}.umenu-list button:hover,.umenu-list button:focus-visible{background:var(--soft)}
.umenu-list button.danger{color:var(--red);border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 8px 8px}.umenu-who{padding:8px 12px 10px;font-weight:800;border-bottom:1px solid var(--line);margin-bottom:4px}.umenu-who small{display:block;font-weight:500;color:var(--mute)}
nav .navback{margin:0 0 0 auto;align-self:center;flex:none}

/* buttons never get cut: inside form grids they may wrap to two lines */
.grid>.btn,.grid>button,.grid .row .btn{white-space:normal;line-height:1.2;overflow-wrap:anywhere;text-align:center}.btn{max-width:100%}
.grid>.btn,.grid>button{justify-self:stretch}
.actrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.f label.btn,.f .pills label.btn{font-size:14px;color:var(--ink);font-weight:600}
.ph .pills .btn,.ph>.btn{min-height:34px;padding:5px 12px;font-size:14px}
.grid .f>label{min-height:1.2em}
.fsbox{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:200;max-width:min(680px,94vw);background:#fff;color:#111;border:2px solid #b3122a;border-radius:12px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.3);font-size:14.5px}
.sttab td,.sttab th{text-align:center}.sttab td:first-child,.sttab th:first-child{text-align:left}.sttab .stchip{padding:3px 9px}
@media print{.admform{page-break-after:always}}
.bell{position:relative}.bell .badge{position:absolute;top:-6px;right:-6px;margin:0}
.notes{min-width:340px;max-width:min(440px,92vw);max-height:70vh;overflow:auto}.note-i{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}.note-i.new{background:var(--ambersoft)}.note-i[role=button]{cursor:pointer}.note-i:last-child{border:0}
.kpi.click>span{display:block;padding-right:16px}

.kpi.kg1{border-top:3px solid var(--brand,#1d4ed8)}.kpi.kg2{border-top:3px solid #0f766e;background:linear-gradient(#f0fdfa,#fff)}.kpi.kg3{border-top:3px solid #7c3aed;background:linear-gradient(#f5f3ff,#fff)}
.kpi.kg4{border-top:3px solid #d97706;background:linear-gradient(#fffbeb,#fff);margin-left:10px}
.dark .kpi.kg2,.dark .kpi.kg3,.dark .kpi.kg4{background:none}
.stgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:12px}
.stg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;border-left:4px solid var(--c,#1d4ed8);background:var(--panel,#fff)}
.stg h4{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--c,#1d4ed8)}
.stg .pill{margin:0 4px 4px 0;border-color:var(--c,#1d4ed8);color:var(--c,#1d4ed8)}
.stg .pill.on{background:var(--c,#1d4ed8);color:#fff}
.rolechip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;color:#fff}
.rprev .paper[contenteditable=true]{outline:3px dashed #d97706;outline-offset:4px}
.rnote-h{font-size:1.35em;margin:10px 0 4px}.rnote-box{border:1px solid #999;padding:6px 10px;border-radius:4px}
td.stick{position:sticky;right:0;background:var(--panel,#fff);box-shadow:-6px 0 6px -6px rgba(0,0,0,.25);white-space:nowrap;z-index:1}
main table{font-size:calc(13px * var(--tz,1))}main th,main td{padding:calc(4px * var(--tz,1) + 1px) 7px}
.zoomc{display:inline-flex;gap:0}.zoomc .btn{border-radius:0;min-width:34px;padding-left:6px;padding-right:6px}.zoomc .btn:first-child{border-radius:8px 0 0 8px}.zoomc .btn:last-child{border-radius:0 8px 8px 0}
main table th.srt{cursor:pointer;user-select:none}main table th.srt:hover{text-decoration:underline}
main table th.asc::after{content:" ▲";font-size:.75em}main table th.desc::after{content:" ▼";font-size:.75em}
@media (max-width:700px){.zoomc{display:none}}
#creditLine{text-align:center;font-size:12px;color:var(--mute,#64748b);padding:14px 8px 22px}.credit-print{text-align:center;font-size:9pt;color:#555;margin-top:8px}
.medcard{border:2px solid #be123c;border-radius:10px;padding:10px 12px;margin:10px 0;background:#fff1f2}.dark .medcard{background:none}
.medcard h3{margin:0 0 6px;color:#be123c;font-size:15px}
/* the tab you are on stands out */
nav a.on{background:rgba(255,255,255,.18);border-bottom:3px solid #f59e0b!important;border-radius:8px 8px 0 0}
.subtabs .pill.on{background:#f59e0b!important;border-color:#f59e0b!important;color:#111!important;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.kpi.kg5{border-top:3px solid #b91c1c;background:linear-gradient(#fef2f2,#fff)}.kpi.kg6{border-top:3px solid #be123c;background:linear-gradient(#fff1f2,#fff)}.dark .kpi.kg5,.dark .kpi.kg6{background:none}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.sgrp{background:var(--panel,#fff);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sgrp h4{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--c)}
.stile{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px;cursor:pointer;font:inherit;color:inherit}
.stile:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}.stile.on{background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 4px 0 0 var(--c)}
.stile .ic{font-size:20px;line-height:1;width:26px;text-align:center}.stile b{display:block;font-size:14px;color:var(--c)}.stile small{display:block;color:var(--mute,#64748b);font-size:12px;margin-top:1px}
</style>

  for(const code of codes) for(const c of SCH()[code].classes){ const st=classStats(code,c); const m=map.get(st.lvl)||{cl:st.lvl,n:0,inc:0,auth:0,g:0,b:0,str:0,wait:0,cats:{}};
    for(const k of ["n","inc","auth","g","b","str","wait"]) m[k]+=st[k]; for(const [k,v] of Object.entries(st.cats)) m.cats[k]=(m.cats[k]||0)+v; map.set(st.lvl,m); }
  for(const m of map.values()) m.sd=m.str-m.auth;
  const out=[], used=new Set();
  for(const sg of stages()){ const rows=sg.levels.map(l=>map.get(l)).filter(Boolean); rows.forEach(r=>used.add(r.cl)); if(rows.length) out.push({stage:sg.name, rows}); }
  const rest=[...map.values()].filter(r=>!used.has(r.cl)); if(rest.length) out.push({stage:"Other", rows:rest});
  return out;
}

/* ---------- periods ---------- */
function cutoffWindow(timeStr){
  const [hh,mm]=(timeStr||ST().cutoff||"08:00").split(":").map(Number);
  const now=new Date(), c=new Date(now); c.setHours(hh,mm||0,0,0); if(now<c) c.setDate(c.getDate()-1);
  return { from:c.getTime(), to:now.getTime() };
}
function periodWin(kind, from, to){
  const now=Date.now(), d0=new Date(); d0.setHours(0,0,0,0);
  switch(kind){
    case "today": return {from:d0.getTime(), to:now};
    case "yesterday": { const y=new Date(d0); y.setDate(y.getDate()-1); return {from:y.getTime(), to:d0.getTime()-1}; }
    case "7d": return {from:now-7*864e5, to:now};
    case "month": { const m=new Date(d0); m.setDate(1); return {from:m.getTime(), to:now}; }
    case "session": return {from:Date.parse((ST().sessionStart||"2026-04-01")+"T00:00")||now-365*864e5, to:now};
    case "custom": return {from:Date.parse((from||isoDay(now))+"T00:00"), to:Date.parse((to||isoDay(now))+"T23:59:59")};
    default: return cutoffWindow();
  }
}
const periodLabel = (kind, w) => kind==="cutoff" ? `since ${fmtDT(w.from)}` : kind==="custom" ? `${fmtD(w.from)} to ${fmtD(w.to)}` : (PERIODS[kind]||"").toLowerCase();
async function getTx(w){
  if(w.from >= Date.now()-7*864e5) return S.recentTx.filter(t=>(t.effMs||t.atMs)>=w.from && (t.effMs||t.atMs)<=w.to);
  const key=Math.floor(w.from/6e4)+"_"+Math.floor(w.to/6e5); const c=S.txCache[key];
  if(c && Date.now()-c.at<60e3) return c.rows;
  const rows=(await DB.fetchTx(w.from-8*864e5,w.to)).filter(t=>(t.effMs||t.atMs)>=w.from && (t.effMs||t.atMs)<=w.to); S.txCache[key]={at:Date.now(),rows}; return rows;
}

/* ---------- "as on" a past date: rebuild from opening figures + every entry up to that day ---------- */
/* history is kept in periods: the current one starts at the last session start or base replacement; earlier ones are archived with their structure */
const baseStartMs = () => ST().baseStartMs || Date.parse((ST().sessionStart||"2026-04-01")+"T00:00");
async function asOfState(day){
  const c=S.asOfCache[day]; if(c && Date.now()-c.at<60e3) return c.st;
  const end=Date.parse(day+"T23:59:59"); if(end>=Date.now()) return null;
  let schools=S.schools, start=baseStartMs(), stop=Infinity, note="";
  if(end<start){ const A=(await DB.allDocs("sessions")).map(a=>({...a, s:a.startMs||Date.parse((a.start||"2000-01-01")+"T00:00"), e:a.endMs||Date.parse((a.end||"2100-01-01")+"T23:59:59")}));
    const arch=A.filter(a=>a.s<=end && end<a.e).sort((x,y)=>y.s-x.s)[0] || A.filter(a=>a.s<=end).sort((x,y)=>y.e-x.e)[0];
    if(!arch) throw new Error(`No records go back to ${fmtD(end)}.`); schools=arch.schools; start=arch.s; stop=arch.e; note=arch.label||`session ${arch.id}`; }
  const rows=(await DB.fetchTx(start-8*864e5, Date.now())).filter(t=>t.status==="ok" && t.atMs>=start && t.atMs<stop && tTime(t)<=end);
  const strength={}; for(const code of Object.keys(schools)) strength[code]={d:{},c:{},w:{}};
  for(const t of rows) for(const [school,cl,sec,n] of effects(t)){ const st=strength[school] ||= {d:{},c:{},w:{}}; const k=K(cl,sec,t.gender); st.d[k]=(st.d[k]||0)+n; if(t.cat){ const kc=cl+"|"+t.cat; st.c[kc]=(st.c[kc]||0)+n; } }
  const snap=S.snapshots.filter(x=>x.day<=day).at(-1); if(snap) for(const [code,v] of Object.entries(snap.d||{})) if(strength[code]) strength[code].w=v.w||{};
  const st={strength, schools, day, waitFrom:snap?.day||null, note}; S.asOfCache[day]={at:Date.now(),st}; return st;
}
async function withAsOf(day, fn){ if(!day) return fn(); const st=await asOfState(day); if(!st) return fn(); S.asOf=st; try{ return fn(); } finally{ S.asOf=null; } }

/* =====================================================================
   6) DATA BACKENDS — same interface for Demo (browser) and Firebase.
   Writes = "ops" {set:[], upd:[], inc:[]} applied atomically.
   ===================================================================== */
function opsNew(){ return { set:[], upd:[], inc:[] }; }
const DEL = { __del:true };
const INC = n => ({ __inc:n });                        // "add n to this number" inside a write                       // "remove this key" inside a deep-merge write
const isPlain = o => o && typeof o==="object" && !Array.isArray(o) && o!==TS && o!==DEL && !(typeof o.toMillis==="function");
function deepMerge(a, b, fix){ const o=isPlain(a)?{...a}:{}; for(const [k,v] of Object.entries(b)){ if(v===DEL) delete o[k]; else if(isPlain(v)&&"__inc" in v) o[k]=(Number(o[k])||0)+v.__inc; else if(isPlain(v)) o[k]=deepMerge(o[k],v,fix); else o[k]=fix(v); } return o; }
/* sync light: counts writes not yet confirmed by the server */
const SYNC = { pending:0, last:Date.now(), err:"", online:navigator.onLine };
function syncPaint(){ const el=document.getElementById("syncDot"); if(!el) return; const off=!navigator.onLine;
  const age=Math.round((Date.now()-SYNC.last)/60e3);
  const [cls,txt,tip] = SYNC.err ? ["bad","Sync problem",SYNC.err] : off ? ["off","Offline — saved on this device","Entries are kept on this computer and upload by themselves when the internet returns."] : SYNC.pending ? ["busy","Saving…","Sending to the cloud"]
    : DEMO ? ["ok","Demo — this browser","Demo mode keeps data in this browser only."] : SYNC.cache ? ["busy","Connecting to server…","Showing the copy saved on this device until the server answers."]
    : ["ok",`Live · checked ${fmtT(SYNC.last)}`,`Connected to the server. Last confirmed ${fmtDT(SYNC.last)}${age?` (${age} min ago)`:""}. Changes by any clerk appear by themselves; press Refresh to check now.`];
  el.className="sync "+cls; el.title=tip; el.innerHTML=`<i></i>${h(txt)}`; }
addEventListener("online",()=>{ SYNC.err=""; syncPaint(); }); addEventListener("offline",syncPaint);
/* every 3 minutes while the page is open and visible, confirm with the server (1–3 small reads) */
setInterval(()=>{ if(DEMO||!S.user||S.user.pending||document.hidden||!navigator.onLine||!DB.check) return; DB.check().then(()=>refresh()).catch(e=>{ if(!fsFail(e)){ SYNC.err="Server not reachable: "+e.message; syncPaint(); } }); }, 180e3);
setInterval(syncPaint, 30e3);
/* Firebase's offline store on a PC can get stuck ("INTERNAL ASSERTION FAILED"); after that nothing saves until the page reloads.
   Detect it, tell the person plainly, reload — and if it comes back, clear this PC's offline copy (the server copy is untouched). */
function fsFail(e){ const msg=String(e?.message||e||""); if(!/INTERNAL ASSERTION|AsyncQueue is already failed|Unexpected state/i.test(msg) || DEMO) return false;
  if(S.fsBroken) return true; S.fsBroken=true; SYNC.err="Database connection stopped"; syncPaint();
  let n=0; try{ n=Number(sessionStorage.getItem("apeis_fsfail")||0); sessionStorage.setItem("apeis_fsfail",String(n+1)); }catch(x){}
  const box=document.createElement("div"); box.className="fsbox"; box.innerHTML=`<b>The database connection on this computer stopped working.</b> This is a known glitch of the Firebase storage inside the browser — <u>everything already saved is safe on the server</u>.
    ${n?"It happened again, so clear this computer's offline copy (it downloads fresh from the server).":"Reload the page and repeat the last step."}<div class="row" style="justify-content:flex-start;margin-top:8px">
    <button class="btn" onclick="location.reload()">Reload now</button><button class="btn r" id="fsClear">Clear offline copy & reload</button></div>`;
  document.body.appendChild(box); box.querySelector("#fsClear").onclick=()=>{ box.querySelector("#fsClear").disabled=true; DB.repair(); };
  return true; }
addEventListener("unhandledrejection", e=>fsFail(e.reason)); addEventListener("error", e=>fsFail(e.error||e.message));
setTimeout(()=>{ try{ sessionStorage.removeItem("apeis_fsfail"); }catch(x){} }, 10*60e3);
/* every student write also updates that school's small search index (stuIdx/{school}.i.{id}) — 6 small documents instead of thousands of reads */
const IDX_F = ["admNo","name","father","cl","sec","gender","cat","status","fatherCnic","contact","dob","bform","motherCnic","contact2","fatherRank","unit","serviceNo","cv","pType","mother","guardian","guardianRel","guardianCnic","dup","dupOk","eyes","height","weight","allergies","disability","ver","medDate","vacc","medication"];
const IDX_SEP = "\u001f";
const idxArr = r => IDX_F.map(k=>r[k]===DEL||r[k]==null?"":String(r[k]).replace(/\u001f/g," ")).join(IDX_SEP);
const idxObj = (id, school, a) => { if(typeof a==="string") a=a.split(IDX_SEP); const o={id,school}; IDX_F.forEach((k,i)=>o[k]=(a&&a[i])||""); if(o.contact) o.contact=fmtPhones(o.contact); if(o.contact2) o.contact2=fmtPhones(o.contact2); return o; };
function idxFind(id){ for(const [sc,m] of Object.entries(S.idx||{})) if(m[id]) return idxObj(id,sc,m[id]); return null; }
function addIdxOps(ops){ if(ops.noIdx) return;
  const add=(school,id,v)=>ops.set.push({col:"stuIdx",id:school,data:{i:{[id]:v}},merge:"deep",_idx:1});
  const full=id=>{ for(const L of Object.values(S.stu)){ const r=L.rows.find(r=>r.id===id); if(r) return r; } return idxFind(id); };
  for(const x of [...ops.set]) if(x.col==="students"){ const base=x.merge?full(x.id)||{}:{}; const r={...base,...x.data}; if(r.school) add(r.school,x.id,idxArr(r)); }
  for(const x of ops.upd) if(x.col==="students"){ const base=full(x.id); if(!base) continue; const r={...base,...x.data}; add(r.school,x.id,idxArr(r)); if(x.data.school && base.school && x.data.school!==base.school) add(base.school,x.id,DEL); }
  for(const x of ops.del||[]) if(x.col==="students"){ const base=full(x.id); if(base) add(base.school,x.id,DEL); }
}
function txToOps(ops, tx){
  tx.id = tx.id || newId();
  ops.set.push({ col:"transactions", id:tx.id, data:{ ...tx, at:TS, by:me().uid, byName:me().name||"", status:"ok", session:session() } });
  for (const [school,cl,sec,n] of effects(tx)){ ops.inc.push({ school, key:K(cl,sec,tx.gender), n }); if(tx.cat) ops.inc.push({ school, key:cl+"|"+tx.cat, n, f:"c" }); }
  return tx.id;
}
function voidToOps(ops, tx, reason){
  ops.upd.push({ col:"transactions", id:tx.id, data:{ status:"void", voidBy:me().name||me().uid, voidAt:TS, voidReason:reason||"" } });
  for (const [school,cl,sec,n] of effects(tx)){ ops.inc.push({ school, key:K(cl,sec,tx.gender), n:-n }); if(tx.cat) ops.inc.push({ school, key:cl+"|"+tx.cat, n:-n, f:"c" }); }
}
function snapshotData(){ const d={}; for(const s of schoolList()){ const st=schoolStats(s.code); d[s.code]={str:st.str,auth:st.auth,g:st.g,b:st.b,wait:st.wait,n:st.n,w:Object.fromEntries(st.classes.filter(c=>c.wait).map(c=>[c.cl,c.wait]))}; if(hasDc(s)) d[s.code].dc=dcStr(s.code); } return d; }
async function ensureSnapshot(force){
  const day=isoDay(Date.now());
  if(!force && S.snapshots.some(x=>x.day===day)) return;
  if(!Object.keys(S.schools).length) return;
  try{ await DB.apply({set:[{col:"snapshots",id:day,data:{day,at:TS,by:me().name||"",d:snapshotData()}}],upd:[],inc:[]}, true); if(force) toast("Snapshot saved for "+day+"."); }catch(e){ if(force) toast(e.message,true); }
}

const Fire = {

    on(m.query(m.collection(db,"transactions"), m.where("at",">=", m.Timestamp.fromMillis(Date.now()-8*864e5))),
       q=>{ S.recentTx=q.docs.map(d=>{const x=data(d); x.atMs=toMs(x.at); return x;}).sort((a,b)=>b.atMs-a.atMs); refresh(); });

function buildSeed(){

/* keep the in-memory student lists in step with every write (no extra reads) */
function patchStuCache(ops){
  const now=Date.now(), fix=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v===TS?now:v]));
  for(const x of ops.set||[]) if(x.col==="students"){ const d=fix(x.data), L=S.stu[d.school]; if(L){ const i=L.rows.findIndex(r=>r.id===x.id); const row={id:x.id,...(x.merge&&i>=0?L.rows[i]:{}),...d}; i>=0?L.rows[i]=row:L.rows.push(row); } }
  for(const x of ops.upd||[]) if(x.col==="students") for(const L of Object.values(S.stu)){ const r=L.rows.find(r=>r.id===x.id); if(r) Object.assign(r,fix(x.data)); }
  for(const x of ops.del||[]) if(x.col==="students") for(const L of Object.values(S.stu)) L.rows=L.rows.filter(r=>r.id!==x.id);
}

function parseHash(str){ const raw=(str??location.hash??"").replace(/^#/,""); const i=raw.indexOf("?"); const v=decodeURIComponent(i<0?raw:raw.slice(0,i)); const p={};
  if(i>=0) for(const kv of raw.slice(i+1).split("&")){ if(!kv) continue; const j=kv.indexOf("="); p[decodeURIComponent(j<0?kv:kv.slice(0,j))]=decodeURIComponent(j<0?"":kv.slice(j+1)); } return {v,p}; }
function hashFor(view, params){ const q=Object.entries(params||{}).filter(([,v])=>v!==undefined&&v!==null&&v!=="").map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&"); return "#"+view+(q?"?"+q:""); }
function go(view, params){ const hs=hashFor(view,params); if(location.hash===hs) applyRoute(true); else location.hash=hs; }
function setParams(p, replace){ const np={...S.params,...p}; for(const k in np) if(np[k]===""||np[k]==null) delete np[k]; const hs=hashFor(S.view,np);
  if(replace){ history.replaceState(null,"",hs); S.params=np; if(S.navStack.length) S.navStack[S.navStack.length-1]=hs; } else location.hash=hs; }
function routeFix(r){ if(r.v==="live") r.v="dash"; if(r.v==="categories"){ r.v="students"; r.p={tab:"cat",...r.p}; } return r; }
function applyRoute(force){
  if(!S.user || S.user.pending) return; const r=routeFix(parseHash()); let v=r.v;
  if(!allowed(v)){ v=allowed(S.view)?S.view:homeView(); r.p={}; }
  const hs=location.hash||"#"+v, st=S.navStack;
  if(st.length>1 && st[st.length-2]===hs) st.pop(); else if(st.at(-1)!==hs) st.push(hs); if(st.length>60) st.shift();
  const same = v===S.view && JSON.stringify(r.p)===JSON.stringify(S.params);
  S.view=v; S.params=r.p; if(same && !force) return; renderView(); window.scrollTo(0,0); actLog(v);
}

function topBars(){ requestAnimationFrame(()=>{ for(const sc of $$("main .scroll, .modal .scroll")){
  let bar=sc.previousElementSibling; if(!bar || !bar.classList.contains("tsb")){ bar=document.createElement("div"); bar.className="tsb"; bar.innerHTML="<div></div>"; sc.before(bar);
    let lock=false; bar.addEventListener("scroll",()=>{ if(lock){ lock=false; return; } lock=true; sc.scrollLeft=bar.scrollLeft; }); sc.addEventListener("scroll",()=>{ if(lock){ lock=false; return; } lock=true; bar.scrollLeft=sc.scrollLeft; }); }
  if(!sc.dataset.io){ sc.dataset.io=1; tsbIO.observe(sc); }
  bar.firstChild.style.width=sc.scrollWidth+"px"; bar.hidden = sc.scrollWidth <= sc.clientWidth+2; bar.scrollLeft=sc.scrollLeft; } }); }
const tsbIO = new IntersectionObserver(es=>{ for(const e of es){ const bar=e.target.previousElementSibling; if(bar?.classList.contains("tsb")) bar.style.visibility=e.isIntersecting?"":"hidden"; } });

function classTable(code, st, interactive){ const cx=cl=>interactive?{school:code,cl}:null;
  const cols=["n","auth","str","g","b","sd","wait"]; if(st.classes.some(c=>c.inc)) cols.splice(1,0,"inc");
  let body="", grp=null, acc=[];
  const flush=()=>{ if(acc.length>1) body+=statRow(h(L("total"))+` <span class="mute">${h(grp)}</span>`,addUp(acc),cols,"sub"); acc=[]; };
  for(const c of st.classes){
    if(c.grp!==grp){ flush(); grp=c.grp; } acc.push(c); const op=interactive && S.open.has(code+"|"+c.cl);
    body+=statRow(`<b>${h(c.cl)}</b>${interactive?` <span class="mute">${op?"▾":"▸"}</span>`:""}`,c,cols,interactive?"click":"",interactive?`data-act="toggleClass" data-id="${h(code+"|"+c.cl)}"`:"",cx(c.cl));
    if(op) body+=c.secs.map(x=>`<tr class="secrow"><td>${h(c.cl)} - ${h(x.s)}</td>${cols.map(k=>k==="n"||k==="inc"||k==="wait"?`<td class="n"></td>`:`<td class="n dn" ${dAttr(k,{school:code,cl:c.cl,sec:x.s})}>${k==="sd"?sg(x.sd):nf(x[k])}</td>`).join("")}</tr>`).join("");
  }
  flush();
  return `<table>${headRow(L("cl"),cols)}<tbody>${body}${statRow(h(L("gtotal")),st,cols,"tot","",interactive?{school:code}:null)}</tbody></table>`;
}
function consTable(codes){

  const grp=codes.length===schoolList().length?"":(S.liveCons||ST().consGroup||"");
  for(const g of C){ body+=g.rows.map(r=>statRow(`<b>${h(r.cl)}</b>`,r,cols,"","",{lvl:r.cl,grp})).join(""); body+=statRow(`${h(L("total"))} <span class="mute">${h(g.stage)}</span>`,addUp(g.rows),cols,"sub"); all.push(...g.rows); }
  return `<table>${headRow(L("cl"),cols)}<tbody>${body}${statRow(h(L("gtotal")),addUp(all),cols,"tot")}</tbody></table>`;
}

function wireCombo(){
  const inp=$("#fCS"), list=$("#fCSList"); if(!inp) return; let hi=0, items=[];
  const sc=()=>S.schools[entrySchool()];
  const show=()=>{ items=csMatch(entrySchool(), inp.dataset.cl?"":inp.value).slice(0,14); hi=0; draw(); list.hidden=!items.length; };
  const draw=()=>{ list.innerHTML=items.map((o,i)=>{ const v=cur(entrySchool(),o.cl,o.s); const cap=secCap(sc(), sc().classes.find(c=>c.cl===o.cl).secs.find(z=>z.s===o.s));
      return `<div class="${i===hi?"hi":""}" data-i="${i}">${h(o.label)}<small>${v.g+v.b}/${cap}</small></div>`; }).join(""); };
  const pick=o=>{ if(!o) return; inp.value=o.label; inp.dataset.cl=o.cl; inp.dataset.s=o.s; list.hidden=true;
    const g=genderFor(entrySchool(),o.cl); if(g) $("#fGen").value=g; entryToggle(); fillRegion("eCls",true); };
  inp.addEventListener("input",()=>{ delete inp.dataset.cl; delete inp.dataset.s; show(); });
  inp.addEventListener("focus",()=>{ inp.select(); if(!inp.dataset.cl) show(); });
  inp.addEventListener("blur",()=>setTimeout(()=>{ list.hidden=true; if(!inp.dataset.cl && inp.value){ const m=csMatch(entrySchool(),inp.value); if(m.length===1||(m[0]&&m[0].keys.includes(norm(inp.value)))) pick(m[0]); } },120));
  inp.addEventListener("keydown",e=>{
    if(list.hidden){ if(e.key==="ArrowDown"){ show(); e.preventDefault(); } return; }
    if(e.key==="ArrowDown"){ hi=Math.min(hi+1,items.length-1); draw(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ hi=Math.max(hi-1,0); draw(); e.preventDefault(); }
    else if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); pick(items[hi]); const nx=$$("#fToSec,#fDest,#fExt,#fAdm").find(x=>!x.closest("[hidden]")); nx&&nx.focus(); }
    else if(e.key==="Tab" && !e.shiftKey){ pick(items[hi]); }
    else if(e.key==="Escape"){ list.hidden=true; }
  });
  list.addEventListener("mousedown",e=>{ const d=e.target.closest("[data-i]"); if(d){ e.preventDefault(); pick(items[+d.dataset.i]); $("#fAdm").focus(); } });
}
function entryToggle(){

  const dest=$("#fDest").value;
  $("#wToSec").hidden = k!=="sec"; $("#wDest").hidden = k!=="apei_out"; $("#wDestCl").hidden = k!=="apei_out"||dest==="__other";
  $("#wExt").hidden = !(k==="apei_in" || (k==="apei_out"&&dest==="__other")); $("#fExtL").textContent = k==="apei_in" ? "From APEI" : "To APEI (name)";
  if(k==="sec"){ const c=S.schools[code].classes.find(x=>x.cl===inp.dataset.cl); $("#fToSec").innerHTML=(c?c.secs.filter(x=>x.s!==inp.dataset.s):[]).map(x=>`<option>${h(x.s)}</option>`).join(""); }

    $("#fDestCl").innerHTML=(d?d.classes:[]).map(c=>`<option ${c.cl===(prev||inp.dataset.cl)?"selected":""}>${h(c.cl)}</option>`).join(""); }

function effFromDate(v){ if(!v || v===isoDay(Date.now())) return null; const t=Date.parse(v+"T12:00"); return isNaN(t)?null:t; }
function buildTxOps(ops, tx){   // shared by fast entry and Excel import
  const k=actDef(tx.action).kind;
  const st = tx.studentId ? (stuOf(tx.school)||[]).find(r=>r.id===tx.studentId) : findStuByAdm(tx.school, tx.admNo);
  stuOpsForTx(ops, tx, st);
  if(k==="apei_out" && tx.toSchool && tx.toSchool!=="__other"){
    const tid=newId(); tx.tfrId=tid; const outId=txToOps(ops,tx);
    ops.set.push({col:"transfers",id:tid,data:{ from:tx.school, to:tx.toSchool, fromCl:tx.cl, fromSec:tx.sec, toCl:tx.toCl||tx.cl, name:tx.name, father:tx.father||"", dob:tx.dob||"", admNo:tx.admNo||"", gender:tx.gender, cat:tx.cat, remarks:tx.remarks||"", outTx:outId, status:"pending", at:TS, by:me().uid, byName:me().name||"",
      stu: st ? stuSnapshot(st) : {admNo:tx.admNo||"",name:tx.name,father:tx.father||"",dob:tx.dob||"",gender:tx.gender,cat:tx.cat||""} }});
  } else txToOps(ops,tx);
}
async function saveEntry(){
  const code=entrySchool(), inp=$("#fCS"), a=$("#fAct").value, k=actDef(a).kind;
  if(!inp.dataset.cl){ toast("Pick a valid Class – Section from the list.",true); inp.focus(); return; }
  if(isLocked(code)){ toast(LOCK_MSG,true); return; }
  const gender=$("#fGen").value; if(!gender){ toast("Select gender (B / G).",true); $("#fGen").focus(); return; }
  const tx={ school:code, action:a, cl:inp.dataset.cl, sec:inp.dataset.s, gender, cat:$("#fCat").value, name:$("#fName").value.trim(), father:$("#fFather").value.trim(),
    dob:parseDob($("#fDob").value), admNo:$("#fAdm").value.trim(), remarks:$("#fRem").value.trim(), eff:$("#fDate").value };
  const cn=$("#fCnic").value.trim(), con=$("#fCon").value.trim(); if(cn && digits(cn).length!==13){ toast("Father CNIC must have 13 digits (or leave it blank).",true); $("#fCnic").focus(); return; }
  if(con && phonesBad(con).length){ toast(`"${phonesBad(con)[0]}" is not a phone number — write it like 0300-1234567 (several: separate with commas).`,true); $("#fCon").focus(); return; }
  const fp=S.formPending?.how==="entry"?S.formPending:null;
  tx.stuExtra={...(fp?fp.extra:{}),...(cn?{fatherCnic:fmtCnic(cn)}:{}),...(con?{contact:fmtPhones(con)}:{})};
  const eff=effFromDate(tx.eff); if(eff) tx.effMs=eff;
  if(!tx.name){ toast("Student name is required.",true); $("#fName").focus(); return; }
  if(!tx.admNo && KIND_D[k]>0){ toast("Adm / Reg No is required for every student.",true); $("#fAdm").focus(); return; }
  if(KIND_D[k]>0 && a!=="APEI_IN"){ const D=dupOf({name:tx.name,father:tx.father,fatherCnic:cn,admNo:tx.admNo,school:code}); if(D.length){ if(!S.dupAck){ dupAsk(D,()=>saveEntry()); return; } tx.stuExtra.dup="1"; tx.stuExtra.dupWith=D.map(x=>x.r.id).join(","); } }
  S.dupAck=false;
  if(tx.dob===null){ toast("Date of birth not understood — type it like 14-03-2019.",true); $("#fDob").focus(); return; }
  const now=cur(code,tx.cl,tx.sec);
  if(KIND_D[k]<0 || k==="sec"){ if(now[gender]<=0){ toast(`No ${gender==="g"?"girls":"boys"} on roll in ${tx.cl} - ${tx.sec}. Check the section/gender.`,true); return; } }
  if(k==="sec"){ tx.toCl=tx.cl; tx.toSec=$("#fToSec").value; if(!tx.toSec){ toast("This class has no other section.",true); return; } }
  if(k==="apei_out"){ tx.toSchool=$("#fDest").value; if(tx.toSchool==="__other"){ tx.ext=$("#fExt").value.trim(); } else tx.toCl=$("#fDestCl").value; }
  if(k==="apei_in"){ tx.ext=$("#fExt").value.trim(); }
  try{ await ensureStu(code); }catch(e){}
  if(S.entryStu && norm(S.entryStu.admNo)===norm(tx.admNo)) tx.studentId=S.entryStu.id;
  const ops=opsNew(); const how=entryOps(ops,tx); if(fp && KIND_D[k]>0 && tx.studentId) formAttach(ops,tx.studentId,code);
  try{ await DB.apply(ops); }catch(e){ toast("Not saved: "+e.message,true); return; }
  S.entryStu=null; if($("#fFound")) $("#fFound").textContent="";
  const tcl=tx.toSec?tx.toCl:tx.cl, tsec=tx.toSec||tx.sec, after=cur(code,tcl,tsec), sc=S.schools[code], so=sc.classes.find(c=>c.cl===tcl)?.secs.find(z=>z.s===tsec);
  const over=(KIND_D[k]>0||k==="sec") && so && after.g+after.b>secCap(sc,so);
  if(how==="pending"){ toast(`Sent for approval: ${AL(a)} — ${tx.name} (${tx.cl}-${tx.sec}). It changes strength once the DQ Office approves it.`); for(const id of ["fAdm","fName","fFather","fCnic","fCon","fDob","fRem","fExt"]) $("#"+id).value=""; inp.focus(); inp.select(); return; }
  toast(`Saved: ${AL(a)} — ${tx.name} (${tx.cl}-${tx.sec})`+(tx.tfrId?`. ${tx.toSchool} must accept it in Transfers.`:"")+(over?" ⚠ Section now over capacity.":""), over);
  for(const id of ["fAdm","fName","fFather","fCnic","fCon","fDob","fRem","fExt"]) $("#"+id).value="";
  inp.focus(); inp.select();
}

  return tbl("ACTIVITY BY ACCOUNT (Super Admin not listed)",["Account","Role","School","Entries","Voided","Record edits","Last activity",""],rows); }
async function runLog(){ const f=$("#lgFrom"), t=$("#lgTo"); if(!f) return; const from=new Date(f.value+"T00:00").getTime(), to=new Date(t.value+"T23:59:59").getTime(); const tab=logTab();

    if(tab!=="edits"){ S.logRows=await DB.fetchTx(from-8*864e5,to); S.logRows=S.logRows.filter(x=>tTime(x)>=from&&tTime(x)<=to).sort((a,b)=>tTime(b)-tTime(a)); }
    if(tab!=="tx"){ const sch=$("#lgSch")?.value, by=$("#lgBy")?.value, q=norm($("#lgQ")?.value||""); const E=await DB.query("edits","day",">=",f.value);
      S.editRows=E.filter(e=>e.day<=t.value&&(!sch||e.school===sch)&&(!by||e.by===by)&&(!q||norm(e.stuName+e.admNo).includes(q))).sort((a,b)=>toMs(b.at)-toMs(a.at)); } }
  catch(e){ toast("Log not loaded: "+e.message,true); S.logRows ||= []; S.editRows ||= []; } fillRegion("lgRows",true); }

/* =====================================================================
   15) SEARCH, DRILL-DOWNS, STUDENT PAGE, SIBLINGS, EDIT AUDIT
   Search reads the small per-school index (stuIdx), so it covers all six schools instantly.
   ===================================================================== */
let idxMemo={src:null,rows:[]};
function idxAll(){ if(idxMemo.src===S.idx) return idxMemo.rows; const out=[];
  for(const [sc,m] of Object.entries(S.idx||{})){ if(!S.schools[sc]) continue; for(const [id,a] of Object.entries(m)) out.push(idxObj(id,sc,a)); }
  idxMemo={src:S.idx,rows:out}; return out; }
const qs = o => Object.entries(o).filter(([,v])=>v!==undefined&&v!==null&&v!=="").map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
const pq = str => Object.fromEntries(String(str||"").split("&").filter(Boolean).map(kv=>{ const i=kv.indexOf("="); return [kv.slice(0,i),decodeURIComponent(kv.slice(i+1))]; }));
const digits = v => String(v??"").replace(/\D/g,"");
const cnicKey = v => { const d=digits(v); return d.length===13 ? d : ""; };
const fmtCnic = v => { const d=digits(v); return d.length===13 ? `${d.slice(0,5)}-${d.slice(5,12)}-${d.slice(12)}` : String(v??""); };
const gTxt = g => g==="g"?"G":g==="b"?"B":"";
function clOrder(){ const m=new Map(); for(const s of schoolList()) s.classes.forEach((c,i)=>m.set(s.code+"|"+c.cl,i)); return m; }
const ST_ORDER = {"On roll":0,"Transferred out":1,"Left":2};
function sortStu(rows){ const o=clOrder(), so=new Map(schoolList().map((s,i)=>[s.code,i]));
  return rows.sort((a,b)=>(ST_ORDER[a.status]??3)-(ST_ORDER[b.status]??3)||(so.get(a.school)??9)-(so.get(b.school)??9)||(o.get(a.school+"|"+a.cl)??99)-(o.get(b.school+"|"+b.cl)??99)||String(a.sec).localeCompare(String(b.sec))||String(a.name).localeCompare(String(b.name))); }

/* "9a girls JM ali" → class IX section A, girls, school JM, name contains "ali" */
function levelsAll(){ const L=new Map(); for(const s of schoolList()) for(const c of s.classes){ const l=lvlOf(c); if(!L.has(l)) L.set(l,new Set()); c.secs.forEach(x=>L.get(l).add(x.s)); } return L; }
function parseQ(q){
  const f={text:[], num:[]}; const LV=levelsAll(); const keys=[...LV.keys()].map(l=>({l,k:[norm(l),norm(arab(l))]})).sort((a,b)=>b.k[0].length-a.k[0].length);
  for(let t of String(q||"").trim().split(/\s+/).filter(Boolean)){ const n=norm(t);
    if(!n) continue;
    const sc=schoolList().find(s=>norm(s.code)===n); if(sc && !f.school){ f.school=sc.code; continue; }
    if(["girls","girl"].includes(n)){ f.g="g"; continue; } if(["boys","boy"].includes(n)){ f.g="b"; continue; }
    if(["left","slc"].includes(n)){ f.st="Left"; continue; } if(n==="transferred"){ f.st="Transferred out"; continue; } if(n==="onroll"){ f.st="On roll"; continue; }
    const cm=t.match(/^(?:#|cat)(\d+)$/i); if(cm && cats()[+cm[1]-1]){ f.cat=cats()[+cm[1]-1]; continue; }
    if(/^\d{4,}$/.test(digits(t)) && digits(t).length===n.length){ f.num.push(n); continue; }
    let hit=null; if(!f.lvl) for(const {l,k} of keys){ for(const kk of k){ if(n===kk){ hit={l}; break; } if(n.startsWith(kk) && kk.length>=1){ const r=n.slice(kk.length); const sec=[...LV.get(l)].find(s=>norm(s)===r); if(sec){ hit={l,sec}; break; } } } if(hit) break; }
    if(hit && !/^[a-z]{4,}$/.test(n.replace(/\d/g,"")) ){ f.lvl=hit.l; if(hit.sec) f.sec=hit.sec; continue; }
    f.text.push(n);
  }
  return f; }
function findRows(p){
  const q=parseQ(p.q), school=p.school||q.school, lvl=p.lvl||q.lvl, sec=p.sec||q.sec, g=p.g||q.g, cat=p.cat||q.cat, st=p.st||q.st||"";
  const grpCodes = p.grp ? schoolList().filter(s=>s.grp===p.grp).map(s=>s.code) : null;
  return sortStu(idxAll().filter(r=>(!school||r.school===school) && (!grpCodes||grpCodes.includes(r.school)) && (!p.cl||r.cl===p.cl) && (!lvl||lvlOf({cl:r.cl})===lvl) && (!sec||r.sec===sec)
    && (!g||r.gender===g) && (!cat||canonCat(r.cat)===cat) && (!st||r.status===st) && (!p.cv||r.cv)
    && q.num.every(d=>[r.admNo,r.fatherCnic,r.motherCnic,r.contact,r.bform].some(v=>digits(v).includes(d)||norm(v).includes(d)))
    && q.text.every(t=>norm(r.name+" "+r.father+" "+r.mother+" "+r.guardian+" "+r.admNo+" "+r.fatherRank+" "+r.unit+" "+r.serviceNo).includes(t)))); }
/* best matches first: words that START with what was typed ("Lt" → Lt, Lt Col, Lt Gen before "Altaf") */
function rankRows(rows, q){ const T=parseQ(q).text; if(!T.length) return rows; const words=r=>(r.name+" "+r.father+" "+r.fatherRank+" "+r.unit).toLowerCase().split(/[^a-z0-9]+/);
  const sc=r=>{ const W=words(r); return T.reduce((a,t)=>a+(W.some(w=>w===t)?3:W.some(w=>w.startsWith(t))?2:1),0); }; return rows.map(r=>[sc(r),r]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]); }

/* ---------- the search box in the blue band ---------- */
function wireGlobalSearch(){
  const inp=$("#gq"), list=$("#gqList"); if(!inp) return; let items=[], hi=-1;
  const draw=()=>{ list.innerHTML=items.map((r,i)=>`<div class="${i===hi?"hi":""}" data-i="${i}"><b>${h(r.name)}${r.status!=="On roll"?` <span class="tag t-out">${h(r.status)}</span>`:""}</b><small>${r.gender==="g"?"d/o":"s/o"} ${h(r.father||"—")}${r.fatherRank?` (${h(r.fatherRank)})`:""} · ${h(r.school)} ${h(r.cl)}-${h(r.sec)} · Adm ${h(r.admNo||"—")}</small></div>`).join("")
      +(inp.value.trim()?`<div data-i="all" class="${hi===items.length?"hi":""}"><b>Show all results for “${h(inp.value.trim())}” ↵</b><small>${items.length?"":"No quick match — press Enter to search with filters"}</small></div>`:""); list.hidden=!inp.value.trim(); };
  inp.addEventListener("input",()=>{ clearTimeout(S.gqT); S.gqT=setTimeout(()=>{ items=inp.value.trim()?rankRows(findRows({q:inp.value}),inp.value).slice(0,8):[]; hi=-1; draw(); },120); });
  inp.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"){ hi=Math.min(hi+1,items.length); draw(); e.preventDefault(); } else if(e.key==="ArrowUp"){ hi=Math.max(hi-1,-1); draw(); e.preventDefault(); }
    else if(e.key==="Enter"){ e.preventDefault(); const r=items[hi]; list.hidden=true; if(r) go("student",{id:r.id}); else if(inp.value.trim()) go("find",{q:inp.value.trim()}); inp.blur(); }
    else if(e.key==="Escape"){ list.hidden=true; inp.blur(); } });
  inp.addEventListener("blur",()=>setTimeout(()=>list.hidden=true,150));
  inp.addEventListener("focus",()=>{ if(inp.value.trim()) draw(); });
  list.addEventListener("mousedown",e=>{ const d=e.target.closest("[data-i]"); if(!d) return; e.preventDefault(); list.hidden=true; if(d.dataset.i==="all") go("find",{q:inp.value.trim()}); else go("student",{id:items[+d.dataset.i].id}); });
  document.addEventListener("keydown",e=>{ if(e.key==="/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")){ e.preventDefault(); inp.focus(); } });
}

    await DB.apply(ops); toast(`${d.name} updated — ${ch.length} change${ch.length>1?"s":""} logged.`);
    if(["cl","sec","status"].some(k=>ch.some(c=>c.k===k))) toast("Saved. Note: editing the record does not change strength — use Entry for admissions, withdrawals and section transfers.");
    S.sp.rec={...old,...d}; S.sp.editing=canEditDirect(); S.sp.edits=null; fillRegion("spBody",true);
    DB.query("edits","stuId","==",id).then(x=>{ if(S.sp?.id===id){ S.sp.edits=x.sort((a,b)=>toMs(b.at)-toMs(a.at)); fillRegion("spBody",true); } }).catch(()=>{});
  } else { if(!S.dupAck){ const D=dupOf({...d,school:code}); if(D.length){ dupAsk(D,()=>stuSave(f)); return; } } const dx=S.dupAck?{dup:"1",dupWith:dupOf({...d,school:code}).map(x=>x.r.id).join(",")}:{}; S.dupAck=false; const nid=newId(); const fx=S.formPending?.how==="bank"?{formVerifiedBy:S.formPending.extra.formVerifiedBy,formVerifiedAt:S.formPending.extra.formVerifiedAt}:{}; ops.set.push({col:"students",id:nid,data:{school:code,...d,...fx,...dx,createdAt:TS,updatedAt:TS,by:me().name||""}}); if(S.formPending?.how==="bank") formAttach(ops,nid,code); await DB.apply(ops); toast(`${d.name} added to the data bank.`); history.replaceState(null,"",hashFor("student",{id:nid})); S.params={id:nid}; loadStuPage(); }

const PTYPES = [["f","Father"],["m","Mother (father not on record — separated / deceased)"],["g","Guardian (relative, adoptive parent…)"]];

const famKey = r => r.pType==="g"&&cnicKey(r.guardianCnic) ? "g"+cnicKey(r.guardianCnic) : r.pType==="m"&&cnicKey(r.motherCnic) ? "m"+cnicKey(r.motherCnic) : cnicKey(r.fatherCnic) ? "f"+cnicKey(r.fatherCnic) : cnicKey(r.guardianCnic) ? "g"+cnicKey(r.guardianCnic) : "";
function families(){ const M=new Map(); for(const r of idxAll()){ if(r.status!=="On roll" && !S.params.sibAll) continue; const k=famKey(r); if(!k) continue; if(!M.has(k)) M.set(k,[]); M.get(k).push(r); }
  return [...M.entries()].filter(([,v])=>v.length>1).map(([k,v])=>({k,kids:sortStu(v),schools:[...new Set(v.map(x=>x.school))]})).sort((a,b)=>b.kids.length-a.kids.length||parentName(a.kids[0]).localeCompare(parentName(b.kids[0]))); }

async function rebuildIdx(){ let n=0; const bad=[]; for(const s of schoolList(true)){ try{ const R=await ensureStu(s.code,true); const i={}; for(const r of R){ i[r.id]=idxArr(r); n++; }
    await DB.apply({set:[{col:"stuIdx",id:s.code,data:{i},_idx:1}],upd:[],inc:[]},true); }catch(e){ bad.push(s.code+": "+e.message); } }

/* generic reader: header row found by aliases; returns rows of {line, v} */
async function readTable(file, cols, need){ let rows; try{ rows=await readSheet(file); }catch(e){ toast("Could not read the file: "+e.message,true); return null; }
  const al=(k,lab,extra)=>[norm(k),norm(lab),...(extra||[]).map(norm)];
  let hi=-1, map={}; for(let i=0;i<Math.min(rows.length,12)&&hi<0;i++){ const m={}; rows[i].forEach((x,j)=>{ const n=norm(x); const c=cols.find(c=>al(c[0],c[1],c[2]).includes(n)); if(c&&m[c[0]]===undefined) m[c[0]]=j; }); if(need.every(k=>m[k]!==undefined)){ hi=i; map=m; } }
  if(hi<0){ toast(`Columns ${need.map(k=>cols.find(c=>c[0]===k)[1]).join(", ")} not found — please use the template.`,true); return null; }
  const out=[]; rows.slice(hi+1).forEach((r,ix)=>{ const v={}; let any=false; for(const [k] of cols){ if(map[k]===undefined) continue; let x=r[map[k]]; if(x instanceof Date) x=fmtD(x.getTime()); x=String(x??"").trim(); if(x) any=true; v[k]=x; } if(any) out.push({line:hi+ix+2, v, errs:[], warns:[]}); });
  return out; }

function chkCs(code, v, E){ const o=matchClassSec(code,v.cl,v.sec); if(o) return o; if(!String(v.cl||"").trim()) E("cl","missing"); else if(!classOk(code,v.cl)) E("cl",`"${v.cl}" is not a class of ${code}`); else E("sec",`section "${v.sec}" is not in class ${v.cl}`); return null; }
function chkGender(v, E, code, cl){ const g=parseGender(v.gender); if(g) return g; if(String(v.gender||"").trim()){ E("gender",`"${v.gender}" — use B or G (or 1 = Boy, 2 = Girl)`); return ""; } const a=cl?genderFor(code,cl):""; if(!a) E("gender","missing — B or G (or 1 / 2)"); return a; }
function chkDate(v, k, E, opt){ const x=String(v[k]||"").trim(); if(!x) return ""; const d=parseDob(x); if(d===null){ E(k,`"${x}" is not a date — use dd-mm-yyyy`); return null; } if(opt?.future===false && d>isoDay(Date.now())){ E(k,"is in the future"); return null; } return d; }
function chkCat(v, E, W){ const c=matchCat(v.cat); if(c.bad){ E("cat",`"${v.cat}" is not a category — use its number 1–${cats().length}`); return ""; } if(c.warn&&W) W(c.warn); return c.cat; }
function chkCnic(v, k, E){ const x=String(v[k]||"").trim(); if(!x) return ""; if(digits(x).length!==13){ E(k,"must have 13 digits"); return ""; } return fmtCnic(x); }
const mkRow = r => { const E=(c,m)=>r.errs.push({c,m}), W=m=>r.warns.push(m); return [E,W]; };

/* ---- movement entries ---- */
async function impEntries(file){
  const code=entrySchool(), cols=ENTRY_COLS.map(([k,l])=>[k,l,ALIASES[k]]); const rows=await readTable(file,cols,["action","cl","name"]); if(!rows) return;
  try{ await ensureStu(code); }catch(e){}
  const sim={}, simCur=(cl,s,g)=>{ const k=K(cl,s,g); if(sim[k]===undefined) sim[k]=cur(code,cl,s)[g]; return k; };
  for(const r of rows){ const v=r.v, [E,W]=mkRow(r);
    const a=matchAction(v.action); if(!a) E("action",v.action?`"${v.action}" is not an action — copy one from "Valid values"`:"missing");
    const o=chkCs(code,v,E); const name=v.name; if(!name) E("name","missing");
    const gender=chkGender(v,E,code,o?.cl); const dob=chkDate(v,"dob",E,{future:false}); const eff=chkDate(v,"date",E,{future:false}); const cat=chkCat(v,E,W); const cnic=chkCnic(v,"cnic",E);
    if(v.contact && phonesBad(v.contact).length) E("contact",`"${phonesBad(v.contact)[0]}" is not a phone number (0300-1234567; several: separate with commas)`);
    const tx={school:code, action:a?.code, cl:o?.cl, sec:o?.s, gender, cat, name, father:v.father||"", dob:dob||"", admNo:v.adm||"", remarks:v.remarks||"", eff:eff||isoDay(Date.now()), stuExtra:{...(cnic?{fatherCnic:cnic}:{}),...(v.contact?{contact:fmtPhones(v.contact)}:{})}};
    const em=effFromDate(eff); if(em) tx.effMs=em;
    if(a && o && !r.errs.length){ const k=a.kind, apei=String(v.apei||"").trim();
      if(k==="sec"){ const ts=S.schools[code].classes.find(x=>x.cl===o.cl).secs.find(x=>norm(x.s)===norm(v.tosec)); if(!ts) E("tosec",v.tosec?`section "${v.tosec}" not in ${o.cl}`:"missing — needed for a section transfer"); else if(ts.s===o.s) E("tosec","same as the present section"); else { tx.toCl=o.cl; tx.toSec=ts.s; } }
      if(k==="apei_out"){ const dest=schoolList().find(s=>norm(s.code)===norm(apei)&&s.code!==code); if(dest){ tx.toSchool=dest.code; const tc=dest.classes.find(x=>norm(x.cl)===norm(v.tocl||o.cl)); tx.toCl=tc?tc.cl:dest.classes[0]?.cl; if(!tc) W(`To Class not found in ${dest.code} — ${tx.toCl} used; the receiving school can change it`); } else { tx.toSchool="__other"; tx.ext=apei; if(!apei) E("apei","missing — the APEI the student goes to"); } }
      if(k==="apei_in") tx.ext=apei;
      const d=KIND_D[k]; if(d<0||k==="sec"){ const kk=simCur(o.cl,o.s,gender); if(sim[kk]<=0) E("sec",`no ${gender==="g"?"girls":"boys"} left on roll in ${o.cl}-${o.s}`); else sim[kk]--; }
      if(d>0){ const kk=simCur(o.cl,o.s,gender); sim[kk]++; } if(k==="sec"&&tx.toSec){ const kk=simCur(o.cl,tx.toSec,gender); sim[kk]++; } }
    r.tx=tx; }
  impSet({kind:"entries", region:"eImp", school:code, file:file.name, cols:ENTRY_COLS, rows,
    commit: async good=>{ if(isLocked(code)) throw new Error(LOCK_MSG); const ops=opsNew(); for(const r of good) entryOps(ops,{...r.tx}); await DB.apply(ops); toast(`${good.length} entries imported into ${code}.`); } });
}

const STU_ALIAS = { admNo:["adm","admno","admregno","admissionno","regno","rollno"], name:["name","studentname"], father:["father","fathername","fname"], gender:["gender","genderbg","sex","genderbgor12"], dob:["dob","dateofbirth"],

async function impStudents(file){
  const code=stuSchool(); await ensureStu(code); const F=activeFields(); const cols=F.map(f=>[f.key,f.label,STU_ALIAS[f.key]]); const rows=await readTable(file,cols,["name","cl"]); if(!rows) return;
  const seen=new Set();
  for(const r of rows){ const v=r.v, [E,W]=mkRow(r), d={};
    for(const f of F){ if(v[f.key]===undefined) continue; let x=v[f.key]; if(f.type==="date"&&x){ const p=chkDate(v,f.key,E); x=p||""; } d[f.key]=x; }
    if(!v.name) E("name","missing"); const o=chkCs(code,v,E); if(o){ d.cl=o.cl; d.sec=o.s; }
    d.gender=chkGender(v,E,code,o?.cl); if(v.cat!==undefined) d.cat=String(v.cat).trim()?chkCat(v,E,W):"";

/* =====================================================================
   20) NEW SESSION & PROMOTION (Super Admin)
   Every section's students move up to the class/section chosen here; repeaters stay; final classes pass out.
   The finished year is archived; each student keeps a "school years" history line.
   ===================================================================== */
const PROMO_OUT = "__out";
function promoState(){ return S.promo ||= {school:schoolList()[0]?.code, map:{}, stay:{}, rep:{}, carryWait:true}; }
function promoDefaultMap(code){ const sc=S.schools[code], A=stages().flatMap(g=>g.levels), m={};
  for(const c of sc.classes){ const l=lvlOf(c), i=A.indexOf(l), nl=i>=0&&i<A.length-1?A[i+1]:null; let t=null;
    if(nl){ const cand=sc.classes.filter(x=>lvlOf(x)===nl); const rest=norm(c.cl.replace(l,""));
      t=cand.find(x=>x.cl===c.cl.replace(l,nl)) || cand.find(x=>norm(x.cl.replace(nl,""))===rest) || cand[0] || null; }
    for(const x of c.secs) m[c.cl+"|"+x.s] = t ? {cl:t.cl, sec:(t.secs.find(y=>y.s===x.s)||t.secs[0]).s} : {cl:PROMO_OUT}; }
  return m; }
const promoMap = code => { const P=promoState(); return P.map[code] ||= promoDefaultMap(code); };
/* students repeating: from the list of names (data bank) — the number can be raised by hand for students not in the data bank */
function repCount(code, cl, sec){ const r={g:0,b:0}; for(const id of Object.keys(promoState().rep)){ const x=idxFind(id); if(x && x.school===code && x.cl===cl && x.sec===sec && x.status==="On roll") r[x.gender==="g"?"g":"b"]++; } return r; }
function promoStay(code, cl, sec){ const o=promoState().stay[code]?.[cl+"|"+sec]; const rc=repCount(code,cl,sec); return {g:Math.max(o?.g??0,rc.g), b:Math.max(o?.b??0,rc.b)}; }
/* the result for one school: new opening figure for every section */
function promoPlan(code){ const sc=S.schools[code], m=promoMap(code), res={}, out={g:0,b:0}, stay={g:0,b:0}, moved={g:0,b:0}, warn=[];
  const put=(cl,s,g,b)=>{ const k=cl+"|"+s; const r=res[k] ||= {g:0,b:0,fromG:0,fromB:0,stayG:0,stayB:0}; return r; };
  for(const c of sc.classes) for(const x of c.secs) put(c.cl,x.s);
  for(const c of sc.classes) for(const x of c.secs){ const v=cur(code,c.cl,x.s), st=promoStay(code,c.cl,x.s), sg=Math.min(st.g,v.g), sb=Math.min(st.b,v.b), mg=v.g-sg, mb=v.b-sb;
    const own=res[c.cl+"|"+x.s]; own.stayG+=sg; own.stayB+=sb; stay.g+=sg; stay.b+=sb;
    const t=m[c.cl+"|"+x.s]||{cl:PROMO_OUT};
    if(t.cl===PROMO_OUT){ out.g+=mg; out.b+=mb; continue; }
    const tr=res[t.cl+"|"+t.sec]; if(!tr){ warn.push(`${c.cl}-${x.s}: target ${t.cl}-${t.sec} no longer exists`); out.g+=mg; out.b+=mb; continue; }
    tr.fromG+=mg; tr.fromB+=mb; moved.g+=mg; moved.b+=mb; }
  for(const r of Object.values(res)){ r.g=r.fromG+r.stayG; r.b=r.fromB+r.stayB; }
  return {res, out, stay, moved, warn}; }
function promoCats(code, plan){   // category figures follow the students, in proportion
  const sc=S.schools[code], m=promoMap(code), tgt={};
  for(const c of sc.classes){ const st=classStats(code,c); if(!st.str) continue; const keep={};
    for(const x of st.secs){ const t=m[c.cl+"|"+x.s]||{cl:PROMO_OUT}; const own=plan.res[c.cl+"|"+x.s]; const stayN=Math.min(own.stayG+own.stayB, x.str), moveN=x.str-stayN;
      for(const [k,v] of Object.entries(st.cats)){ keep[k]=(keep[k]||0)+v*stayN/st.str; if(t.cl!==PROMO_OUT && moveN) { const d=(tgt[t.cl] ||= {}); d[k]=(d[k]||0)+v*moveN/st.str; } } }
    const d=(tgt["__stay|"+c.cl] ||= {}); for(const [k,v] of Object.entries(keep)) d[k]=(d[k]||0)+v; }
  const outC={}; for(const c of sc.classes){ const r={}; for(const src of [tgt[c.cl]||{}, tgt["__stay|"+c.cl]||{}]) for(const [k,v] of Object.entries(src)) r[k]=(r[k]||0)+v;
    outC[c.cl]=Object.fromEntries(Object.entries(r).map(([k,v])=>[k,Math.round(v)]).filter(([,v])=>v)); }
  return outC; }

      ${all.map(x=>{ const n=Object.values(x.p.res).reduce((q,r)=>q+r.g+r.b,0); return `<tr class="click ${x.s.code===code?"sel":""}" data-act="promoSchool" data-id="${h(x.s.code)}"><td><b>${h(x.s.code)}</b> <span class="mute">${h(x.s.name)}</span>${x.p.warn.length?` <span class="tag t-out">check</span>`:""}</td><td class="n">${nf(x.st.str)}</td><td class="n">${nf(x.p.moved.g+x.p.moved.b)}</td><td class="n">${nf(x.p.stay.g+x.p.stay.b)}</td><td class="n">${nf(x.p.out.g+x.p.out.b)}</td><td class="n"><b>${nf(n)}</b></td><td class="n">${nf(x.st.auth)}</td><td class="n">${sg(n-x.st.auth)}</td></tr>`; }).join("")}
      <tr class="tot"><td>${h(L("gtotal"))}</td><td class="n">${nf(T.now)}</td><td class="n">${nf(T.mv)}</td><td class="n">${nf(T.st)}</td><td class="n">${nf(T.out)}</td><td class="n">${nf(T.nw)}</td><td class="n">${nf(T.auth)}</td><td class="n">${sgt(T.nw-T.auth)}</td></tr></table></div></div>

   <div class="panel"><div class="ph"><h2>Step 1 — where each section of ${h(code)} goes</h2><div class="pills">${schoolList().map(s=>`<button class="pill ${s.code===code?"on":""}" data-act="promoSchool" data-id="${h(s.code)}">${h(s.code)}</button>`).join("")}<button class="btn s" data-act="promoReset">Reset ${h(code)} to suggested</button></div></div>

    ${plan.warn.length?`<p class="neg">${plan.warn.map(h).join("<br>")}</p>`:""}

          <td class="n"><input class="in num" type="number" min="0" max="${v.g}" data-ps="g" data-k="${h(k)}" value="${st.g||""}"></td><td class="n"><input class="in num" type="number" min="0" max="${v.b}" data-ps="b" data-k="${h(k)}" value="${st.b||""}"></td></tr>`; }).join("")).join("")}</table></div></div>

async function impRep(file){ const rows=await readTable(file,REP_COLS,["school","adm"]); if(!rows) return;
  for(const r of rows){ const v=r.v, [E,W]=mkRow(r); const sc=schoolList().find(s=>norm(s.code)===norm(v.school)); if(!sc){ E("school",`"${v.school}" is not a school code`); continue; }

async function promoGo(){ const ns=$("#pgName").value.trim(), start=$("#pgStart").value, prom=$("#pgProm").checked, carry=$("#pgWait").checked;
  if($("#pgConfirm").value!=="ROLLOVER"){ toast("Type ROLLOVER exactly.",true); return; } if(!ns||!start) return; if(ns===session()){ toast("That is the current session's label.",true); return; }
  const old=session(), today=isoDay(Date.now()); toast("Starting the new session… please keep this page open.");
  const plans=Object.fromEntries(schoolList(true).map(s=>[s.code,prom?promoPlan(s.code):null]));
  /* 1) archive the year + new opening strength + reset counters (one batch) */
  const ops=opsNew();
  ops.set.push({col:"sessions",id:old,data:{id:old,start:ST().sessionStart||"2026-04-01",startMs:baseStartMs(),end:today,endMs:Date.now(),schools:JSON.parse(JSON.stringify(S.schools,(k,v)=>k==="id"?undefined:v)),promoted:prom,at:TS}});
  for(const s of schoolList(true)){ const sc=cloneSchool(s.code); delete sc.id; const p=plans[s.code], cc=p?promoCats(s.code,p):null;
    sc.classes.forEach(c=>{ c.inc=0; c.cat = cc ? cc[c.cl]||{} : classStats(s.code,c).cats;
      c.secs.forEach(x=>{ if(p){ const r=p.res[c.cl+"|"+x.s]; x.g=r.g; x.b=r.b; } else { const v=cur(s.code,c.cl,x.s); x.g=v.g; x.b=v.b; } }); });
    ops.set.push({col:"schools",id:s.code,data:sc}); ops.set.push({col:"strength",id:s.code,data:{d:{},w:{},c:{}}}); }
  for(const t of S.tfrapps.filter(t=>tfrOpen(t.status))) ops.upd.push({col:"tfrapps",id:t.id,data:{cl:nextLevel(t.cl),prevCl:t.cl,session:ns,promotedAt:TS}});
  if(carry) for(const w of S.waiting.filter(w=>waitCounted(w.status))) ops.upd.push({col:"waiting",id:w.id,data:{session:ns,prevSession:old}});
  ops.set.push({col:"settings",id:"app",data:{session:ns,sessionStart:start,baseStartMs:Date.now()},merge:true});
  try{ await DB.apply(ops); }catch(e){ toast("Nothing changed — "+e.message,true); return; }
  /* 2) every student in the data bank: move up / repeat / pass out, with a history line */
  let n=0; const so=opsNew(); so.noIdx=true;
  for(const s of schoolList(true)){ const R=await ensureStu(s.code,true).catch(()=>[]); const m=prom?promoMap(s.code):{};
    for(const r of R){ if(r.status!=="On roll") continue; const hist=[...(r.hist||[]),{s:old,school:s.code,cl:r.cl,sec:r.sec}]; const t=m[r.cl+"|"+r.sec];
      if(!prom || promoState().rep[r.id]){ hist.at(-1).res=prom?"Repeated":""; so.upd.push({col:"students",id:r.id,data:{hist,updatedAt:TS}}); }
      else if(!t || t.cl===PROMO_OUT){ hist.at(-1).res="Passed out"; so.upd.push({col:"students",id:r.id,data:{hist,status:"Passed out",leftDate:today,leftReason:`Passed out / completed ${r.cl} (${old})`,updatedAt:TS}}); }
      else { hist.at(-1).res="Promoted"; so.upd.push({col:"students",id:r.id,data:{hist,cl:t.cl,sec:t.sec,updatedAt:TS}}); }
      n++; } }
  try{ if(n) await DB.apply(so); await rebuildIdx(); }catch(e){ toast("Strength is rolled over, but the student records were not all updated: "+e.message+" — open this page again and press Rebuild search index.",true); }
  S.promo=null; S.imp=null; toast(`Session ${ns} started. ${nf(n)} student records updated.`); boot(); }

/* ---------- phone numbers: always saved as 0300-1234567; several per student, separated by commas ---------- */
function fmtPhone(v){ let d=digits(v); if(!d) return ""; if(d.startsWith("0092")) d=d.slice(2); if(d.startsWith("92") && d.length===12) d="0"+d.slice(2); if(d.length===10 && d[0]==="3") d="0"+d;
  return /^03\d{9}$/.test(d) ? d.slice(0,4)+"-"+d.slice(4) : d; }
function splitPhones(v){ const out=[]; let buf="";
  for(const tok of String(v??"").split(/[,;\/\n|]+|\s+|\band\b/i).map(x=>x.trim()).filter(Boolean)){ buf=buf?buf+" "+tok:tok; if(digits(buf).length>=10){ out.push(...unglue(buf)); buf=""; } }
  if(digits(buf).length) out.push(buf); return out; }
/* "0316950103603199035732" = two mobile numbers written without a gap */
function unglue(x){ let d=digits(x); if(d.length<20) return [x]; const r=[];
  while(d.length){ if(d.startsWith("03")&&d.length>=11){ r.push(d.slice(0,11)); d=d.slice(11); } else if(d.startsWith("3")&&d.length>=10){ r.push("0"+d.slice(0,10)); d=d.slice(10); } else if(d.startsWith("923")&&d.length>=12){ r.push("0"+d.slice(2,12)); d=d.slice(12); } else return [x]; }
  return r; }
const fmtPhones = v => [...new Set(splitPhones(v).map(fmtPhone).filter(Boolean))].join(", ");
const phoneOk = p => { const d=digits(p); return /^03\d{9}$/.test(d) || (d[0]==="0" && d.length>=9 && d.length<=11); };
const phonesBad = v => splitPhones(v).filter(x=>!phoneOk(fmtPhone(x)));
const waNo = p => { const d=digits(p); return d[0]==="0" ? "92"+d.slice(1) : d; };
const PHONE_KEYS = new Set(["contact","contact2"]);

    const nums=[...splitPhones(r.contact),...splitPhones(r.contact2)].map(fmtPhone).filter(phoneOk); if(!nums.length) continue;

const FORM_FIELDS = [["name","Student name"],["father","Father name"],["gender","Gender (B/G)"],["dob","Date of birth"],["cl","Class applied for"],["bform","B-Form No"],["fatherCnic","Father CNIC"],["motherCnic","Mother CNIC"],
