function shrinkImage(file, max=1600, q=0.72){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); URL.revokeObjectURL(img.src); }; img.onerror=()=>rej(new Error("This file is not a picture the browser can open (use JPG or PNG).")); img.src=URL.createObjectURL(file); }); }
async function aiRead(dataUrl){
  const cfg=await loadAi(); if(!cfg.key) throw new Error("Form reading is not switched on yet — the Super Admin adds the free Google AI key in Setup → Form reading.");
  const prompt=`You are reading a HANDWRITTEN school admission form from Pakistan (APEIs / Army Public Schools). The writing may be English or Urdu and is often unclear.
Return ONLY JSON with these keys (empty string if not on the form): ${FORM_FIELDS.map(f=>f[0]).join(", ")}, unsure.
Rules: gender "B" or "G". dob as dd-mm-yyyy. CNIC as 12345-1234567-1. contact: every phone number on the form, separated by commas. cl: the class applied for, e.g. "EYS-I", "Pre-I", "I", "IV", "IX".
cat: pick the closest of: ${cats().join(" | ")} — or "" if not clear. Write names in English letters even if written in Urdu.
unsure: an array of the keys you could not read confidently. Never guess numbers: if a digit is unreadable, leave the field empty and list it in unsure.`;
  const models=[cfg.model||"gemini-flash-latest","gemini-2.5-flash"].filter((x,i,a)=>a.indexOf(x)===i); let last;
  for(const model of models){ try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
        body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:"image/jpeg",data:dataUrl.split(",")[1]}}]}],generationConfig:{responseMimeType:"application/json",temperature:0}})});
      const j=await r.json(); if(!r.ok){ last=new Error(j.error?.message||("HTTP "+r.status)); if(r.status===404) continue; throw last; }
      const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(""); const o=JSON.parse(t.replace(/^```(json)?|```$/g,"").trim()); return o;
    }catch(e){ last=e; if(!/404|not found/i.test(e.message)) break; } }
  throw new Error("The form could not be read: "+(last?.message||"no answer")); }

/* ---------- undo a change made to a student's record (Super Admin) ---------- */
const catFromLabel = s => { const m=String(s||"").match(/^\d+\.\s*(.*)$/); return m?m[1]:String(s||""); };
async function revertEdit(e){ if(!canUndoEdits(e.school)){ toast("Undoing record changes is not allowed for your account at this time.",true); return; }
  const r=await DB.getDoc("students",e.stuId); if(!r){ toast("That student record no longer exists.",true); return; }
  const back={}, skipped=[];
  for(const c of e.changes||[]){ const now=c.k==="cat"?catLabel(r.cat):String(r[c.k]??""); if(now!==String(c.to??"")){ skipped.push(c.l||c.k); continue; } back[c.k]=c.k==="cat"?catFromLabel(c.from):c.from; }
  if(!Object.keys(back).length){ toast("Nothing to undo — those fields have been changed again since.",true); return; }
  const ch=Object.keys(back).map(k=>{ const c=e.changes.find(x=>x.k===k); return {k,l:c.l,from:c.to,to:c.from}; });
  await DB.apply({set:[{col:"edits",id:newId(),data:{stuId:e.stuId,school:e.school,stuName:e.stuName,admNo:e.admNo||"",changes:ch,revertOf:e.id,at:TS,day:isoDay(Date.now()),by:me().uid,byName:me().name||"",role:role()}}],upd:[{col:"students",id:e.stuId,data:{...back,updatedAt:TS,updatedBy:me().name||""}}],inc:[]});
  toast(`Change undone for ${e.stuName}.`+(skipped.length?` Not undone (changed again since): ${skipped.join(", ")}.`:""));
  if(S.view==="log") runLog(); if(S.view==="student") loadStuPage(); }

  if(canDecide()){ const late=todayStatus().filter(x=>x.state==="none"); if(late.length) out.push({id:"late_"+today, urgent:false, html:`⏰ Past the ${h(ST().dailyDeadline||"09:00")} deadline with nothing entered: ${late.map(x=>h(x.code)).join(", ")}`, go:"dash"}); }

  return out; }

/* =====================================================================
   24) REPLACE THE BASE DATA WITH A CATEGORY-WISE SECTION SHEET ("CATWISE STUDENTS DATA - APEIs")
   Each section's total and category figures become today's live strength. Earlier entries stay in the log and in history.
   ===================================================================== */
const CAT_FIX = { "war wonded":"War Wounded", "civs":"Civ", "civ":"Civ" };
const OLD_CAT_MAP = { "coasyouthpkg":"COAS Youth", "shaheedfamily":"Army Shaheed", "apeisteaching":"APEIs Teaching Staff", "apeisadm":"APEIs Adm Staff", "offrsservingdefpaid":"Def Paid Offrs",
  "jcoservingdefpaid":"Def Paid JCOs", "ncoservingdefpaid":"Def Paid NCOs", "isdinservicedeath":"ISD", "warwounded":"War Wounded" };
function sheetCatName(grp, sub){ const g=String(grp||"").trim(), s=String(sub??"").trim(), gl=g.toLowerCase();
  const rank = /^offr/i.test(g)?"Offrs":/^jco/i.test(g)?"JCO":/^nco/i.test(g)?"NCO":null;
  if(rank){ const m=s.match(/^(army|paf|fc|navy)\s*(serv|retd)/i); if(m){ const svc={army:"Army",paf:"PAF",fc:"FC",navy:"Navy"}[m[1].toLowerCase()]; return `${rank} ${/serv/i.test(m[2])?"Serving":"Retd"} (${svc})`; } }
  if(/def\s*paid/i.test(g)) return `Def Paid ${s||""}`.trim();
  if(/apeis\s*staff/i.test(g)) return /teach/i.test(s)?"APEIs Teaching Staff":/adm/i.test(s)?"APEIs Adm Staff":`APEIs ${s}`;
  if(/spec/i.test(g)){ const n=Number(s); return isNaN(n)||!s ? "Spec Concession At Par (Offr/JCO/NCO)" : `Spec Concession ${Math.round(n*100)}%`; }
  if(CAT_FIX[gl]) return CAT_FIX[gl];
  return s && !g ? s : g + (s&&g&&s!==g?` ${s}`:""); }
const secKey = s => norm(String(s).split(/[-\s(]/)[0]);
function matchSchoolName(t){ const n=norm(t); if(!n) return null; return schoolList(true).find(s=>norm(s.name)===n || norm(s.code)===n) || schoolList(true).find(s=>norm(s.name).startsWith(n) || n.startsWith(norm(s.name))) || null; }

async function parseCatSheet(file){
  const rows=await readSheet(file); const hi=rows.findIndex(r=>norm(r[0])==="school" && r.some(x=>norm(x)==="class"));
  if(hi<0) throw new Error("Header row with School / Class / Sec not found.");
  const H1=rows[hi], H2=rows[hi+1]||[], iCl=H1.findIndex(x=>norm(x)==="class"), iSec=H1.findIndex(x=>norm(x)==="sec"), iTot=H1.findIndex(x=>norm(x)==="total");
  if(iCl<0||iSec<0||iTot<0) throw new Error("Columns Class, Sec and Total must be in the header row.");
  const cols=[]; let grp=""; for(let j=iSec+1;j<iTot;j++){ if(String(H1[j]??"").trim()) grp=String(H1[j]).trim(); cols.push({j,name:sheetCatName(grp, H2[j]===0?"":H2[j])}); }
  const names=cols.map(c=>c.name); if(new Set(names).size!==names.length) throw new Error("Two category columns came out with the same name: "+names.filter((x,i)=>names.indexOf(x)!==i).join(", "));
  const data={}, warn=[], dc={}; let school=null, cl=null, lastSecs=new Set(), afterTotal=false;
  for(let i=hi+2;i<rows.length;i++){ const r=rows[i], a=String(r[0]??"").trim(), c=String(r[iCl]??"").trim(), s=String(r[iSec]??"").trim();
    if(/summary/i.test(a)) break;
    if(a && norm(a)!=="school"){ const sc=matchSchoolName(a); if(!sc){ warn.push(`Row ${i+1}: school "${a}" not recognised — its rows are skipped.`); school=null; continue; } school=sc.code; data[school] ||= []; cl=null; lastSecs=new Set(); }
    if(!school) continue;
    if(/day\s*care/i.test(c)){ dc[school]=Number(r[iTot])||0; continue; }
    if(c && !/^(g\.?\s*)?total$|^class$/i.test(c)){ cl=c; lastSecs=new Set(); afterTotal=false; }
    else if(/total/i.test(c) || (!c && !s && Number(r[iTot]))){ afterTotal=true; }
    if(!s || /^sec$/i.test(s) || s==="0") { if(!s && !c && Number(r[iTot])) afterTotal=true; continue; }
    if(!cl){ warn.push(`Row ${i+1}: section ${s} has no class.`); continue; }
    if(afterTotal && lastSecs.has(norm(s))){ const nl=nextLevel(lvlOf({cl:sheetLvl(cl)})); warn.push(`Row ${i+1}: no class written for section ${s} after ${cl} — taken as ${nl}.`); cl=nl; lastSecs=new Set(); }
    afterTotal=false; lastSecs.add(norm(s));
    const cat={}; let sum=0; for(const k of cols){ const v=Math.max(0,Math.round(Number(r[k.j])||0)); if(v){ cat[k.name]=v; sum+=v; } }
    const tot=Math.round(Number(r[iTot])||0); if(tot!==sum) warn.push(`Row ${i+1} (${school} ${cl}-${s}): categories add up to ${sum} but Total says ${tot} — ${sum} used.`);
    data[school].push({cl, lvl:lvlOf({cl:sheetLvl(cl)}), sec:s, cat, n:sum, line:i+1}); }
  return {cats:names, data, dc, warn, file:file.name}; }
const sheetLvl = cl => String(cl).trim().replace(/^eys-?1$/i,"EYS-I").replace(/^eys-?2$/i,"EYS-II").replace(/^eys-?3$/i,"Pre-I").replace(/^ig-?i$/i,"IG-1");

/* plan: map every sheet section onto the school's existing classes; rename / add / empty sections where needed */
function rebasePlan(P){ const out={schools:{}, renames:[], warn:[...P.warn], est:0};
  for(const [code, list] of Object.entries(P.data)){ const sc=cloneSchool(code); delete sc.id; const gt=sc.gtype||"mixed"; const used=new Set(), res={}, ren=[], added=[], dropped=[];
    const prevRatio={}, clsRatio={}; for(const c of sc.classes){ let g=0,t=0; for(const x of c.secs){ const v=cur(code,c.cl,x.s); prevRatio[c.cl+"|"+x.s]=v.g+v.b?v.g/(v.g+v.b):null; g+=v.g; t+=v.g+v.b; } clsRatio[c.cl]=t?g/t:null; }
    const byLvl={}; for(const r of list) (byLvl[r.lvl] ||= []).push(r);
    for(const [lvl, R] of Object.entries(byLvl)){ let C=sc.classes.filter(c=>lvlOf(c)===lvl);
      if(!C.length){ const nc={grp:(stages().find(g=>g.levels.includes(lvl))||{name:"Other"}).name, cl:lvl, inc:0, secs:[]}; sc.classes.push(nc); C=[nc]; out.warn.push(`${code}: class ${lvl} did not exist — added.`); }
      const E=C.flatMap(c=>c.secs.map(x=>({c,x}))); const free=()=>E.filter(e=>!used.has(e.c.cl+"|"+e.x.s));
      const pend=[];
      for(const r of R){ const e=free().find(e=>secKey(e.x.s)===norm(r.sec)); if(e){ used.add(e.c.cl+"|"+e.x.s); res[e.c.cl+"|"+e.x.s]={r,c:e.c,x:e.x,from:e.x.s}; } else pend.push(r); }
      for(const r of pend){ const e=free()[0]; if(e){ const from=e.x.s; ren.push(`${e.c.cl}: ${from} → ${r.sec}`); out.renames.push({school:code,cl:e.c.cl,from,to:r.sec}); e.x.s=r.sec; used.add(e.c.cl+"|"+r.sec); res[e.c.cl+"|"+r.sec]={r,c:e.c,x:e.x,from,renamed:true}; }
        else { const c=C[0], x={s:r.sec,g:0,b:0}; c.secs.push(x); used.add(c.cl+"|"+r.sec); added.push(`${c.cl}-${r.sec}`); res[c.cl+"|"+r.sec]={r,c,x,from:null}; } } }
    for(const c of sc.classes){ const left=c.secs.filter(x=>!used.has(c.cl+"|"+x.s)); for(const x of left) dropped.push(`${c.cl}-${x.s}`); c.secs=c.secs.filter(x=>used.has(c.cl+"|"+x.s)); }
    sc.classes=sc.classes.filter(c=>c.secs.length);
    for(const v of Object.values(res)){ const n=v.r.n, g=/girls/i.test(v.c.cl)?"g":/boys/i.test(v.c.cl)?"b":gt==="girls"?"g":gt==="boys"?"b":"";
      if(g){ v.x.g=g==="g"?n:0; v.x.b=g==="b"?n:0; delete v.x.est; }
      else { const ratio=v.from!=null?prevRatio[v.c.cl+"|"+v.from]:null; const rt=ratio??clsRatio[v.c.cl]??0.5;
        v.x.g=Math.round(n*rt); v.x.b=n-v.x.g; v.x.est=1; out.est++; }
      v.x.cat=v.r.cat; }
    for(const c of sc.classes){ const t={}; for(const x of c.secs) for(const [k,v] of Object.entries(x.cat||{})) t[k]=(t[k]||0)+v; c.cat=t; }
    const now=schoolStats(code).str, nw=sc.classes.reduce((a,c)=>a+c.secs.reduce((q,x)=>q+x.g+x.b,0),0);
    out.schools[code]={sc, now, nw, ren, added, dropped, dc:P.dc[code]}; }
  return out; }
function rebaseHtml(){ const R=S.rebase; if(!R) return ""; const P=R.plan;
  return `<div class="panel"><h2>Preview — ${h(R.parsed.file)}</h2>
    <div class="scroll"><table><tr><th>School</th><th class="n">Strength now</th><th class="n">From the sheet</th><th class="n">Difference</th><th class="n">Day care (separate)</th><th>Sections renamed</th><th>Added</th><th>Removed (not in sheet)</th></tr>
    ${Object.entries(P.schools).map(([k,x])=>`<tr><td><b>${h(k)}</b></td><td class="n">${nf(x.now)}</td><td class="n"><b>${nf(x.nw)}</b></td><td class="n">${sg(x.nw-x.now)}</td><td class="n">${x.dc??"–"}</td><td style="white-space:normal;font-size:12.5px">${h(x.ren.join("; ")||"—")}</td><td style="white-space:normal;font-size:12.5px">${h(x.added.join(", ")||"—")}</td><td style="white-space:normal;font-size:12.5px" class="${x.dropped.length?"neg":""}">${h(x.dropped.join(", ")||"—")}</td></tr>`).join("")}

    <p><b>${R.parsed.cats.length} categories</b>, numbered in the sheet's order: ${R.parsed.cats.map((c,i)=>`${i+1}. ${h(c)}`).join(" · ")}</p>

async function rebaseGo(){ const R=S.rebase; if($("#rbConfirm").value.trim()!=="REPLACE"){ toast("Type REPLACE to confirm.",true); return; }
  const now=Date.now(), today=isoDay(now), P=R.plan, ops=opsNew();
  /* 1) keep the old base so every earlier date still shows correctly */
  ops.set.push({col:"sessions",id:"base-"+today+"-"+fmtT(now).replace(":",""),data:{id:"base-"+today,label:"before "+fmtD(now),session:session(),start:ST().sessionStart||"2026-04-01",startMs:ST().baseStartMs||Date.parse((ST().sessionStart||"2026-04-01")+"T00:00"),end:today,endMs:now,schools:JSON.parse(JSON.stringify(S.schools,(k,v)=>k==="id"?undefined:v)),at:TS}});
  for(const [code,x] of Object.entries(P.schools)){ ops.set.push({col:"schools",id:code,data:x.sc}); ops.set.push({col:"strength",id:code,data:{d:{},c:{},w:(S.strength[code]||{}).w||{}}});
    if(x.dc!=null){ const d=dcOf(code); ops.set.push({col:"dcare",id:code,data:{str:x.dc,useReg:false,updatedAt:TS,byName:me().name||"",remarks:d.remarks||""},merge:"deep"}); } }
  /* 2) categories: the sheet's list, numbered; old names point to the new ones */
  const C=R.parsed.cats, al={...(ST().catAlias||{})}; for(const o of cats()){ if(C.includes(o)) continue; const t=C.find(n=>norm(n)===norm(o)) || OLD_CAT_MAP[norm(o)]; if(t && C.includes(t)) al[o]=t; }
  const keepOld=cats().filter(o=>!C.includes(o) && !al[o]);
  ops.set.push({col:"settings",id:"app",data:{categories:[...C,...keepOld],catAlias:al,catGroups:defaultCatGroups([...C,...keepOld]),baseStartMs:now,baseFrom:R.parsed.file},merge:true});
  try{ await DB.apply(ops); }catch(e){ toast("Nothing changed — "+e.message,true); return; }
  /* 3) students whose section was renamed */
  if(P.renames.length){ const so=opsNew(); so.noIdx=true; for(const rn of P.renames){ const L0=await ensureStu(rn.school,true).catch(()=>[]); for(const r of L0) if(r.cl===rn.cl && r.sec===rn.from && r.status==="On roll") so.upd.push({col:"students",id:r.id,data:{sec:rn.to,updatedAt:TS}}); }
    if(so.upd.length){ await DB.apply(so); await rebuildIdx(); } }
  S.rebase=null; S.asOfCache={}; toast(`Base data replaced: ${nf(Object.values(P.schools).reduce((a,x)=>a+x.nw,0))} students in ${Object.keys(P.schools).length} schools, ${C.length} categories.`); boot(); }

  for(const c of codes){ const sc=S.schools[c]; for(const cl of sc.classes) for(const x of cl.secs){ const sm=secSummary(c,cl,x), a=sm.cat?.[cat]||0, b=bk[c+"|"+cl.cl+"|"+x.s]||0; if(a||b) out.push({c,cl:cl.cl,s:x.s,a,b}); } }

function catGroupRows(R){ let out="", sc=null, cs=null, n=0; const cnt={}, cc={}; for(const r of R){ cnt[r.school]=(cnt[r.school]||0)+1; const k=r.school+"|"+r.cl+"|"+r.sec; cc[k]=(cc[k]||0)+1; }

/* ---------- student photos: small JPEG (about 20 KB) per student, one at a time or a whole folder named by Adm No ---------- */
async function photoOf(id){ S.photo ||= {}; if(id in S.photo) return S.photo[id]; try{ const d=await DB.getDoc("photos",id); S.photo[id]=d?.img||null; }catch(e){ S.photo[id]=null; } return S.photo[id]; }
async function photoSave(id, school, file){ const img=await shrinkImage(file,320,0.72); await DB.apply({set:[{col:"photos",id,data:{img,school,at:TS,by:me().name||""}}],upd:[],inc:[]}); (S.photo ||= {})[id]=img; return img; }
const admKey = name => norm(String(name).replace(/\.[a-z0-9]+$/i,"").replace(/\s*\(\d+\)$/,""));
function photosPlan(files){ const code=stuSchool(), R=stuOf(code)||[], by=new Map(R.filter(r=>r.admNo).map(r=>[admKey(r.admNo),r])), ok=[], miss=[];
  for(const f of files){ const r=by.get(admKey(f.name)); r ? ok.push({f,r}) : miss.push(f.name); } return {code, ok, miss}; }
function photosDlg(files){ const P=photosPlan(files); S.photoPlan=P;
  modal(`<h3>Upload student photos — ${h(P.code)}</h3><p><b class="pos">${P.ok.length}</b> pictures match a student's Adm No${P.miss.length?`; <b class="neg">${P.miss.length}</b> do not match any Adm No in ${h(P.code)}'s data bank and will be skipped`:""}.</p>
    ${P.miss.length?`<details><summary>Not matched (${P.miss.length})</summary><p class="mute" style="white-space:normal">${P.miss.slice(0,300).map(h).join(", ")}</p></details>`:""}
    <p class="hint">Each picture is reduced to a small passport size (about 20 KB) before upload. Name files by Adm No: 16045.jpg, 16046.png …</p>
    <p id="phProg" class="hint"></p><div class="row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="photosGo" ${P.ok.length?"":"disabled"}>Upload ${P.ok.length} photo${P.ok.length===1?"":"s"}</button></div>`); }
async function photosGo(){ const P=S.photoPlan; if(!P) return; const btn=$("[data-act=photosGo]"); if(btn) btn.disabled=true; let done=0, fail=0; const chunk=40;
  for(let i=0;i<P.ok.length;i+=chunk){ const ops=opsNew();
    for(const {f,r} of P.ok.slice(i,i+chunk)){ try{ const img=await shrinkImage(f,320,0.72); ops.set.push({col:"photos",id:r.id,data:{img,school:r.school,at:TS,by:me().name||""}}); (S.photo ||= {})[r.id]=img; }catch(e){ fail++; } }
    try{ await DB.apply(ops,true); done+=ops.set.length; }catch(e){ fail+=ops.set.length; if(fsFail(e)) break; }
    const pr=$("#phProg"); if(pr) pr.textContent=`Uploaded ${done} of ${P.ok.length}…`; }
  closeModal(); toast(`${done} photos uploaded${fail?`, ${fail} failed (not pictures?)`:""}.`, !!fail); S.photoPlan=null; }

/* =====================================================================
   26) REVIEW OF CLERKS' ENTRIES (dual check) — switched on/off by the Super Admin
   hold  = a clerk's entry waits as "pending" and changes strength only after approval
   count = it changes strength at once but stays in "Review entries" until checked
   ===================================================================== */
const reviewOn = () => !!ST().review?.on;
const reviewMode = () => ST().review?.mode==="count" ? "count" : "hold";
const needsReview = () => reviewOn() && role()==="clerk";
const reviewRows = () => S.recentTx.filter(t=>t.status==="pending" || (t.status==="ok" && t.rev===false));
const reviewCount = () => canDecide() ? reviewRows().length : 0;
/* used instead of buildTxOps when the entry must wait */
function entryOps(ops, tx){
  if(needsReview() && reviewMode()==="hold"){ tx.id=newId(); ops.set.push({col:"transactions",id:tx.id,data:{...tx,at:TS,by:me().uid,byName:me().name||"",status:"pending",session:session()}}); return "pending"; }
  buildTxOps(ops,tx); if(needsReview()){ const o=ops.set.find(x=>x.col==="transactions"&&x.id===tx.id); if(o) o.data.rev=false; } return "ok"; }
async function approveTx(list){ const ops=opsNew(), skip=[];
  const sim={}; const left=(t)=>{ const k=K(t.cl,t.sec,t.gender); if(sim[k]===undefined) sim[k]=cur(t.school,t.cl,t.sec)[t.gender]; return k; };
  await Promise.all([...new Set(list.map(t=>t.school))].map(c=>ensureStu(c).catch(()=>[])));
  for(const t of list.sort((a,b)=>a.atMs-b.atMs)){
    if(t.status==="ok"){ ops.upd.push({col:"transactions",id:t.id,data:{rev:true,approvedBy:me().name||"",approvedAt:TS}}); continue; }
    if(t.status!=="pending") continue; const k=actDef(t.action).kind;
    if(KIND_D[k]<0||k==="sec"){ const kk=left(t); if(sim[kk]<=0){ skip.push(`${t.name} (${t.cl}-${t.sec}): no ${t.gender==="g"?"girl":"boy"} left on roll`); continue; } sim[kk]--; }
    const tx=clone(t); for(const f of ["status","atMs","at","by","byName","rev"]) delete tx[f]; if(tx.effMs===undefined) delete tx.effMs;
    const n0=ops.set.length; buildTxOps(ops,tx); const o=ops.set.slice(n0).find(x=>x.col==="transactions"&&x.id===t.id);
    if(o){ o.data.at=t.at??TS; o.data.by=t.by; o.data.byName=t.byName||""; o.data.approvedBy=me().name||""; o.data.approvedAt=TS; o.data.rev=true; } }
  if(ops.set.length||ops.upd.length) await DB.apply(ops);
  toast(`${list.length-skip.length} entr${list.length-skip.length===1?"y":"ies"} approved.`+(skip.length?` Not approved: ${skip.join("; ")}.`:""), !!skip.length); }
async function rejectTx(list, reason){ const ops=opsNew();
  for(const t of list){ if(t.status==="pending") ops.upd.push({col:"transactions",id:t.id,data:{status:"rejected",rejReason:reason||"",rejBy:me().name||"",rejAt:TS}});
    else if(t.status==="ok"){ voidToOps(ops,t,"Rejected in review"+(reason?": "+reason:"")); ops.upd.push({col:"transactions",id:t.id,data:{rev:true}}); } }
  await DB.apply(ops); toast(`${list.length} entr${list.length===1?"y":"ies"} rejected.`); }
function reviewHtml(rows){ const pend=rows.filter(t=>t.status==="pending").length, unrev=rows.filter(t=>t.status==="ok"&&t.rev===false).length, rv=$("#lgRv")?.value||"";
  const W=(S.logRows||[]).filter(t=>t.status==="pending"||(t.status==="ok"&&t.rev===false)).length, D=(S.logRows||[]).filter(t=>!!t.approvedBy||t.status==="rejected"||t.rev===true).length;
  const tabs=`<div class="pills" style="margin-bottom:8px"><button class="pill ${rv===""?"on":""}" data-act="revShow" data-id="">⏳ Waiting for a decision (${W})</button><button class="pill ${rv==="dec"?"on":""}" data-act="revShow" data-id="dec">✓ Decided (${D})</button><button class="pill ${rv==="all"?"on":""}" data-act="revShow" data-id="all">All</button></div>`;
  if(rv==="dec") return tabs+`<p class="hint" style="margin-top:0">${rows.length} decided entr${rows.length===1?"y":"ies"} in these dates — approved ones show “✓ name”, rejected ones are struck through.</p>`+txTable(rows,false,false);
  return tabs+_revBody(rows,pend,unrev); }
function _revBody(rows,pend,unrev){
  return `<div class="ph" style="margin-bottom:6px"><div><b>${reviewOn()?`Review is ON — ${reviewMode()==="hold"?"clerks' entries wait for approval before they change strength":"clerks' entries count at once and wait here to be checked"}`:"Review is OFF — clerks' entries count at once"}</b>
      <p class="hint" style="margin:2px 0 0">${pend} waiting for approval · ${unrev} counted but not yet reviewed. Tick entries (or the box in the heading for all), then approve or reject.</p></div>
    <div class="pills">${isSA()?`<button class="btn s" data-act="reviewDlg">Review setting…</button>`:""}<button class="btn s g" data-act="revOk">✓ Approve selected</button><button class="btn s r" data-act="revNo">✕ Reject selected</button></div></div>`+txTable(rows,false,true); }
const selectedTx = () => { const ids=new Set($$("[data-sel]").filter(x=>x.checked).map(x=>x.dataset.sel)); return [...(S.logRows||[]),...S.recentTx].filter((t,i,a)=>ids.has(t.id)&&a.findIndex(y=>y.id===t.id)===i); };
function reviewDlg(){ const r=ST().review||{};
  modal(`<h3>Review of clerks' entries</h3><form data-form="reviewSet"><label class="ck"><input type="checkbox" id="rvOn" ${r.on?"checked":""}> Switch review ON</label>
    <div class="f" style="margin-top:8px"><label>How it works while ON</label><select id="rvMode"><option value="hold" ${reviewMode()==="hold"?"selected":""}>Entries wait as “pending” — strength changes only after the DQ Office or I approve</option><option value="count" ${reviewMode()==="count"?"selected":""}>Entries change strength at once — they stay in the review list until checked</option></select></div>
    <p class="hint">Your own and the DQ Office's entries never wait. Switching OFF does not touch entries already waiting — approve or reject them.</p>
    <div class="row"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn p">Save</button></div></form>`); }

function cvPanelHtml(){ const rows=schoolList().map(s=>({s,n:(idxAll().filter(r=>r.school===s.code&&r.status==="On roll")).length,cv:idxAll().filter(r=>r.school===s.code&&r.cv).length}));
  return `<div class="panel"><h2>Phone numbers</h2><p class="hint" style="margin-top:0">Some imports put two numbers together without a gap. The portal already shows them split; this button also corrects the saved records.</p><button class="btn" data-act="tidyPhones">Tidy all phone numbers</button></div><div class="panel"><h2>Re-verify categories</h2><p class="hint" style="margin-top:0">Flags every student of a school as “Category to re-verify”. The records stay and nothing in strength changes; they count as <b>incomplete</b> in Data check until the clerk confirms or corrects each category (the student page shows a ✓ button, editing the record or re-importing the school's Excel also clears it).</p>

async function cvSet(code, on){ const R=(await ensureStu(code,true)).filter(r=>on?r.status==="On roll"&&!r.cv:r.cv); if(!R.length){ toast("Nothing to change."); return; }
  const ops=opsNew(); ops.noIdx=true; for(const r of R) ops.upd.push({col:"students",id:r.id,data:{cv:on?"1":DEL}});
  await DB.apply(ops); await ensureStu(code,true); await rebuildIdx(); toast(on?`${R.length} students of ${code} flagged — categories to re-verify.`:`Flags cleared for ${R.length} students of ${code}.`); fillRegion("stBody",true); }

/* Trash: a deleted student record goes here and can be restored; only the Super Admin deletes for ever */
const TRASH_META = ["delAt","delAtMs","delBy","delByName","delReason"];
async function trashLoad(){ try{ S.trash=(await DB.query("trash","delAtMs",">=",0)).sort((a,b)=>(b.delAtMs||0)-(a.delAtMs||0)); }catch(e){ S.trash=[]; toast("Could not read the Trash: "+e.message,true); } fillRegion("trBody",true); }
function trashHtml(){ if(!S.trash){ trashLoad(); return `<p class="mute">Loading the Trash…</p>`; } const T=S.trash;
  return `<div class="ph" style="margin-bottom:6px"><p class="hint" style="margin:0">${T.length} record${T.length===1?"":"s"} in Trash. Deleted student records wait here — <b>Restore</b> puts the record back exactly as it was${isSA()?"; <b>Delete for ever</b> cannot be undone":""}. Strength figures are never affected.</p>
    <div class="pills"><button class="btn s g" data-act="trRestoreSel">↩ Restore selected</button>${isSA()?`<button class="btn s r" data-act="trPurgeSel">Delete selected for ever</button>`:""}</div></div>
    ${T.length?`<table><tr><th><input type="checkbox" data-selall="1" style="width:18px;height:18px"></th><th>#</th><th>Deleted on</th><th>By</th><th>Reason</th><th>School</th><th>Class – Sec</th><th>Adm No</th><th>Name</th><th>Father</th><th></th></tr>
    ${T.map((r,i)=>`<tr><td><input type="checkbox" data-sel="${h(r.id)}" style="width:18px;height:18px"></td><td class="mute">${i+1}</td><td>${fmtDT(r.delAtMs)}</td><td>${h(r.delByName||"")}</td><td>${h(r.delReason||"")}</td><td>${h(r.school)}</td><td>${h(r.cl)}-${h(r.sec)}</td><td>${h(r.admNo)}</td><td><b>${h(r.name)}</b></td><td>${h(r.father)}</td>
      <td style="white-space:nowrap"><button class="btn s g" data-act="trRestore" data-id="${h(r.id)}">↩ Restore</button>${isSA()?` <button class="btn s r" data-act="trPurge" data-id="${h(r.id)}">Delete for ever</button>`:""}</td></tr>`).join("")}</table>`:`<div class="empty">Trash is empty.</div>`}`; }
function stuToTrash(rec, reason){ const ops=opsNew(), d={...rec}; delete d.id; ops.set.push({col:"trash",id:rec.id,data:{...d,delAt:TS,delAtMs:Date.now(),delBy:me().uid,delByName:me().name||"",delReason:reason||""}}); (ops.del||=[]).push({col:"students",id:rec.id});
  ops.set.push({col:"edits",id:newId(),data:{stuId:rec.id,school:rec.school,stuName:rec.name,admNo:rec.admNo||"",changes:[{k:"_trash",l:"Record",from:"in data bank",to:"moved to Trash"+(reason?` (${reason})`:"")}],at:TS,day:isoDay(Date.now()),by:me().uid,byName:me().name||"",role:role()}});
  return ops; }
async function trashRestore(ids){ const T=(S.trash||[]).filter(r=>ids.includes(r.id)); if(!T.length){ toast("Tick at least one record.",true); return; }
  const ops=opsNew(); let dup=0; for(const r of T){ const d={...r}; delete d.id; for(const k of TRASH_META) delete d[k]; if(d.admNo && idxAll().some(x=>x.school===d.school&&norm(x.admNo)===norm(d.admNo))) dup++;

const SORTS = {};
function sortable(table){ if(!table || table.closest(".paper,#rPreview,#printView,.modal") || table.classList.contains("nosort")) return null;
  const head=[...table.rows].find(r=>[...r.cells].length>1 && [...r.cells].every(c=>c.tagName==="TH")); if(!head) return null;
  const rows=[...table.rows].filter(r=>r.rowIndex>head.rowIndex);
  if(rows.some(r=>r.classList.contains("sub")||r.classList.contains("secrow")||r.querySelector("td[colspan]"))) return null;
  const body=rows.filter(r=>!r.classList.contains("tot") && r.cells.length===head.cells.length); return body.length>1?{head,body,tot:rows.filter(r=>!body.includes(r))}:null; }
const cellKey = td => { const t=(td.querySelector("input,select")?.value ?? td.textContent).trim(); const n=t.replace(/[,%\s]/g,"").replace(/^[−–]/,"-"); return /^[-+]?\d+(\.\d+)?$/.test(n)?{n:Number(n)}:{t:t.toLowerCase()}; };
function doSort(table, col, dir){ const S2=sortable(table); if(!S2) return false; const {head,body,tot}=S2;
  body.sort((a,b)=>{ const x=cellKey(a.cells[col]), y=cellKey(b.cells[col]); if(!x.t&&!y.t&&x.t!==""&&y.t!=="") return (x.n-y.n)*dir; if(x.n!==undefined&&y.n!==undefined) return (x.n-y.n)*dir; const xs=x.t??String(x.n), ys=y.t??String(y.n); if(!xs) return 1; if(!ys) return -1; return xs.localeCompare(ys,undefined,{numeric:true})*dir; });
  const parent=body[0].parentNode, anchor=tot.find(r=>r.parentNode===parent&&r.rowIndex>head.rowIndex)||null; for(const r of body) parent.insertBefore(r,anchor);
  if(/^#$/.test(head.cells[0].textContent.trim())) body.forEach((r,i)=>{ if(/^\d+$/.test(r.cells[0].textContent.trim())) r.cells[0].textContent=String(i+1); });
  [...head.cells].forEach((c,i)=>{ c.classList.remove("asc","desc"); if(i===col) c.classList.add(dir>0?"asc":"desc"); }); return true; }
const tblKey = t => { const reg=t.closest("[id]"); return reg ? reg.id+":"+[...reg.querySelectorAll("table")].indexOf(t) : null; };
function reSort(el){ for(const t of el.querySelectorAll("table")){ const s=sortable(t); if(!s) continue; for(const c of s.head.cells) if(c.textContent.trim()&&!c.querySelector("input")) c.classList.add("srt"); const k=tblKey(t); if(k&&SORTS[k]) doSort(t,SORTS[k].col,SORTS[k].dir); } }
document.addEventListener("click", e=>{ const th=e.target.closest("main table th.srt"); if(!th||e.target.closest("input,button,a,[data-act]")) return; const t=th.closest("table"), col=[...th.parentElement.cells].indexOf(th), k=tblKey(t);
  const dir = th.classList.contains("asc") ? -1 : 1; if(doSort(t,col,dir) && k) SORTS[k]={col,dir}; });
new MutationObserver(()=>{ clearTimeout(window.__rsT); window.__rsT=setTimeout(()=>{ const m=document.querySelector("main"); if(m) for(const t of m.querySelectorAll("table")){ if(t.dataset.sw) continue; t.dataset.sw=1; const s=sortable(t); if(s) for(const c of s.head.cells) if(c.textContent.trim()&&!c.querySelector("input")) c.classList.add("srt"); } },150); }).observe(document.documentElement,{childList:true,subtree:true});

function dupOf(rec, exceptId){ const n=norm(rec.name); if(!n) return []; const keys=[rec.fatherCnic,rec.motherCnic,rec.guardianCnic].map(cnicKey).filter(Boolean), pn=[rec.father,rec.mother,rec.guardian].map(norm).filter(Boolean), out=[];
  for(const x of idxAll()){ if(x.id===exceptId||x.status!=="On roll"||norm(x.name)!==n) continue;
    const xk=[x.fatherCnic,x.motherCnic,x.guardianCnic].map(cnicKey).filter(Boolean), xn=[x.father,x.mother,x.guardian].map(norm).filter(Boolean);
    if(keys.some(k=>xk.includes(k)) || (rec.admNo && x.school===rec.school && norm(x.admNo)===norm(rec.admNo))) out.push({r:x,level:"sure"});
    else if(pn.some(k=>xn.includes(k))) out.push({r:x,level:"probable"}); }
  return out; }
function dupAsk(D, again){ const sure=D.some(d=>d.level==="sure");
  modal(`<h3>${sure?"⚠ This student is already in the data bank":"⚠ Possible duplicate"}</h3><p>${sure?"A student with the <b>same name and the same parent CNIC / Adm No</b> is already entered:":"A student with the <b>same name and the same father / mother name</b> is already entered:"}</p>
    <div class="sibs">${D.map(d=>sibCard(d.r)).join("")}</div>
    <p class="hint">If it is the same child, press <b>Cancel</b> — do not enter the child twice. If they are really two different children (e.g. twins with the same name), save it: the entry is <b>flagged for the DQ Office / Super Admin to review</b>.</p>
    <div class="row"><button class="btn p" data-act="closeModal">Cancel — it is the same child</button><button class="btn" id="dupGo">Different child — save and flag for review</button></div>`);
  $("#dupGo").onclick=()=>{ closeModal(); S.dupAck=true; again(); }; }
let dupMemo={src:null,g:[]};
function dupGroups(){ if(dupMemo.src===S.idx) return dupMemo.g; const R=idxAll().filter(r=>r.status==="On roll"), par={}, find=x=>par[x]===x?x:(par[x]=find(par[x]));
  const level={}; for(const r of R) par[r.id]=r.id; const join=(a,b,l)=>{ const x=find(a), y=find(b); if(x!==y) par[x]=y; level[a]=level[a]==="sure"?"sure":l; level[b]=level[b]==="sure"?"sure":l; };
  const by=(f,l)=>{ const M=new Map(); for(const r of R){ for(const k of f(r)){ if(!k) continue; if(M.has(k)) join(M.get(k),r.id,l); else M.set(k,r.id); } } };
  by(r=>[r.fatherCnic,r.motherCnic,r.guardianCnic].map(cnicKey).filter(Boolean).map(k=>norm(r.name)+"|"+k),"sure");
  by(r=>[r.admNo&&r.school+"|adm|"+norm(r.admNo)],"sure");

  const G=new Map(); for(const r of R){ const k=find(r.id); if(!G.has(k)) G.set(k,[]); G.get(k).push(r); }
  const g=[...G.values()].filter(v=>v.length>1 && !v.every(r=>r.dupOk)).map(v=>({kids:sortStu(v), sure:v.some(r=>level[r.id]==="sure"), flagged:v.some(r=>r.dup&&!r.dupOk)})).sort((a,b)=>(b.flagged-a.flagged)||(b.sure-a.sure));
  dupMemo={src:S.idx,g}; return g; }

const TP_MAP = [["name",/student'?s?\s*name|name of (the )?(student|child)|^name/i],["father",/father'?s?\s*name|^father$|f\/name|guardian/i],["cnic",/cnic/i],["cl",/class/i],["gender",/gender|boy\s*\/\s*girl|sex/i],["cat",/rank|category|cat/i],["cur",/present|current|now\s*(at|in)|studying at|school & adm|adm\s*no/i],["c1",/1st|first\s*choice|choice\s*1/i],["c2",/2nd|second\s*choice|choice\s*2/i],["contact",/contact|phone|mobile|cell|whats\s*app/i],["reason",/reason|remarks/i]];
function tfrParseText(t){ const o={}; for(const line of String(t).split(/\n/)){ const m=line.replace(/[*_]/g,"").match(/^\s*([^:：\-–]{2,40})\s*[:：\-–]\s*(.+)$/); if(!m) continue; const lab=m[1].trim(), v=m[2].trim(); if(!v) continue;

  if(!o.contact){ const ph=String(t).match(/(?:\+?92|0)3\d{2}[-\s]?\d{7}/); if(ph) o.contact=ph[0]; }
  if(!o.cnic){ const c=String(t).match(/\d{5}-?\d{7}-?\d/); if(c) o.cnic=c[0]; }

async function aiText(prompt){ const cfg=await loadAi(); if(!cfg.key) return null;
  for(const model of [cfg.model||"gemini-flash-latest","gemini-2.5-flash"]){ const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0}})});
    const j=await r.json(); if(r.status===404) continue; if(!r.ok) throw new Error(j.error?.message||"HTTP "+r.status); return JSON.parse((j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").replace(/^```(json)?|```$/g,"").trim()); } return null; }
const schoolGuess = v => { const n=norm(v); if(!n) return ""; const L2=schoolList(); return (L2.find(s=>norm(s.code)===n)||L2.find(s=>n.includes(norm(s.code)))||L2.find(s=>norm(s.name).includes(n)||n.includes(norm(s.name))))?.code||""; };
function tfrPasteDlg(){ modal(`<h3>📋 Transfer request from a parent's message</h3><p>Paste the parent's WhatsApp message below. The portal fills the request form; <b>check every field</b>, then press “Register request”.</p>
  <textarea id="tpText" rows="10" style="width:100%" placeholder="Paste the message here…"></textarea>
  <p class="hint">Works best when parents use the format message (button “Format message for parents”). Free-form messages are read by the AI if Form reading is switched on in Setup.</p>
  <div class="row"><button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="tfrPasteGo">Fill the form</button></div>`); }
async function tfrPasteGo(){ const t=$("#tpText")?.value||""; if(!t.trim()){ toast("Paste the message first.",true); return; }
  let o=tfrParseText(t); const got=Object.keys(o).length;
  if(got<4){ try{ const a=await aiText(`Extract an inter-school transfer request from this message from a parent in Pakistan (English, Urdu or Roman Urdu). Return ONLY JSON with keys name, father, cnic, cl, gender ("B" or "G"), cat (father's rank/category in words), cur (present school and adm no), c1 (1st choice school), c2, contact (all phone numbers, comma separated), reason. Empty string if missing. Classes are like EYS-I, Pre-I, I…XII.\nMessage:\n${t}`); if(a) o={...a,...Object.fromEntries(Object.entries(o).filter(([,v])=>v))}; }catch(e){ toast("AI could not read it: "+e.message,true); } }
  closeModal(); const set=(id,v)=>{ const el=$("#"+id); if(el&&v!=null&&v!=="") el.value=v; };
  set("taName",o.name); set("taFather",o.father); set("taCon",o.contact?fmtPhones(o.contact):""); set("taRem",[o.reason,o.cnic?"Father CNIC "+o.cnic:""].filter(Boolean).join(" · "));
  if(o.cl){ const lv=allLevels().find(l=>norm(l)===norm(lvlOf({cl:String(o.cl).replace(/^class\s*/i,"")}))||norm(l)===norm(o.cl)); if(lv) set("taCl",lv); }
  if(o.gender){ set("taGen",/^g|girl|f/i.test(o.gender)?"g":"b"); }
  if(o.cat){ const c=cats().find(c=>norm(c)===norm(o.cat))||cats().find(c=>norm(o.cat).includes(norm(c))||norm(c).includes(norm(o.cat))); if(c) set("taCat",c); }
  const cur=schoolGuess(o.cur); if(cur) set("taCur",cur); else if(o.cur){ set("taCur","__other"); $("#taExtW")&&($("#taExtW").hidden=false); set("taExt",o.cur); }
  const am=String(o.cur||"").match(/adm\w*\s*(no\.?)?\s*[:#-]?\s*(\w+)/i); if(am) set("taAdm",am[2]);
  const c1=schoolGuess(o.c1), c2=schoolGuess(o.c2); if(c1) set("taC1",c1); if(c2) set("taC2",c2);
  $("#taName")?.scrollIntoView({block:"center"}); $("#taName")?.focus();
  toast("Form filled from the message — check each field, then Register request."); }

async function ckSecSave(f){ const [code]=f.dataset.k.split("|"); const B=stuOf(code)||[], ops=opsNew(), logs=[]; let n=0;
  const by={}; for(const el of f.querySelectorAll("[data-q]")) (by[el.dataset.q] ||= {})[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;
  for(const [id,v] of Object.entries(by)){ const r=B.find(x=>x.id===id); if(!r||!canEditStu(r)) continue; const d={}, ch=[];
    if(v.gender!==undefined && v.gender!==(r.gender==="g"?"g":"b")){ d.gender=v.gender; ch.push({k:"gender",l:"Gender",from:r.gender==="g"?"G":"B",to:v.gender==="g"?"G":"B"}); }
    if(v.cat!==undefined && v.cat && canonCat(v.cat)!==canonCat(r.cat)){ d.cat=v.cat; ch.push({k:"cat",l:"Category",from:catLabel(r.cat),to:catLabel(v.cat)}); if(r.cv) d.cv=DEL; }
    if(v.ver!==undefined && v.ver!==!!r.ver){ d.ver=v.ver?verTag():DEL; ch.push({k:"ver",l:"Verified",from:r.ver?"yes":"no",to:v.ver?"yes":"no"}); }

    ops.set.push({col:"edits",id:newId(),data:{stuId:id,school:code,stuName:r.name,admNo:r.admNo||"",changes:ch,at:TS,day:isoDay(Date.now()),by:me().uid,byName:me().name||"",role:role()}}); }
  if(!n){ toast("Nothing was changed."); return; } await DB.apply(ops); await ensureStu(code,true); toast(`${n} record${n>1?"s":""} updated.`); fillRegion("chkBody",true); setTimeout(()=>$("#ckDet")?.scrollIntoView({block:"nearest"}),60); }

/* ---------- duplicates: move every extra copy to Trash ---------- */
const filled = r => stuFields().filter(f=>String(r[f.key]??"").trim()).length;
async function dupTrash(groups){ const ops=opsNew(); let n=0; const names=[];
  for(const g of groups){ const full=[]; for(const x of g.kids){ const L2=await ensureStu(x.school); const r=L2.find(y=>y.id===x.id); if(r) full.push(r); }
    if(full.length<2) continue; full.sort((a,b)=>(!!b.ver-!!a.ver)||(filled(b)-filled(a))||(toMs(a.createdAt)-toMs(b.createdAt)));
    for(const r of full.slice(1)){ const o=stuToTrash(r,"duplicate of "+(full[0].admNo||full[0].name)); ops.set.push(...o.set); (ops.del||=[]).push(...(o.del||[])); n++; names.push(r.name); } }
  if(!n){ toast("Nothing to move."); return; } await DB.apply(ops); for(const c of schoolList()) if(S.stu[c.code]) await ensureStu(c.code,true); S.trash=null; audit("Duplicates moved to Trash",`${n}: ${names.slice(0,20).join(", ")}${n>20?"…":""}`); toast(`${n} extra cop${n>1?"ies":"y"} moved to Trash — restore from Students → Trash if needed.`); fillRegion("dupBody",true); }

  <div class="row" style="justify-content:flex-start;margin-top:6px"><button type="button" class="btn p s" data-act="pasteFill" data-id="${kind}">Fill the form below</button><span class="mute mini">Reads the format message exactly; free-form messages are read by AI when Form reading is switched on in Setup.</span></div></div>`;
async function pasteFill(kind){ const t=$("#pb_"+kind)?.value||""; if(!t.trim()){ toast("Paste the message first.",true); return; }
  if(kind==="tfr"){ const tp=document.createElement("textarea"); tp.id="tpText"; tp.value=t; tp.hidden=true; document.body.appendChild(tp); try{ await tfrPasteGo(); }finally{ tp.remove(); } return; }
  let o=tfrParseText(t); if(Object.keys(o).length<4){ try{ const a=await aiText(`Extract a new-admission application from this message from a parent in Pakistan (English, Urdu or Roman Urdu). Return ONLY JSON with keys name, father, cl (class applied for, like EYS-I, Pre-I, I…XII), gender ("B" or "G"), cat (father's rank/category in words), contact (all phone numbers, comma separated), dob (dd-mm-yyyy), reason. Empty string if missing.\nMessage:\n${t}`); if(a) o={...a,...Object.fromEntries(Object.entries(o).filter(([,v])=>v))}; }catch(e){ toast("AI could not read it: "+e.message,true); } }
  const set=(id,v)=>{ const el=$("#"+id); if(el&&v) el.value=v; };
  set("wName",o.name); set("wFather",o.father); set("wCon",o.contact?fmtPhones(o.contact):""); set("wDob",o.dob); set("wRem",o.reason);
  if(o.gender) set("wGen",/^g|girl|f/i.test(o.gender)?"g":"b");
  if(o.cat){ const c=cats().find(c=>norm(c)===norm(o.cat))||cats().find(c=>norm(o.cat).includes(norm(c))||norm(c).includes(norm(o.cat))); if(c) set("wCat",c); else set("wUnit",o.cat); }
  if(o.cl){ const el=$("#wCl"); const v=[...(el?.options||[])].map(x=>x.value).find(l=>norm(l)===norm(lvlOf({cl:String(o.cl).replace(/^class\s*/i,"")}))||norm(l)===norm(o.cl)); if(v) el.value=v; }
  $("#wName")?.focus(); toast("Form filled — check each field, add the Registration No, then Add."); }

function normCfg(c){
  c=clone(c||{}); c.blocks ||= []; const have=new Set(c.blocks.map(b=>b.key));
  for(const k of Object.keys(BLOCKS)) if(!have.has(k)) c.blocks.push({key:k,on:false});
  c.blocks=c.blocks.filter(b=>BLOCKS[b.key]);
  for(const b of c.blocks){ const B=BLOCKS[b.key]; b.opts={...clone(B.opts||{}), ...(b.opts||{})}; if(B.cols && !b.cols) b.cols=[...B.def]; if(b.title===undefined) b.title=B.title; }
  c.asOf ||= ""; c.period ||= {kind:"cutoff"}; c.schools ||= []; c.orientation ||= "landscape"; c.font ||= 11; c.paper ||= "A4"; c.fit=!!c.fit; c.flow=!!c.flow;
  for(const k of ["color","showLogo","showUpdated"]) if(c[k]===undefined) c[k]=true; return c;
}

const num = (x, k) => k==="sd"||k==="net" ? {v:sgt(x), x, z:"+#,##0;-#,##0;0", cls:x<0?"neg":x>0?"pos":""} : {v:nf(x), x};
function statCells(r, cols){ return cols.map(k=> k==="pct" ? {v:r.auth?((r.str/r.auth)*100).toFixed(1)+"%":"–", x:r.auth?r.str/r.auth:0, z:"0.0%"} : k==="inc" ? {v:r.inc?String(r.inc):"–", x:r.inc||0} : num(r[k]??0,k)); }
const tbl = (title, head, rows, extra={}) => ({t:"table", title, head, rows, ...extra});
function schoolModel(code, cols, o){
  const st=schoolStats(code); let cs=[...cols];
  if(o.hideGender && st.gtype!=="mixed") cs=cs.filter(k=>k!=="g"&&k!=="b");
  if(o.incAuto && !st.classes.some(c=>c.inc)) cs=cs.filter(k=>k!=="inc");
  const rows=[]; let grp=null, acc=[];
  const flush=()=>{ if(o.groupTotals && acc.length>1) rows.push({c:[L("total"),...statCells(addUp(acc),cs)],cls:"sub"}); acc=[]; };
  for(const c of st.classes){ if(c.grp!==grp){ flush(); grp=c.grp; } acc.push(c); rows.push({c:[c.cl,...statCells(c,cs)]});
    if(o.sections) for(const x of c.secs) rows.push({c:[`   ${c.cl} - ${x.s}`,...cs.map(k=>["n","inc","wait","pct"].includes(k)?"":num(x[k]??0,k))],cls:"secrow"}); }
  flush(); rows.push({c:[L("gtotal"),...statCells(st,cs)],cls:"tot"});
  return tbl(st.name.toUpperCase(), [L("cl"),...cs.map(k=>L(COLDEF[k]||k))], rows);
}

    rows.push({c:[L("gtotal"),...statCells(addUp(all),b.cols)],cls:"tot"}); return [tbl(b.title,[L("cl"),...b.cols.map(k=>L(COLDEF[k]||k))],rows)]; },

function trendSvg(p){
  if(p.length<2) return `<p class="mute">The trend fills in automatically: one snapshot is saved each day the portal is opened. ${p.length} so far.</p>`;
  const W=760,H=200,l=50,r=14,tp=16,bt=28, vals=p.flatMap(x=>[x.str,x.auth]), lo=Math.min(...vals)*0.98, hi=Math.max(...vals)*1.01;
  const X=i=>l+i*(W-l-r)/(p.length-1), Y=v=>tp+(hi-v)*(H-tp-bt)/(hi-lo||1), line=k=>p.map((q,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(q[k]).toFixed(1)}`).join("");
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#555">${nf(Math.round(v))}</text><line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ddd"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${ticks}<path d="${line("auth")}" fill="none" stroke="#999" stroke-dasharray="4 3" stroke-width="1.5"/><path d="${line("str")}" fill="none" stroke="#0b1f4b" stroke-width="2"/>
    <text x="${l}" y="${H-8}" font-size="10" fill="#555">${p[0].day}</text><text x="${W-r}" y="${H-8}" font-size="10" fill="#555" text-anchor="end">${p.at(-1).day}</text>
    <text x="${W-r}" y="${Y(p.at(-1).str)-6}" font-size="11" text-anchor="end" fill="#0b1f4b">${h(L("str"))} ${nf(p.at(-1).str)}</text><text x="${W-r}" y="${Y(p.at(-1).auth)+14}" font-size="11" text-anchor="end" fill="#777">${h(L("auth"))} ${nf(p.at(-1).auth)}</text></svg>`;
}
const PERSONAL_BLOCKS = new Set(["roll","waitlist","movelist","tfrlist"]);
async function buildReport(c){

  const w=periodWin(c.period.kind,c.period.from,c.period.to); const needTx=c.blocks.some(b=>b.on&&["kpis","movement","movelist","category","schoolwise"].includes(b.key));
  const tx=needTx?await getTx(w):[]; const x={codes:cfgCodes(c), w, tx, plabel:periodLabel(c.period.kind,w)};
  if(c.blocks.some(b=>b.on&&b.key==="feedef")) await loadFeeRets().catch(()=>[]);
  if(c.blocks.some(b=>b.on&&b.key==="roll")) await Promise.all(x.codes.map(code=>ensureStu(code).catch(()=>[])));
  const st=c.asOf ? await asOfState(c.asOf) : null; x.asOf=st?st.day:"";

function blocksHtml(c, R){   // in side-by-side mode, consecutive small blocks share one row

// printable area in CSS px (96 per inch) with 8 mm margins, minus a small safety margin
const PAGE_MM = { A4:[297,210], A3:[420,297] };
function pagePx(paper, orientation){ const [l,s]=PAGE_MM[paper]||PAGE_MM.A4; const [w,h]=orientation==="portrait"?[s,l]:[l,s]; const k=96/25.4*0.97; return [(w-16)*k,(h-16)*k]; }
function fitInfo(w, h, c){ const [W,H]=pagePx(c.paper,c.orientation); const z = c.fit ? Math.min(2, W/w, H/h) : Math.min(1, W/w); return {z, pages:Math.max(1,Math.ceil((h*z-1)/H))}; }
function printHtml(html, c){
  if(!c?.allow && !canPR()){ toast(PR_MSG,true); return; }
  c={paper:"A4",orientation:"landscape",fit:false,...c};
  const pv=$("#printView"); pv.innerHTML=html+(ST().credit?`<div class="credit-print">${h(ST().credit)}</div>`:""); const paper=pv.querySelector(".paper");
  if(paper){ pv.style.cssText="display:block;position:absolute;left:-99999px;top:0"; paper.style.zoom=""; const f=fitInfo(paper.scrollWidth,paper.scrollHeight,c); pv.style.cssText=""; if(Math.abs(f.z-1)>0.005) paper.style.zoom=f.z.toFixed(3); }
  let st=$("#pageStyle"); if(!st){ st=document.createElement("style"); st.id="pageStyle"; document.head.appendChild(st); }
  st.textContent=`@page{size:${c.paper} ${c.orientation};margin:8mm}`;
  try{ window.print(); }catch(e){ toast("Printing is blocked here — it works on your deployed site.",true); }
}

async function loadXLSX(){ if(window.XLSX) return window.XLSX; await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=XLSX_URL; s.onload=res; s.onerror=()=>rej(new Error("Excel library could not load — check the internet connection")); document.head.appendChild(s); }); return window.XLSX; }
const cellX = c => typeof c==="object"&&c!==null ? (c.x ?? c.v) : c;
function tableAoa(t){ return [[t.title||""],...(t.groups?[t.groups.flatMap(([l,n])=>[l,...Array(n-1).fill("")])]:[]),t.head,...t.rows.map(r=>r.c.map(cellX))]; }
function sideBySide(tables, per){ const out=[]; for(let i=0;i<tables.length;i+=per){ const A=tables.slice(i,i+per).map(tableAoa); const hgt=Math.max(...A.map(a=>a.length)); const wid=A.map(a=>Math.max(...a.map(r=>r.length)));
  for(let r=0;r<hgt;r++){ const row=[]; A.forEach((a,j)=>{ const src=a[r]||[]; for(let k=0;k<wid[j];k++) row.push(src[k]??""); row.push(""); }); out.push(row); } out.push([]); } return out; }
function sheetFrom(X, aoa){ const ws=X.utils.aoa_to_sheet(aoa); ws["!cols"]=(aoa[1]||aoa[0]||[]).map((_,i)=>({wch:i===0?22:12})); return ws; }
function addSheet(X, wb, name, aoa){ let n=String(name||"Sheet").replace(/[\\/?*[\]:]/g," ").slice(0,28)||"Sheet", k=n, i=2; while(wb.SheetNames.includes(k)) k=n.slice(0,25)+" "+(i++); X.utils.book_append_sheet(wb, sheetFrom(X,aoa), k); }
async function reportXlsx(c){
  if(!canDL()){ toast(DL_MSG,true); return; }
  try{ const X=await loadXLSX(), R=await buildReport(c), wb=X.utils.book_new();
    for(const {b,parts} of R.blocks){ let aoa=[]; for(const p of parts){ if(p.t==="table") aoa.push(...tableAoa(p),[]); else if(p.t==="grid") aoa.push([p.title||""],...sideBySide(p.tables,p.per)); else if(p.t==="kpis") aoa.push(...p.items.map(i=>[i[0],i[1],i[2]]),[]); else if(p.t==="chart") aoa.push(...tableAoa(p.table)); else if(p.t==="text") aoa.push([p.title],[p.text]); }
      if(aoa.length) addSheet(X,wb,b.title||BLOCKS[b.key].name,[[c.title],[`Updated ${fmtDT(Date.now())} · ${R.x.plabel}`],[],...aoa]); }
    if(!wb.SheetNames.length){ toast("Nothing to export — tick a block.",true); return; }
    X.writeFile(wb, `${(c.name||c.title||"Report").replace(/[^\w-]+/g,"_")}_${isoDay(Date.now())}.xlsx`); toast("Excel report downloaded.");
  }catch(e){ toast("Excel export failed: "+e.message,true); }
}

  opening(){ const code=setupSchool(), sc=S.schools[code]; if(!sc) return "";

  users(){ const Lu=[...S.users].sort((a,b)=>(a.role+a.school+a.name).localeCompare(b.role+b.school+b.name));

       <td><select class="in" data-uf="school" data-id="${h(u.uid)}" ${u.uid===me().uid?"disabled":""}><option ${u.school==="ALL"?"selected":""}>ALL</option>${schoolList(true).map(s=>`<option ${u.school===s.code?"selected":""}>${h(s.code)}</option>`).join("")}</select></td>
       ${PERMS.map(p=>p[0]).map(k=>`<td>${u.role==="superadmin"?`<span class="mute">always</span>`:`<select class="in" data-uf="${k}" data-id="${h(u.uid)}"><option value="" ${!u[k]?"selected":""}>Role default (${permDef(u.role,k)?"allowed":"blocked"})</option><option value="yes" ${u[k]==="yes"?"selected":""}>Allowed</option><option value="no" ${u[k]==="no"?"selected":""}>Blocked</option></select>`}</td>`).join("")}
       <td>${u.role==="clerk"?`<input class="in num" type="number" min="0" placeholder="${h(ST().voidMinutes??15)}" value="${h(u.voidMin??"")}" data-uu="voidMin" data-id="${h(u.uid)}" title="Blank = the general setting">`:`<span class="mute">—</span>`}</td>
       <td>${u.role==="superadmin"?`<span class="mute">always</span>`:["hq","clerk"].includes(u.role)?`<select class="in" data-uu="undoUntil" data-id="${h(u.uid)}"><option value="">${untilOf(u)>Date.now()?(untilOf(u)>Date.parse("2099-01-01")?"Allowed (until revoked)":"Allowed until "+fmtDT(untilOf(u))):"Not allowed"}</option><option value="m15">Allow for 15 minutes</option><option value="m30">Allow for 30 minutes</option><option value="m60">Allow for 1 hour</option><option value="m120">Allow for 2 hours</option><option value="m240">Allow for 4 hours</option><option value="custom">Allow for … minutes (type)</option><option value="d1">Allow for 1 day</option><option value="d7">Allow for 7 days</option><option value="d30">Allow for 30 days</option><option value="forever">Allow until I revoke</option><option value="0">Not allowed</option></select>`:`<span class="mute">—</span>`}</td>
       <td><input type="checkbox" data-uf="active" data-id="${h(u.uid)}" ${u.active?"checked":""} ${u.uid===me().uid?"disabled":""} style="width:20px;height:20px"></td>
       <td>${u.uid===me().uid||u.replacedBy?(u.replacedBy?`<span class="mute">replaced</span> <button class="btn s r" data-act="userDel" data-id="${h(u.uid)}">Delete</button>`:""):`<button class="btn s" data-act="pwReset" data-id="${h(u.uid)}">Reset…</button> <button class="btn s r" data-act="userDel" data-id="${h(u.uid)}">Delete</button>`}</td></tr>`).join("")}</table></div>
       <div class="panel" style="margin-top:12px"><h2>Excel, Word, print & WhatsApp — role defaults</h2><p class="hint" style="margin-top:0"><b>Students' personal data</b> covers every list or page with names, parents, CNICs, phone numbers, addresses and admission forms — it is <b>off</b> for everyone until you tick it here or allow a person above; it needs the Excel / Word / Print switch as well. Strength figures and summaries are not personal. What each role may do unless a user above is set to Allowed or Blocked. Blank forms (Excel templates for import) are always available. Super Admin can always download and print.</p>
       <form data-form="permDefaults"><table><tr><th>Role</th>${PERMS.map(p=>`<th>${p[1]}</th>`).join("")}</tr>${DL_ROLES.map(r=>`<tr><td>${h(ROLES[r])}</td>${PERMS.map(p=>p[0]).map(k=>`<td><input type="checkbox" name="${r}_${k}" ${permDef(r,k)?"checked":""} style="width:20px;height:20px"></td>`).join("")}</tr>`).join("")}</table><div class="row"><button class="btn p">Save role defaults</button></div></form>

  general(){ const st=ST(); return `<div class="panel"><h2>Waiting list</h2><form data-form="waitOpt" class="row" style="justify-content:flex-start"><select class="in" id="sWt" style="width:auto"><option value="on" ${st.waitTyped===false?"":"selected"}>Clerks type a class-wise count on the Entry tab, plus applicants by name</option><option value="off" ${st.waitTyped===false?"selected":""}>Only applicants entered by name (Applicants tab) — no typed counts</option></select><button class="btn p">Save</button></form><p class="hint">Use the second choice once every school enters its applicants by name; the typed counts are then ignored everywhere.</p></div><div class="panel"><h2>Ownership / credit line</h2><p class="hint" style="margin-top:0">Shown at the foot of every page and every printout, e.g. “Designed & developed by …, Regional Director APEIs Peshawar Region”.</p><form data-form="credit" class="row" style="justify-content:flex-start"><input class="in" id="sCredit" style="flex:1;min-width:260px" value="${h(st.credit||"")}" placeholder="Designed & developed by …"><button class="btn p">Save</button></form></div><div class="panel"><h2>General</h2><form data-form="general" class="grid">

      <div class="panel"><div class="ph"><h2>Review of clerks' entries (dual check)</h2><button class="btn" data-act="reviewDlg">Change…</button></div><p style="margin:0">${reviewOn()?`<b class="pos">ON</b> — ${reviewMode()==="hold"?"entries wait for approval before they change strength":"entries count at once and wait in Log → Review entries"}`:`<b>OFF</b> — clerks' entries count at once`}.</p></div>

  labels(){ return `<div class="panel"><h2>Labels & terms</h2><p class="hint">Change the words used in the portal — column headings (on screen, in reports and in Excel), the names on the dashboard boxes and the dashboard headings. The grey text under each box is the original word. Clear a box to go back to it.</p><form data-form="labels">

function qrObj(text){ const q=qrcode(0,"M"); q.addData(text); q.make(); return q; }

function qrPng(text, px=720){ const q=qrObj(text), n=q.getModuleCount(), m=4, cell=Math.floor(px/(n+2*m)), size=cell*(n+2*m); const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,size,size); x.fillStyle="#000"; for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) x.fillRect((k+m)*cell,(r+m)*cell,cell,cell); return c.toDataURL("image/png"); }

function stuOpsForTx(ops, tx, st){
  const k=actDef(tx.action).kind, day=tx.eff||isoDay(Date.now());
  if(k==="in"||k==="apei_in"){
    if(st){ tx.studentId=st.id; ops.upd.push({col:"students",id:st.id,data:{status:"On roll",cl:tx.cl,sec:tx.sec,cat:tx.cat||st.cat||"",leftDate:"",leftReason:"",...(tx.stuExtra||{}),updatedAt:TS}}); }
    else { const id=newId(); tx.studentId=id; ops.set.push({col:"students",id,data:{school:tx.school,admNo:tx.admNo||"",name:tx.name,father:tx.father||"",gender:tx.gender,dob:tx.dob||"",cat:tx.cat||"",cl:tx.cl,sec:tx.sec,admDate:day,status:"On roll",
      prevSchool:tx.ext||tx.fromSchool||"",...(tx.stuExtra||{}),createdAt:TS,updatedAt:TS,by:me().name||""}}); }
  } else if(st){ tx.studentId=st.id;
    if(k==="sec") ops.upd.push({col:"students",id:st.id,data:{sec:tx.toSec,updatedAt:TS}});
    else if(k==="out") ops.upd.push({col:"students",id:st.id,data:{status:"Left",leftDate:day,leftReason:AL(tx.action)+(tx.remarks?" — "+tx.remarks:""),updatedAt:TS}});
    else if(k==="apei_out") ops.upd.push({col:"students",id:st.id,data:{status:"Transferred out",leftDate:day,leftReason:`${AL(tx.action)} → ${tx.toSchool==="__other"?(tx.ext||"other APEI"):tx.toSchool}`,updatedAt:TS}});
  }
}

function catCols(objs, grouped, hideZero){

  appl:["appldate","applicationdate"], unit:["catunit","unit"], contact:["contact","phone","mobile"], status:["status"], marks:["marks"], dq:["remarksbydq","remarksbydqoffice","dqremarks"], admsn:["admsnstatus","admissionstatus"], sch:["remarksbyschool","schoolremarks"],
  school:["school","schoolcode"], seats:["seats","capacity"], g:["girls","girlscurrentstr"], b:["boys","boyscurrentstr"] };
function mapHeader(row){ const m={}; row.forEach((x,i)=>{ const n=norm(x); for(const [k,al] of Object.entries(ALIASES)) if(m[k]===undefined && al.includes(n)) m[k]=i; }); return m; }
async function readSheet(file){ const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]]; return X.utils.sheet_to_json(ws,{header:1,raw:true,defval:""}); }
function findHeader(rows, need){ for(let i=0;i<Math.min(rows.length,10);i++){ const m=mapHeader(rows[i]); if(need.every(k=>m[k]!==undefined)) return {i,m}; } return null; }
async function writeBook(name, sheets, opt){ if(!opt?.template && !canDL()){ toast(DL_MSG,true); return; } const X=await loadXLSX(), wb=X.utils.book_new(); for(const [n,aoa] of sheets) addSheet(X,wb,n,aoa); X.writeFile(wb,name); }
function matchAction(v){ const n=norm(v); return actions().find(a=>norm(a.code)===n||norm(a.label)===n) || actions().find(a=>n && norm(a.label).startsWith(n)); }
function matchClassSec(code, cl, sec){ const o=csOptions(code); const nc=norm(cl), ns=norm(sec);
  return o.find(x=>norm(x.cl)===nc&&norm(x.s)===ns) || o.find(x=>norm(arab(x.cl))===norm(arab(String(cl)))&&norm(x.s)===ns) || o.find(x=>norm(x.s)===ns && lvlOf({cl:x.cl})===lvlOf({cl:String(cl).replace(/-\(/,"(")}) && (!/girls|boys/i.test(cl) || /girls/i.test(cl)===/girls/i.test(x.cl))); }
function matchCat(v){ let s=String(v??"").trim(); if(!s) return {cat:cats()[0], warn:"blank category → 1. "+cats()[0]};
  const m=s.match(/^#?\s*(\d+)\s*[.)\-:]?\s*(.*)$/); if(m && cats()[+m[1]-1] && (!m[2] || norm(cats()[+m[1]-1])===norm(m[2]))) return {cat:cats()[+m[1]-1]};
  if(m && m[2]) s=m[2]; const f=cats().find(c=>norm(c)===norm(s)) || (canonCat(s)!==s && cats().includes(canonCat(s)) ? canonCat(s) : null);
  return f?{cat:f}:{cat:s, bad:true, warn:`category "${s}" is not in the list (use its number 1–${cats().length})`}; }
const parseGender = v => { const n=norm(v), gc=ST().genderCodes||{b:"1",g:"2"}; return ["b","boy","boys","m","male",norm(gc.b)].includes(n)?"b":["g","girl","girls","f","female",norm(gc.g)].includes(n)?"g":""; };

async function tplOpening(){ const aoa=[["School","Class","Section","Seats (blank = school default)","Girls","Boys"]];
  for(const s of schoolList(true)) for(const c of s.classes) for(const x of c.secs) aoa.push([s.code,c.cl,x.s,x.cap??"",x.g||0,x.b||0]);
  await writeBook(`Opening_strength_${isoDay(Date.now())}.xlsx`,[["Opening strength",aoa]]); toast("Downloaded — edit Girls/Boys/Seats, keep School, Class, Section as they are."); }
async function impOpening(file){ let rows; try{ rows=await readSheet(file); }catch(e){ toast("Could not read: "+e.message,true); return; }
  const hd=findHeader(rows,["school","cl","sec","g","b"]); if(!hd){ toast("Columns School, Class, Section, Girls, Boys not found.",true); return; }
  const m=hd.m, cl={}, errs=[], added=[]; let n=0;
  for(const r of rows.slice(hd.i+1)){ const code=String(r[m.school]).trim(); if(!code) continue; const sc=cl[code] ||= S.schools[code]?cloneSchool(code):null; if(!sc){ errs.push(`school ${code}`); continue; }
    const c=sc.classes.find(x=>norm(x.cl)===norm(r[m.cl])); if(!c){ errs.push(`${code} class ${r[m.cl]}`); continue; }
    let x=c.secs.find(z=>norm(z.s)===norm(r[m.sec])); if(!x){ x={s:String(r[m.sec]).trim(),g:0,b:0}; c.secs.push(x); c.inc=(Number(c.inc)||0)+1; added.push(`${code} ${c.cl}-${x.s}`); }
    x.g=Math.max(0,Number(r[m.g])||0); x.b=Math.max(0,Number(r[m.b])||0); const seats=m.seats!==undefined?String(r[m.seats]).trim():""; if(seats) x.cap=Number(seats); else delete x.cap; n++; }
  const ops=opsNew(); for(const sc of Object.values(cl)) if(sc){ const d=clone(sc); delete d.id; ops.set.push({col:"schools",id:sc.code,data:d}); }
  if(n) await DB.apply(ops);
  modal(`<h3>Opening strength imported</h3><p>${n} sections updated.${added.length?` New sections added: ${h(added.join(", "))}.`:""}</p>${errs.length?`<p class="neg">Not found (skipped): ${h(errs.join("; "))}</p>`:""}<div class="row"><button class="btn p" data-act="closeModal">OK</button></div>`); }

async function backupXlsx(){
  try{ toast("Preparing Excel backup…"); const sessFrom=Date.parse((ST().sessionStart||"2026-04-01")+"T00:00");
    const tx=await DB.fetchTx(sessFrom-8*864e5, Date.now()), apps=(await DB.allDocs("waiting")).filter(w=>!w.deleted), tf=await DB.allDocs("transfers");
    const all=schoolList(true).map(s=>schoolStats(s.code));
    const sum=[[L("school"),"Name","Group","Secs",L("auth"),L("str"),L("g"),L("b"),L("sd"),L("w")],...all.map(s=>[s.code,s.name,s.grp,s.n,s.auth,s.str,s.g,s.b,s.sd,s.wait])];
    const secs=[["School","Group","Class","Section","Seats","Opening girls","Opening boys","Live girls","Live boys","Live total",L("sd")]];
    for(const s of schoolList(true)) for(const c of s.classes) for(const x of c.secs){ const v=cur(s.code,c.cl,x.s); secs.push([s.code,c.grp,c.cl,x.s,secCap(s,x),x.g||0,x.b||0,v.g,v.b,v.g+v.b,v.g+v.b-secCap(s,x)]); }
    const wc=[["School","Class","Typed count","Named applicants","Total"]]; for(const s of schoolList(true)) for(const c of s.classes){ const t=waitCount(s.code,c.cl), m=manualWait(s.code,c.cl); if(t) wc.push([s.code,c.cl,m,t-m,t]); }
    const log=[["Date","Entered","School","Action","Class","Section","To","Student","Father","DOB","Gender","Category","Adm No","Remarks","By","Status","Void reason"],...tx.sort((a,b)=>tTime(a)-tTime(b)).map(t=>[fmtD(tTime(t)),fmtDT(t.atMs),t.school,AL(t.action),t.cl,t.sec,t.toSec||(t.toSchool==="__other"?t.ext:t.toSchool)||t.fromSchool||t.ext||"",t.name,t.father||"",t.dob||"",t.gender,t.cat||"",t.admNo||"",t.remarks||"",t.byName||"",t.status,t.voidReason||""])];
    const ap=[["School","Class","Appl Date","Name","Father","Cat / Unit","Contact","DOB","Status","Marks","Remarks by DQ","Admsn Status","Remarks by School","Session"],...apps.map(w=>[w.school,w.cl,w.date,w.name,w.father,w.unit||w.cat||"",w.contact,w.dob,w.status,w.marks,w.dqRemarks,w.admsn,w.schRemarks,w.session])];
    const tr=[["From","Class","To","Into class","Student","Status","Sent by"],...tf.map(t=>[t.from,`${t.fromCl}-${t.fromSec}`,t.to,t.toCl+(t.toSec?"-"+t.toSec:""),t.name,t.status,t.byName])];
    const sn=[["Day",...schoolList(true).map(s=>s.code+" str"),"Total str","Total auth"],...S.snapshots.map(x=>{ let a=0,b=0; const r=[x.day,...schoolList(true).map(s=>{ const d=x.d?.[s.code]; if(d){ a+=d.str; b+=d.auth; } return d?d.str:""; })]; r.push(a,b); return r; })];
    const us=[["Name","Login","Role","School","Active"],...S.users.map(u=>[u.name,u.email,ROLES[u.role]||u.role,u.school,u.active?"Yes":"No"])];
    const se=[["Setting","Value"],...Object.entries(ST()).filter(([k])=>k!=="logo").map(([k,v])=>[k,typeof v==="object"?JSON.stringify(v):String(v)])];
    const ct=[["School","Class","Category","Students"]]; for(const s of schoolList(true)) for(const c of s.classes) for(const [k,v] of Object.entries(classStats(s.code,c).cats)) ct.push([s.code,c.cl,k,v]);
    const F=stuFields(), stu=[["School",...F.map(f=>f.label)]]; for(const s of schoolList(true)){ const R=await ensureStu(s.code).catch(()=>[]); for(const r of R) stu.push([s.code,...F.map(f=>f.key==="gender"?(r.gender==="g"?"G":"B"):f.type==="date"?isoToDmy(r[f.key]):r[f.key]??"")]); }
    await writeBook(`APEIs_Backup_${isoDay(Date.now())}.xlsx`,[["Summary",sum],["Sections",secs],["Category strength",ct],["Students",stu],["Waiting counts",wc],["Log (session)",log],["Applicants",ap],["Transfers",tr],["Daily snapshots",sn],["Users",us],["Settings",se]]);
    toast("Excel backup downloaded.");
  }catch(e){ toast("Backup failed: "+e.message,true); }
}

document.addEventListener("submit", e => { const f=e.target; if(!f.dataset.form) return; e.preventDefault(); Promise.resolve(FORMS[f.dataset.form](f, e.submitter?.value)).catch(err=>toast(err.message,true)); });

/* category figures are entered as TODAY's numbers; the stored base = typed − movements already recorded */
function setCatLive(c, typed, dc, list){ const p=c.cl+"|"; const keys=new Set([...(list||[]),...Object.keys(typed),...Object.keys(c.cat||{}),...Object.keys(dc).filter(k=>k.startsWith(p)).map(k=>k.slice(p.length))]);
  c.cat={}; for(const k of keys){ const v=(typed[k]||0)-(dc[p+k]||0); if(v) c.cat[k]=v; } }
async function impCatOpen(file){ let rows; try{ rows=await readSheet(file); }catch(e){ toast("Could not read: "+e.message,true); return; }
  const hi=rows.findIndex(r=>r.some(x=>norm(x)==="school")&&r.some(x=>norm(x)==="class")); if(hi<0){ toast("Columns School and Class not found.",true); return; }
  const H=rows[hi].map(x=>String(x).trim()), iS=H.findIndex(x=>norm(x)==="school"), iC=H.findIndex(x=>norm(x)==="class");
  const catIdx=H.map((x,i)=>({i,cat:cats().find(c=>norm(c)===norm(x))})).filter(x=>x.cat); const unknown=H.filter((x,i)=>i!==iS&&i!==iC&&x&&!cats().some(c=>norm(c)===norm(x))&&norm(x)!==norm(L("str"))&&norm(x)!=="currentstr");
  const cl={}, errs=[]; let n=0;
  for(const r of rows.slice(hi+1)){ const code=String(r[iS]).trim(); if(!code) continue; const sc=cl[code] ||= S.schools[code]?cloneSchool(code):null; if(!sc){ errs.push("school "+code); continue; }
    const c=sc.classes.find(x=>norm(x.cl)===norm(r[iC])); if(!c){ errs.push(`${code} class ${r[iC]}`); continue; }
    const typed={}; for(const {i,cat} of catIdx){ const v=Number(r[i])||0; if(v) typed[cat]=v; } setCatLive(c,typed,(S.strength[code]||{}).c||{},cats()); n++; }
  const ops=opsNew(); for(const sc of Object.values(cl)) if(sc){ delete sc.id; ops.set.push({col:"schools",id:sc.code,data:sc}); } if(n) await DB.apply(ops);
  modal(`<h3>Category figures imported</h3><p>${n} classes updated.</p>${unknown.length?`<p class="neg">Columns not recognised as categories (ignored): ${h(unknown.join(", "))}. Add them in Setup → Actions & categories first if they are real categories.</p>`:""}${errs.length?`<p class="neg">Not found: ${h(errs.join("; "))}</p>`:""}<div class="row"><button class="btn p" data-act="closeModal">OK</button></div>`); }

/* double-click to unlock a student record (clerks) · Enter on clickable cards */
document.addEventListener("dblclick", e => { if(e.target.closest('[data-dbl="stuEdit"]')){ e.preventDefault(); stuEditConfirm(); } });
document.addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ") && e.target.matches?.('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); } });
/* ---------- auto sign-out after inactivity (protects an unattended PC) ---------- */
let lastAct=Date.now(); for(const ev of ["mousemove","mousedown","keydown","touchstart","scroll"]) document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true});
setInterval(async()=>{ const mins=Number(ST().idleMinutes ?? 30); if(DEMO||!mins||!S.user||S.user.pending||["viewer","superadmin"].includes(role())) return;   // Super Admin and Senior stay signed in until they sign out
  if(Date.now()-lastAct > mins*60e3){ S.idleOut=true; await DB.signOut(); } }, 30e3);

/* =====================================================================
   12) START
   ===================================================================== */
boot();
DB.start().catch(e=>{ $("#app").innerHTML=`<div class="login"><div class="panel"><h2>Could not start</h2><p>${h(e.message)}</p><p class="hint">Check FIREBASE_CONFIG and your internet connection.</p></div></div>`; });

Object.assign(FORMS, EXTRA_FORMS);

}
